<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math">
<title>Step-by-Step Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Fredoka:wght@500;600&display=swap">
<style>
/* System One for kids: same pills, 1px lines, calm grey wells and status dots, scaled up for small fingers and young readers, rounder type, and one soft colour per lesson. One centred column. */
:root{
  --fs:18px; --lh:26px; --s:8px; --u:14px; --sec:28px; --h:48px; --ctl:var(--s) 18px;
  --r-panel:30px; --r-card:22px; --r-box:16px;
  --ease:cubic-bezier(.34,1.4,.64,1);
  --text:#1b1d22; --muted:#7b8090; --faint:#c9ccd4; --rule:#e4e6eb; --page:#fbfbfd; --well:#f1f2f6; --card:#fff; --hover:#e8eaf0;
  --ok:#1fbf5f; --busy:#f5a524; --err:#ef4444; --on-tint:#fff;
  --sans:"Nunito","Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;
  --num:"Fredoka","Nunito","Avenir Next",ui-rounded,sans-serif;
  --math:52px; --key:64px;
  --tint:#3b82f6; --tint-soft:#e5efff;
}
.t0{--tint:#3b82f6; --tint-soft:#e5efff}
.t1{--tint:#f2683c; --tint-soft:#ffebe3}
.t2{--tint:#8b5cf6; --tint-soft:#efe9ff}
.t3{--tint:#9aa0ad; --tint-soft:#eef0f4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --text:#eef0f4; --muted:#9097a6; --faint:#4a4f5c; --rule:#2b2f38; --page:#0e1014; --well:#181b22; --card:#21252e; --hover:#2b303b; color-scheme:dark}
  :root:not([data-theme="light"]) .t0{--tint:#6ea8ff; --tint-soft:#1c2a45}
  :root:not([data-theme="light"]) .t1{--tint:#ff8a63; --tint-soft:#3a2219}
  :root:not([data-theme="light"]) .t2{--tint:#a98bff; --tint-soft:#2a2245}
  :root:not([data-theme="light"]) .t3{--tint:#7b8090; --tint-soft:#23262e}}
:root[data-theme="dark"]{
  --text:#eef0f4; --muted:#9097a6; --faint:#4a4f5c; --rule:#2b2f38; --page:#0e1014; --well:#181b22; --card:#21252e; --hover:#2b303b; color-scheme:dark}
:root[data-theme="dark"] .t0{--tint:#6ea8ff; --tint-soft:#1c2a45}
:root[data-theme="dark"] .t1{--tint:#ff8a63; --tint-soft:#3a2219}
:root[data-theme="dark"] .t2{--tint:#a98bff; --tint-soft:#2a2245}
:root[data-theme="dark"] .t3{--tint:#7b8090; --tint-soft:#23262e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--text);font:500 var(--fs)/var(--lh) var(--sans);min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding-inline:20px;padding-block:24px 48px;display:grid;gap:var(--sec)}
@media (max-width:480px){.wrap{padding-inline:12px}}
h1,h2,h3,p{font-size:var(--fs);font-weight:800;margin:0}
p{font-weight:500}
.label{color:var(--tint);border-bottom:1px solid var(--rule);padding-bottom:var(--s);font-weight:800;font-size:15px}
.muted{color:var(--muted)}
b,strong{font-weight:800}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.rise{animation:rise .5s var(--ease) both}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pop{display:inline-block;animation:pop .45s var(--ease) both}

/* controls */
.ctl{height:var(--h);padding:var(--ctl);border-radius:999px;background:var(--well);display:inline-flex;align-items:center;gap:var(--s);white-space:nowrap;font-weight:700;transition:background .15s,transform .15s}
.ctl:hover{background:var(--hover)}
.ctl:active{transform:scale(.96)}
.ctl[disabled]{color:var(--faint);cursor:default;transform:none}
.ctl.badged{padding-left:var(--s)}
.card .ctl,.panel .ctl{background:var(--card)}
.card .ctl:hover,.panel .ctl:hover{background:var(--hover)}
.ctl.go,.panel .ctl.go{background:var(--tint);color:var(--on-tint)}
.ctl.go:hover{background:var(--tint);filter:brightness(1.06)}
.ctl.go .badge{background:rgba(255,255,255,.25);color:var(--on-tint)}
.badge{min-width:32px;height:32px;border-radius:999px;display:inline-grid;place-items:center;padding:0 var(--s);font-family:var(--num);font-weight:600;background:var(--well);color:var(--text)}
.card .badge,.ctl .badge{background:var(--tint-soft);color:var(--tint)}
.badge.on,.card .badge.on,.ctl .badge.on{background:var(--tint);color:var(--on-tint)}
.bar{display:flex;align-items:center;gap:var(--s);padding:var(--s);background:var(--well);border-radius:999px;flex-wrap:nowrap;min-width:0}
.bar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:block;line-height:32px}
.wrap>*,.panel>*,.lessons>*,.card>*,.bento>*{min-width:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--faint);transition:background .3s}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--busy)} .dot.err{background:var(--err)}

/* panels, cards */
.panel{background:var(--well);border-radius:var(--r-panel);padding:var(--u);display:grid;gap:var(--u)}
.card{background:var(--card);border-radius:var(--r-card);padding:var(--u);display:grid;gap:var(--u)}
.head{display:flex;justify-content:space-between;align-items:center;gap:var(--u);flex-wrap:wrap;padding:0 var(--s)}

/* grade picker: one row that scrolls sideways */
.grades{display:flex;gap:var(--s);overflow-x:auto;padding:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.grades::-webkit-scrollbar{display:none}
.grades button{flex:none;min-width:var(--h);height:var(--h);padding:0 var(--u);border-radius:999px;background:var(--card);font-family:var(--num);font-size:20px;font-weight:500;transition:background .15s,color .15s}
.grades button:hover{background:var(--hover)}
.grades button.on{background:var(--tint);color:var(--on-tint)}
.dotrow{display:flex;justify-content:center;align-items:center;gap:var(--u);font-size:28px;color:var(--tint);flex-wrap:wrap}
.math sup,.workline sup{font-size:.55em}

/* sideways iPad: use the width, keep the number pad beside the problem */
.split,.col{display:grid;gap:var(--u);align-content:start;min-width:0}
.lessons.col{gap:var(--s)}
@media (min-width:900px) and (orientation:landscape){
  .wrap{max-width:1120px}
  .split{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  .panel.split>.col:last-child{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
  .tray{max-width:none}
  :root{--key:60px}
}

/* lesson list */
.lessons{display:grid;gap:var(--s)}
.lesson{display:flex;align-items:center;gap:var(--u);min-height:64px;padding:var(--s) 18px var(--s) var(--s);border-radius:999px;background:var(--card);text-align:left;width:100%;font-weight:800;transition:background .15s,transform .15s}
.lesson:hover{background:var(--tint-soft)}
.lesson:active{transform:scale(.98)}
.lesson .badge{min-width:48px;height:48px;font-size:22px}
.lesson .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson .muted{font-weight:700;font-size:15px}
.lesson.locked{color:var(--muted);cursor:default}
.lesson.locked:hover{background:var(--card)}
.facts{border-radius:var(--r-box);background:var(--well)}
.facts>div{display:flex;justify-content:space-between;align-items:center;gap:var(--u);padding:var(--s) var(--u);min-height:var(--h)}
.facts>div+div{border-top:1px solid var(--rule)}
.facts .k{color:var(--muted);font-size:15px}
.facts .v{font-family:var(--num);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bento{display:grid;grid-template-columns:repeat(3,1fr);border-radius:var(--r-box);background:var(--well)}
.bento>div{padding:var(--u);display:grid;gap:2px}
.bento>div+div{border-left:1px solid var(--rule)}
.bento .k{color:var(--muted);font-size:15px} .bento .v{font-family:var(--num);font-size:32px;line-height:1.2;color:var(--tint)}

/* learn */
.strips{display:grid;gap:var(--s)}
.strip{display:flex;height:44px;border:1px solid var(--text);border-radius:var(--r-box);overflow:hidden}
.strip span{flex:1;border-right:1px solid var(--text)}
.strip span:last-child{border-right:0}
.strip span.f{background:var(--tint)}
.strip span.g{background:color-mix(in srgb,var(--tint) 45%,var(--card))}
.prose{display:grid;gap:var(--s);max-width:60ch}

/* math */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-family:var(--num);font-variant-numeric:tabular-nums}
.fr>span:first-child{border-bottom:2px solid currentColor}
.fr>span{padding:0 .2em}
.math{font-family:var(--num);font-weight:500;font-size:var(--math);line-height:1.2;display:flex;align-items:center;justify-content:center;gap:.35em;flex-wrap:wrap;padding:var(--u) 0}

/* practice */
.steps{display:flex;gap:var(--s);align-items:center;flex:1;justify-content:center;min-width:0;flex-wrap:wrap}
@media (max-width:480px){.steps{gap:4px}.steps .dot{width:10px;height:10px}}
.work{display:grid;border-radius:var(--r-box);background:var(--well)}
.work:empty{display:none}
.workline{display:flex;align-items:center;gap:var(--u);padding:var(--s) var(--u);font-family:var(--num);font-size:24px;line-height:1.2;flex-wrap:wrap;min-width:0}
.workline+.workline{border-top:1px solid var(--rule)}
.workline .k{font-family:var(--sans);font-size:15px;font-weight:800;color:var(--tint);width:56px;flex:none}
.workline.shown{color:var(--muted)}
.workline .wl{flex:1;min-width:0}
.ask{font-family:var(--num);font-size:40px;line-height:1.2;display:flex;align-items:center;justify-content:center;gap:var(--u);flex-wrap:wrap;padding:var(--u) 0}
.ask .q{font-family:var(--sans);font-weight:700;font-size:var(--fs);width:100%;text-align:center}
.slot{min-width:84px;height:64px;padding:0 var(--u);border-radius:var(--r-box);background:var(--well);border:2px solid var(--rule);font-family:var(--num);font-size:40px;display:inline-grid;place-items:center;color:var(--text);transition:border-color .15s,background .15s}
.slot.active{border-color:var(--tint);background:var(--tint-soft)}
.slot.small{min-width:64px}
.fr .slot{margin:var(--s) 0}
.fr.slots>span:first-child{padding-bottom:var(--s)}
.mixed{display:inline-flex;align-items:center;gap:var(--s)}
.note{color:var(--muted);text-align:center;font-size:16px}
.feedback{display:flex;gap:var(--u);align-items:flex-start;padding:var(--u);border-radius:var(--r-box)}
.feedback .dot{margin-top:7px}
.fb-good{background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.fb-bad{background:color-mix(in srgb,var(--err) 12%,var(--card))}
.fb-hint{background:color-mix(in srgb,var(--busy) 14%,var(--card))}
.feedback .fr{font-size:var(--fs)}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s);max-width:460px;width:100%;margin:0 auto}
.tray button{height:var(--key);border-radius:999px;background:var(--card);font-family:var(--num);font-weight:500;font-size:30px;transition:background .15s,transform .12s}
.tray button:hover{background:var(--tint-soft)}
.tray .wide{grid-column:span 2;font-family:var(--sans);font-size:var(--fs);font-weight:700}
.tray button:active{transform:scale(.94);background:var(--tint-soft)}
.actions{display:flex;gap:var(--s);justify-content:center;flex-wrap:wrap}

/* units, scores, summaries */
.unit{display:flex;justify-content:space-between;align-items:center;gap:var(--s);padding:var(--s) var(--s) 0;flex-wrap:wrap}
.unit:not(:first-child){margin-top:var(--s)}
.unit h3{color:var(--tint);font-size:15px}
.unit .ctl{height:40px}
.score{display:inline-flex;align-items:center;gap:6px;flex:none;font-family:var(--num);font-weight:600;white-space:nowrap}
.score b{min-width:32px;height:32px;border-radius:999px;display:inline-grid;place-items:center;font-weight:600;color:#fff;background:var(--sc)}
.score span{font-family:var(--sans);font-weight:800;font-size:15px;color:var(--sc)}
.s4{--sc:var(--ok)} .s3{--sc:#3b82f6} .s2{--sc:var(--busy)} .s1{--sc:var(--err)} .s0{--sc:#9aa0ad}
.bento .of{font-size:.5em;color:var(--muted)}
.probs{display:grid;gap:var(--s)}
.probs details.card{padding:var(--s) var(--u)}
.probs details.card:not([open]){gap:0}
.probs summary{display:flex;align-items:center;gap:var(--u);cursor:pointer;min-height:var(--h);font-weight:800;list-style:none}
.probs summary::-webkit-details-marker{display:none}
.probs summary .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.probs summary .muted{font-size:15px}
.probs .math{--math:32px}
.facts .pattern,.mlist>div{align-items:flex-start}
.facts .pattern>span:first-child,.mlist>div>span{display:grid;gap:2px;min-width:0}

/* pictures for K–2 */
.tf{display:inline-grid;grid-template-columns:repeat(5,22px);grid-auto-rows:22px;border:1px solid var(--text);border-radius:8px;overflow:hidden;gap:1px;background:var(--text)}
.tf i{background:var(--card);display:grid;place-items:center}
.tf i.on::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--tint)}
.bb{display:inline-flex;align-items:flex-end;gap:3px;flex-wrap:wrap;max-width:150px}
.bb .rod{width:10px;height:60px;border-radius:3px;background:var(--tint)}
.bb .cube{width:10px;height:10px;border-radius:2px;background:color-mix(in srgb,var(--tint) 55%,var(--card))}

/* grade bands: K–2 bigger and brighter, 3–5 as designed, 6–8 calmer, 9–12 close to plain System One */
.wrap[data-band="little"]{--fs:21px;--lh:30px;--h:56px;--math:64px;--key:76px}
.wrap[data-band="little"] .ask{font-size:48px}
.wrap[data-band="little"] .slot{font-size:48px;height:76px;min-width:100px}
.wrap[data-band="little"] .lesson{min-height:76px}
.wrap[data-band="little"] .tray button:not(.wide){font-size:36px}
.pop.big{font-size:44px;line-height:1}
.wrap[data-band="middle"]{--fs:17px;--lh:24px;--h:44px;--math:46px;--key:58px;--r-panel:26px;--r-card:20px;--r-box:14px}
.wrap[data-band="middle"] .ask{font-size:36px}
.wrap[data-band="high"]{--fs:15px;--lh:22px;--s:6px;--u:12px;--sec:22px;--h:40px;--math:40px;--key:52px;--r-panel:22px;--r-card:18px;--r-box:12px;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--num:"Helvetica Neue",Helvetica,Arial,sans-serif;font-family:var(--sans)}
#app[data-band="high"],.wrap[data-band="high"] .t0,.wrap[data-band="high"] .t1,.wrap[data-band="high"] .t2{--tint:var(--text);--tint-soft:var(--hover)}
.wrap[data-band="high"] *{font-weight:500}
.wrap[data-band="high"] b,.wrap[data-band="high"] strong,.wrap[data-band="high"] h2,.wrap[data-band="high"] .lesson{font-weight:550}
.wrap[data-band="high"] .label,.wrap[data-band="high"] .unit h3{text-transform:uppercase;color:var(--muted);font-size:12px}
.wrap[data-band="high"] .ask{font-size:30px}
.wrap[data-band="high"] .slot{font-size:30px;height:52px;min-width:72px;border-width:1px}
.wrap[data-band="high"] .slot.active{border-color:var(--text);background:var(--card)}
.wrap[data-band="high"] .lesson{min-height:52px}
.wrap[data-band="high"] .lesson .badge{min-width:36px;height:36px;font-size:16px}
.wrap[data-band="high"] .tray button:not(.wide){font-size:24px}
.wrap[data-band="high"] .ctl.go,.wrap[data-band="high"] .panel .ctl.go{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.wrap[data-band="high"] .bar .badge{min-width:24px;height:24px;font-size:13px}
.wrap[data-band="high"] .bar .ctl.badged{font-size:13px}
.wrap[data-band="high"] .bento .v{font-size:26px}
@media (max-width:480px){ :root{--fs:17px;--math:40px;--key:56px;--h:44px} .ask{font-size:32px} .slot{font-size:32px;height:54px;min-width:68px} .lesson{min-height:56px} .lesson .badge{min-width:40px;height:40px;font-size:18px} .bento .v{font-size:26px} }
@media (max-width:480px){
  .wrap[data-band="little"]{--fs:19px;--math:48px;--key:64px;--h:50px} .wrap[data-band="little"] .ask{font-size:38px} .wrap[data-band="little"] .slot{font-size:38px;height:64px;min-width:80px}
  .wrap[data-band="middle"]{--fs:16px;--math:38px;--key:54px} .wrap[data-band="middle"] .ask{font-size:30px}
  .wrap[data-band="high"]{--fs:15px;--math:34px;--key:50px} .wrap[data-band="high"] .ask{font-size:26px} .wrap[data-band="high"] .slot{font-size:26px;height:48px;min-width:64px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<body>
<div class="wrap" id="app"></div>

<script>
const $ = s => document.querySelector(s);
const gcd = (a,b) => b ? gcd(b, a % b) : a;
const lcm = (a,b) => a*b/gcd(a,b);
const rand = (lo,hi) => lo + Math.floor(Math.random()*(hi-lo+1));
const fr = (n,d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;

// ---- saved progress (this iPad only) ----
let save = {xp:0, streak:0, last:"", done:0, lessons:{}};
try { save = Object.assign(save, JSON.parse(localStorage.getItem("stepmath") || "{}")); } catch(e){}
if (save.done && !save.lessons.add) save.lessons.add = save.done; // older saves
// lesson summaries live under their own key and are written only when a run finishes, so typing stays fast
try { save.reports = JSON.parse(localStorage.getItem("stepmath-reports") || "null") || save.reports || {}; } catch(e){}
function persist(all){
  const {reports, ...rest} = save;
  try { localStorage.setItem("stepmath", JSON.stringify(rest)); } catch(e){}
  if (!all) return;
  try { localStorage.setItem("stepmath-reports", JSON.stringify(reports || {})); }
  catch(e){ // storage full: keep the 25 newest summaries
    const keep = Object.entries(reports || {}).sort((a,b) => b[1].date - a[1].date).slice(0, 25);
    save.reports = Object.fromEntries(keep);
    try { localStorage.setItem("stepmath-reports", JSON.stringify(save.reports)); } catch(e2){}
  }
}

// ---- problem generator: a/b + c/d or a/b − c/d ----
function makeProblem(i, op){
  let b, d;
  for(;;){
    b = rand(2,12); d = rand(2,12);
    if (b === d || lcm(b,d) > 24) continue;
    const multiple = b % d === 0 || d % b === 0;
    if (i === 0 && !multiple) continue;          // first problem: easy kind
    if (i >= 2 && multiple && Math.random() < .6) continue; // later: mostly harder kind
    break;
  }
  const pickTop = den => { let n; do { n = rand(1, den-1); } while (gcd(n,den) !== 1); return n; };
  let a = pickTop(b), c = pickTop(d), L = lcm(b,d);
  let A = a*(L/b), C = c*(L/d);
  if (op === "−"){
    if (A === C) return makeProblem(i, op);
    if (A < C) { [a,b,c,d,A,C] = [c,d,a,b,C,A]; } // keep the answer positive
  }
  const S = op === "−" ? A - C : A + C;
  return {a,b,c,d,L,A,C,S,op};
}

function finalForm(p){
  const g = gcd(p.S, p.L), n = p.S/g, d = p.L/g;
  return { whole: Math.floor(n/d), num: n % d, den: d };
}
function showFinal(f){
  if (f.num === 0) return `${f.whole}`;
  return (f.whole ? `${f.whole} ` : "") + fr(f.num, f.den);
}

// ---- the steps; each knows the right answer and the common wrong ones ----
function stepsFor(p){
  const {a,b,c,d,L,A,C,S,op} = p, sub = op === "−", ka = L/b, kc = L/d, F = finalForm(p);
  const rewrite = (n, den, k, N, which) => ({
    label: `Step ${which+1} · Rewrite ${which===1?"the first":"the second"} fraction`,
    ask: () => `${fr(n,den)} <span>=</span> <span class="fr slots"><span>${slot("x")}</span><span>${L}</span></span>`,
    note: `Make ${L} the bottom number.`,
    check: v => {
      const x = v.x;
      if (x === N) return {ok:true};
      if (x === n) return {kind:"Changed the bottom but not the top",
        msg:`You changed the bottom from ${den} to ${L}, but kept the top as ${n}. Whatever you multiply the bottom by, multiply the top by the same number.`};
      if (x === n + (L-den)) return {kind:"Added instead of multiplied",
        msg:`It looks like you added ${L-den} to the top because the bottom went up by ${L-den}. Fractions stay equal when we <b>multiply</b> top and bottom by the same number. What times ${den} makes ${L}?`};
      return {kind:"Rewriting a fraction",
        msg:`Not quite. Ask: ${den} × <b>?</b> = ${L}. Then multiply the top, ${n}, by that same number.`};
    },
    hint: `${den} × ? = ${L}. Whatever you multiply the bottom by, do the same to the top.`,
    answer: {x:N},
    explain: `${den} × ${k} = ${L}, so ${n} × ${k} = ${N}.`,
    work: () => `${fr(n,den)} = ${fr(N,L)} <span class="muted">(× ${k})</span>`
  });

  return [
    { label:"Step 1 · Find a common denominator",
      ask: () => `<span class="q">Smallest number that both ${b} and ${d} go into:</span> ${slot("x")}`,
      note: "This is the least common denominator (LCD).",
      check: v => {
        const x = v.x;
        if (x === L) return {ok:true};
        if (x === b + d) return {kind:"Added the denominators",
          msg:`It looks like you added ${b} + ${d}. The bottom number tells the <b>size of the pieces</b>, so we can't add them. We need a number that both ${b} and ${d} divide into evenly.`};
        if (sub && x === Math.abs(b - d)) return {kind:"Subtracted the denominators",
          msg:`It looks like you subtracted ${Math.max(b,d)} − ${Math.min(b,d)}. The bottom number tells the <b>size of the pieces</b>, so we don't subtract it. We need a number that both ${b} and ${d} divide into evenly.`};
        if (x > 0 && x % b === 0 && x % d === 0) return {kind:"Common denominator, but not the least",
          msg:`${x} works, because both ${b} and ${d} go into it. But there is a <b>smaller</b> one, and smaller numbers make the rest easier. Try again.`};
        const bad = x % b !== 0 ? b : d;
        return {kind:"Finding the LCD",
          msg: x > 0 ? `${bad} doesn't go into ${x} evenly (${x} ÷ ${bad} has a remainder). Both bottom numbers must divide into it.` : "Type a number first."};
      },
      hint: `Count by ${Math.max(b,d)}s: ${[1,2,3,4].map(i=>i*Math.max(b,d)).join(", ")}… Stop at the first one that ${Math.min(b,d)} also goes into.`,
      answer: {x:L},
      explain: `Counting by ${Math.max(b,d)}s, the first number ${Math.min(b,d)} also goes into is ${L}.`,
      work: () => `LCD of ${b} and ${d} is <b>${L}</b>`
    },
    rewrite(a,b,ka,A,1),
    rewrite(c,d,kc,C,2),
    { label: sub ? "Step 4 · Subtract" : "Step 4 · Add",
      ask: () => `${fr(A,L)} ${op} ${fr(C,L)} = <span class="fr slots"><span>${slot("n")}</span><span>${slot("d")}</span></span>`,
      note: "Fill in the top and the bottom.",
      check: v => {
        if (v.n == null || v.d == null) return {soft:true, msg:"Fill in both boxes, the top and the bottom."};
        if (v.n === S && v.d === L) return {ok:true};
        if (!sub && v.d === 2*L) return {kind:"Added the denominators",
          msg:`You added the bottoms too (${L} + ${L}). The pieces are already the same size, ${L}ths, so the bottom stays <b>${L}</b>. Think: ${A} slices + ${C} slices of the same pizza = ${S} slices, still ${L}ths.`};
        if (sub && v.d === 0) return {kind:"Subtracted the denominators",
          msg:`You subtracted the bottoms too (${L} − ${L} = 0). The pieces are already the same size, ${L}ths, so the bottom stays <b>${L}</b>. Think: ${A} slices take away ${C} slices = ${S} slices, still ${L}ths.`};
        if (v.d !== L) return {kind:"Changed the denominator",
          msg:`When the bottoms match, the bottom stays the same: <b>${L}</b>. Only the tops get ${sub ? "subtracted" : "added"}.`};
        if (sub && v.n === A + C) return {kind:"Added instead of subtracting",
          msg:`You added ${A} + ${C}. Look at the sign: this one is a <b>minus</b>.`};
        if (!sub && v.n === Math.abs(A - C)) return {kind:"Subtracted instead of adding",
          msg:`You subtracted. Look at the sign: this one is a <b>plus</b>.`};
        return {kind: sub ? "Subtracting numerators" : "Adding numerators",
          msg:`The bottom is right. Check the top: ${A} ${op} ${C} = ?`};
      },
      hint: `${sub ? "Subtract" : "Add"} only the tops. The bottom stays ${L}.`,
      answer: {n:S, d:L},
      explain: `${A} ${op} ${C} = ${S}, and the bottom stays ${L}.`,
      work: () => `${fr(A,L)} ${op} ${fr(C,L)} = ${fr(S,L)}`
    },
    simplifyStep(S, L, "Step 5 · Simplify")
  ];
}

// simplify S/L to lowest terms or a mixed number; shared by fraction lessons
function simplifyStep(S, L, label){
  const F = finalForm({S, L}), hasWhole = F.whole > 0, fracPart = F.num > 0;
  return { label,
      ask: () => `${fr(S,L)} = <span class="mixed">${slot("w","small")}<span class="fr slots"><span>${slot("n")}</span><span>${slot("d")}</span></span></span>`,
      note: S > L ? "The top is bigger than the bottom, so pull out the wholes. Use the small box for the whole number."
          : S === L ? "Top and bottom are the same. What whole number is that?"
          : gcd(S,L) > 1 ? "Can both numbers be divided by the same number?"
          : "If it can't be simplified, just copy it. Leave the whole-number box empty.",
      check: v => {
        const w = v.w || 0, n = v.n || 0, dd = v.d;
        if (v.n != null && dd == null) return {soft:true, msg:"Fill in the bottom number too."};
        if (dd === 0) return {soft:true, msg:"The bottom can't be 0."};
        const den = dd || 1;
        const equal = (w*den + n) * L === S * den;
        if (!equal){
          return {kind:"Simplifying",
            msg: S > L ? `That's not equal to ${fr(S,L)}. How many whole ${L}s fit into ${S}? That's the whole number. What's left over goes on top.`
                       : `That's not equal to ${fr(S,L)}. Divide the top <b>and</b> the bottom by the same number.`};
        }
        if (dd && n >= dd) return {soft:true, kind:"Mixed number",
          msg:`That's the right amount! Now write it as a mixed number: how many whole ${dd}s fit into ${n}?`};
        if (dd && n > 0 && gcd(n,dd) > 1) return {kind:"Not fully simplified",
          msg:`Same amount, good! But ${fr(n,dd)} can still be simplified: both ${n} and ${dd} divide by ${gcd(n,dd)}.`};
        return {ok:true};
      },
      hint: S >= L ? `${S} ÷ ${L} = ${Math.floor(S/L)} remainder ${S % L}. The remainder goes on top.`
                   : gcd(S,L) > 1 ? `Both ${S} and ${L} can be divided by ${gcd(S,L)}.` : `No number (other than 1) divides both ${S} and ${L}. It's already simplest.`,
      answer: {w: hasWhole ? F.whole : null, n: fracPart ? F.num : null, d: fracPart ? F.den : null},
      explain: S >= L ? `${S} ÷ ${L} = ${Math.floor(S/L)} remainder ${S % L}, then simplify.` : gcd(S,L) > 1 ? `Divide top and bottom by ${gcd(S,L)}.` : "It was already as simple as it gets.",
      work: () => `${fr(S,L)} = <b>${showFinal(F)}</b>`
    };
}

// ---- numbers: the pad types "−" and "." ----
const round6 = x => Math.round(x*1e6)/1e6;
const fmt = x => { const r = round6(x); return (r < 0 ? "−" : "") + String(Math.abs(r)); };
const eq = (a,b) => a != null && b != null && Math.abs(a-b) < 1e-6;
function parseNum(str){
  if (str == null || str === "" || str === "−") return null;
  const n = Number(String(str).replace("−","-"));
  return Number.isFinite(n) ? n : null;
}

// ---- shared step builders ----
// one-box step: the right answer plus known wrong answers, each with its own explanation
function numStep({label, ask, note="", ans, wrong=[], hint, explain, work}){
  return { label, ask: () => ask(slot("x")), note,
    check: v => {
      if (eq(v.x, ans)) return {ok:true};
      for (const [val, kind, msg] of wrong) if (eq(v.x, val)) return {kind, msg};
      return {kind: label, msg:`Not quite. ${hint}`, generic:true};
    },
    hint, answer:{x:ans}, explain, work };
}

const dots = n => `<span class="dots" aria-label="${n} dots">${Array(n).fill("●").join(" ")}</span>`;
const pick = arr => arr[rand(0, arr.length-1)];

  make: () => { const top = den => { let n; do { n = rand(1, den-1); } while (gcd(n,den) !== 1); return n; };

  show: p => `<div class="math">${fr(p.a,p.b)} ÷ ${fr(p.c,p.d)}</div>`,
  steps: ({a,b,c,d}) => [

      ask: () => `${fr(c,d)} → <span class="fr slots"><span>${slot("n")}</span><span>${slot("d")}</span></span>`,
      note:"Flip means the top and bottom trade places.",
      check: v => {
        if (v.n == null || v.d == null) return {soft:true, msg:"Fill in both boxes, the top and the bottom."};
        if (v.n === d && v.d === c) return {ok:true};

        if (v.n === b && v.d === a) return {kind:"Flipped the wrong fraction", msg:"Keep the first fraction. Flip the <b>second</b> one."};

      },
      hint:"Top goes to the bottom, bottom goes to the top.", answer:{n:d, d:c}, explain:`${fr(c,d)} flipped is ${fr(d,c)}.`,
      work: () => `÷ ${fr(c,d)} becomes × ${fr(d,c)}` },
    { label:"Multiply",
      ask: () => `${fr(a,b)} × ${fr(d,c)} = <span class="fr slots"><span>${slot("n")}</span><span>${slot("d")}</span></span>`,
      note:"Top times top, bottom times bottom.",
      check: v => {

    numStep({label:"Add them", ask:s=>`${a*a} + ${b*b} = c² = ${s}`, ans:c*c,
      hint:"Add the two squares.", explain:`${a*a} + ${b*b} = ${c*c}.`, work:()=>`c² = ${c*c}`}),
    numStep({label:"Square root", ask:s=>`c = √${c*c} = ${s}`, ans:c,
      wrong:[[a+b,"Added the legs","You can't just add the legs. Find the number that times itself makes "+c*c+"."],[c*c/2,"Square root","Square root isn't half. What number times itself is "+c*c+"?"]],
      hint:`What number times itself makes ${c*c}?`, explain:`${c} × ${c} = ${c*c}, so c = ${c}.`, work:()=>`c = <b>${c}</b>`})
  ],
  learn:[{h:"a² + b² = c²", body:`<div class="math">3² + 4² = c²</div><div class="prose"><p>In a right triangle, square the two short sides and add: 9 + 16 = 25.</p><p>Then take the square root: c = 5, because 5 × 5 = 25.</p></div>`}]
};

const twoNums = (p, qn, kindSum, kindProd) => v => {
  if (v.m == null || v.n == null) return {soft:true, msg:"Fill in both boxes."};
  if ((v.m === p && v.n === qn) || (v.m === qn && v.n === p)) return {ok:true};
  if (v.m * v.n === p*qn) return {kind:kindSum, msg:`${v.m} × ${v.n} = ${p*qn}, good. But ${v.m} + ${v.n} = ${v.m+v.n}, not ${p+qn}. Try another pair.`};
  if (v.m + v.n === p+qn) return {kind:kindProd, msg:`${v.m} + ${v.n} = ${p+qn}, good. But ${v.m} × ${v.n} = ${v.m*v.n}, not ${p*qn}. Try another pair.`};
  return {kind:"Factoring", msg:`List pairs that multiply to ${p*qn}, then check which pair adds to ${p+qn}.`};
};
const G9_FACTOR = {
  make: () => { const p = rand(1,9), qn = rand(p,9); return {p, qn}; },
  show: ({p,qn}) => `<div class="math">x² + ${p+qn}x + ${p*qn}</div><p class="note">Factor it.</p>`,
  steps: ({p,qn}) => [
    { label:"Find the two numbers", ask: () => `${q(`They multiply to ${p*qn} and add to ${p+qn}:`)}${slot("m")} and ${slot("n")}`,
      note:"Order doesn't matter.", check: twoNums(p, qn, "Right product, wrong sum", "Right sum, wrong product"),
      hint:`Which pair of factors of ${p*qn} adds up to ${p+qn}?`, answer:{m:p, n:qn}, explain:`${p} × ${qn} = ${p*qn} and ${p} + ${qn} = ${p+qn}.`,
      work: () => `${p} and ${qn}` },
    { label:"Write the factors", ask: () => `(x + ${slot("m")})(x + ${slot("n")})`,
      note:"Use the two numbers you found.", check: twoNums(p, qn, "Writing the factors", "Writing the factors"),
      hint:`Put ${p} in one and ${qn} in the other.`, answer:{m:p, n:qn}, explain:`(x + ${p})(x + ${qn}).`,
      work: () => `<b>(x + ${p})(x + ${qn})</b>` }
  ],
  learn:[{h:"Multiply to c, add to b", body:`<div class="math">x² + 7x + 12</div><div class="prose"><p>Find two numbers that multiply to 12 and add to 7. Try pairs: 1 and 12, 2 and 6, 3 and 4. 3 + 4 = 7.</p><p>So it factors to (x + 3)(x + 4).</p></div>`}]
};

const G10_DIST = {
  make: () => { let [dx,dy] = pick(TRIPLES); if (Math.random() < .5) [dx,dy] = [dy,dx]; const x1 = rand(0,6), y1 = rand(0,6); return {x1, y1, x2:x1+dx, y2:y1+dy, dx, dy, d: Math.hypot(dx,dy)}; },
  show: p => `<div class="math">(${p.x1}, ${p.y1}) to (${p.x2}, ${p.y2})</div><p class="note">How far apart are the two points?</p>`,
  steps: ({x1,y1,x2,y2,dx,dy,d}) => [
    numStep({label:"Change in x", ask:s=>`${x2} − ${x1} = ${s}`, ans:dx,
      wrong:[[x2+x1,"Added instead of subtracted","Distance across is the <b>difference</b>: subtract."]],
      hint:`${x2} − ${x1}.`, explain:`${x2} − ${x1} = ${dx}.`, work:()=>`Across: ${dx}`}),
    numStep({label:"Change in y", ask:s=>`${y2} − ${y1} = ${s}`, ans:dy,
      wrong:[[y2+y1,"Added instead of subtracted","Distance up is the <b>difference</b>: subtract."]],

    numStep({label:"Square and add", ask:s=>`${dx}² + ${dy}² = ${s}`, ans:dx*dx+dy*dy,
      wrong:[[2*dx+2*dy,"Squared as times 2","Squared means a number times itself."],[dx+dy,"Forgot to square","Square each one first."]],
      hint:`${dx*dx} + ${dy*dy}.`, explain:`${dx*dx} + ${dy*dy} = ${dx*dx+dy*dy}.`, work:()=>`${dx}² + ${dy}² = ${dx*dx+dy*dy}`}),
    numStep({label:"Square root", ask:s=>`d = √${dx*dx+dy*dy} = ${s}`, ans:d,
      wrong:[[dx+dy,"Added the sides","The straight line is shorter than going across and up."]],

  ],
  learn:[{h:"It's a hidden right triangle", body:`<div class="math">(1, 2) to (4, 6)</div><div class="prose"><p>Go across 4 − 1 = 3 and up 6 − 2 = 4. Those are the legs of a right triangle.</p><p>3² + 4² = 25, and √25 = 5. The points are 5 apart.</p></div>`}]
};

const G11_SEQ = {
  make: () => ({a1: rand(1,20), d: rand(2,9), n: rand(10,30)}),
  show: ({a1,d,n}) => `<div class="math">${[0,1,2,3].map(k=>a1+k*d).join(", ")}, …</div><p class="note">Find term number ${n}.</p>`,
  steps: ({a1,d,n}) => [

      hint:`${a1+d} − ${a1}.`, explain:`Each term goes up by ${d}.`, work:()=>`d = ${d}`}),
    numStep({label:"Count the jumps", ask:s=>`${q(`From term 1 to term ${n}, how many jumps?`)}${s}`, ans:n-1,
      wrong:[[n,"Off by one",`Term 1 is where you start, so it's ${n} − 1 jumps.`]],
      hint:`${n} − 1.`, explain:`${n} − 1 = ${n-1} jumps.`, work:()=>`${n-1} jumps`}),
    numStep({label:"Total climb", ask:s=>`${n-1} × ${d} = ${s}`, ans:(n-1)*d,
      hint:`${n-1} jumps of ${d}.`, explain:`${n-1} × ${d} = ${(n-1)*d}.`, work:()=>`${n-1} × ${d} = ${(n-1)*d}`}),

const G12_POWER = {
  make: () => ({a: rand(2,9), n: rand(2,6)}),
  show: ({a,n}) => `<div class="math">f(x) = ${a}x<sup>${n}</sup></div><p class="note">Find f′(x).</p>`,
  steps: ({a,n}) => [
    numStep({label:"Bring the exponent down", ask:s=>`${n} × ${a} = ${s}`, ans:a*n,
      wrong:[[a+n,"Added instead of multiplied","Multiply the coefficient by the exponent."]],
      hint:`${n} × ${a}.`, explain:`${n} × ${a} = ${a*n}.`, work:()=>`New coefficient: ${a*n}`}),
    numStep({label:"Lower the exponent", ask:s=>`${n} − 1 = ${s}`, ans:n-1,
      wrong:[[n+1,"Raised the exponent","For a derivative the exponent goes <b>down</b> by 1."]],
      hint:`${n} − 1.`, explain:`${n} − 1 = ${n-1}.`, work:()=>`New exponent: ${n-1}`}),
    { label:"Write f′(x)", ask: () => `f′(x) = ${slot("c")}x<sup>${slot("e","small")}</sup>`, note:"Use your two answers.",
      check: v => {
        if (v.c == null || v.e == null) return {soft:true, msg:"Fill in both boxes."};
        if (v.c === a*n && v.e === n-1) return {ok:true};
        if (v.c === a) return {kind:"Forgot to multiply", msg:`Multiply ${a} by the exponent ${n} first.`};
        if (v.e === n) return {kind:"Kept the exponent", msg:"Lower the exponent by 1."};
        return {kind:"Power rule", msg:`Coefficient ${a} × ${n}, exponent ${n} − 1.`};
      },
      hint:`${a*n}x to the ${n-1}.`, answer:{c:a*n, e:n-1}, explain:`f′(x) = ${a*n}x<sup>${n-1}</sup>.`,
      work: () => `f′(x) = <b>${a*n}x<sup>${n-1}</sup></b>` }
  ],
  learn:[{h:"The power rule", body:`<div class="math">f(x) = 3x<sup>4</sup></div><div class="prose"><p>Bring the exponent down and multiply: 4 × 3 = 12. Then lower the exponent by 1: 4 − 1 = 3.</p><p>f′(x) = 12x<sup>3</sup>.</p></div>`}]
};

// one "final answer" step built from the last steps; each keeps its own check and mistake messages
function finalStep(steps){
  const parts = steps.map((s,j) => ({s, ids:answerIds(s), sfx: steps.length === 1 ? "" : String(j)}));
  const many = parts.length > 1;
  return { label:"Final answer", base:"Final answer", skipped:true, note:"Steps skipped. Miss it and we'll go step by step.", hint:parts.map(p => p.s.hint).join(" "),
    ask: () => q("Type the final answer.") + parts.map(p => (many ? q(p.s.base) : "") + slotsFor(p.s, p.sfx)).join(""),
    check: v => {
      for (const p of parts){
        const sub = Object.fromEntries(p.ids.map(id => [id, v[id+p.sfx]]));
        if (Object.values(sub).some(x => x == null)) return {soft:true, msg:"Fill in every box."};
        const r = p.s.check(sub);
        if (!r.ok) return many && !r.soft ? {...r, generic:false, kind:`${p.s.base}: ${r.kind}`} : r;
      }
      return {ok:true};
    },
    answer:Object.fromEntries(parts.flatMap(p => p.ids.map(id => [id+p.sfx, p.s.answer[id]]))),
    explain:parts.map(p => p.s.explain).join(" "), work:() => parts.map(p => p.s.work()).join(" &nbsp; ") };
}

// ---- compact builders for the grade 5–12 lessons ----
// one box; the work line is the same sentence with the answer filled in
function ns({l, q:prompt, a, ans, h, w=[], n=""}){
  return numStep({label:l, ask: s => (prompt ? q(prompt) : "") + a(s), note:n, ans, wrong:w, hint:h,
    explain:`${h} That makes ${fmt(ans)}.`, work: () => a(`<b>${fmt(ans)}</b>`)});
}
// several boxes at once; anyOrder when the boxes can be swapped (two roots, two factors)
function ms({l, q:prompt, a, ans, h, w=[], n="", anyOrder=false}){
  const ids = Object.keys(ans);
  const sorted = x => [...x].sort((p,r)=>p-r);
  const same = (x, y) => anyOrder ? sorted(x).every((t,i)=>eq(t, sorted(y)[i])) : x.every((t,i)=>eq(t, y[i]));
  return { label:l, note:n, hint:h,
    ask: () => (prompt ? q(prompt) : "") + a(Object.fromEntries(ids.map(id => [id, slot(id)]))),
    check: v => {
      if (ids.some(id => v[id] == null)) return {soft:true, msg:"Fill in every box."};
      const vals = ids.map(id => v[id]), want = ids.map(id => ans[id]);
      if (same(vals, want)) return {ok:true};
      for (const [bad, kind, msg] of w) if (same(vals, ids.map(id => bad[id]))) return {kind, msg};
      return {kind:l, msg:`Not quite. ${h}`, generic:true};
    },
    answer: ans, explain: h,
    work: () => a(Object.fromEntries(ids.map(id => [id, `<b>${fmt(ans[id])}</b>`]))) };
}
const fslots = () => `<span class="fr slots"><span>${slot("n")}</span><span>${slot("d")}</span></span>`;
// a fraction answer in lowest terms (improper is fine); a minus sign goes on top
function fs({l, q:prompt, a, N, D, h, w=[], n=""}){
  const g = gcd(Math.abs(N), Math.abs(D)), sg = Math.sign(N) * Math.sign(D);
  const RN = sg * Math.abs(N) / g, RD = Math.abs(D) / g;
  return { label:l, note: n || "Write it in lowest terms.", hint:h,
    ask: () => (prompt ? q(prompt) : "") + a(fslots()),
    check: v => {
      if (v.n == null || v.d == null) return {soft:true, msg:"Fill in the top and the bottom."};
      if (v.d === 0) return {soft:true, msg:"The bottom can't be 0."};
      for (const [bn, bd, kind, msg] of w) if (eq(v.n, bn) && eq(v.d, bd)) return {kind, msg};
      if (!eq(v.n * RD, RN * v.d)) return {kind:l, msg:`Not quite. ${h}`, generic:true};
      if (v.d < 0) return {soft:true, msg:"Right amount! Put the minus sign on the top number."};
      if (gcd(Math.abs(v.n), v.d) > 1) return {kind:"Not fully simplified", msg:`Same amount, but it can be simplified: both numbers divide by ${gcd(Math.abs(v.n), v.d)}.`};
      return {ok:true};
    },
    answer:{n:RN, d:RD}, explain:h,
    work: () => a(`<b>${RD === 1 ? fmt(RN) : fr(fmt(RN), RD)}</b>`) };
}
const M = (html, note) => `<div class="math">${html}</div>${note ? `<p class="note">${note}</p>` : ""}`;
const card = (h, math, ...ps) => [{h, body:`${math ? `<div class="math">${math}</div>` : ""}<div class="prose">${ps.map(p => `<p>${p}</p>`).join("")}</div>`}];
const fmtP = x => x < 0 ? `(${fmt(x)})` : fmt(x);              // negatives in parentheses
const sgn = (c, first) => c < 0 ? (first ? "−" : " − ") : (first ? "" : " + ");
// a polynomial from [coefficient, "x²"] pairs, skipping zero terms
const poly = terms => terms.filter(([c]) => c !== 0).map(([c, v], i) => `${sgn(c, i === 0)}${Math.abs(c) === 1 && v ? "" : Math.abs(c)}${v}`).join("") || "0";
const nz = (lo, hi) => { let x; do { x = rand(lo, hi); } while (x === 0); return x; };
const big = n => n.toLocaleString("en-US");
const L = (id, grade, unit, title, def) => ({id, grade, unit, title, ...def});

// ---- lessons: all open, so she can skip ahead or go back. Keep ids stable: saved progress uses them. ----
const FRACTIONS = op => ({ make: i => makeProblem(i, op(i)), steps: stepsFor, show: p => `<div class="math">${fr(p.a,p.b)} ${p.op} ${fr(p.c,p.d)}</div>` });
const BY_GRADE = [G5, G6, G7, G8, G9, G10, G11, G12];
const LESSONS = [
  { id:"k-add", grade:0, title:"Adding within 10", ...K_ADD },
  { id:"g1-ten", grade:1, title:"Make a ten to add", ...G1_TEN },
  { id:"g2-regroup", grade:2, title:"Adding with regrouping", ...G2_REGROUP },
  { id:"g3-split", grade:3, title:"Multiply by breaking apart", ...G3_SPLIT },
  { id:"g4-partial", grade:4, title:"Multiply big numbers", ...G4_PARTIAL },
  { id:"add", grade:5, unit:"Fractions", title:"Adding fractions", learn:LEARN_ADD, ...FRACTIONS(() => "+") },
  { id:"sub", grade:5, unit:"Fractions", title:"Subtracting fractions", learn:LEARN_SUB, ...FRACTIONS(() => "−") },
  { id:"mix", grade:5, unit:"Fractions", title:"Adding and subtracting", learn:LEARN_MIX, ...FRACTIONS(i => i % 2 ? "−" : "+") },
  { id:"g6-divide", grade:6, unit:"Number system", title:"Dividing fractions", ...G6_DIVIDE },
  { id:"g7-eq", grade:7, unit:"Expressions and equations", title:"Two-step equations", ...G7_EQ },
  { id:"g8-pyth", grade:8, unit:"Geometry", title:"Pythagorean theorem", ...G8_PYTH },
  { id:"g9-factor", grade:9, unit:"Polynomials and quadratics", title:"Factoring quadratics", ...G9_FACTOR },
  ...BY_GRADE.flat()
].map((l,k) => ({l, k})).sort((x,y) => x.l.grade - y.l.grade || unitRank(x.l) - unitRank(y.l) || x.k - y.k).map(x => x.l);
// units keep the order they have in each grade's list
function unitRank(l){ const g = BY_GRADE[l.grade-5]; return g ? g.findIndex(m => m.unit === l.unit) : 0; }
const inGrade = g => LESSONS.map((l,i)=>i).filter(i => LESSONS[i].grade === g);
const tintOf = i => inGrade(LESSONS[i].grade).indexOf(i) % 3;
if (save.grade == null) save.grade = 5;
let cur = 0;
const lessonDone = id => (save.lessons && save.lessons[id]) || 0;

    <button class="ctl" data-lesson="${g[k+1]}" ${k<g.length-1?"":"disabled"} aria-label="Next lesson">›</button></div>`;
}
function learnHTML(){

const item = () => st.items[st.i];
const lessonOf = it => LESSONS[idx(it.id)];
const canShow = () => st.mode === "practice" && (st.misses >= 2 || (st.hinted && st.misses >= 1));
function practiceHTML(){
  const it = item(), s = st.steps[st.step], fb = st.feedback, n = st.items.length, test = st.mode === "test";

    <span class="ctl badged"><span class="badge on">${st.i+1}</span>of <span class="mono">${n}</span></span></div>

      ${band() === "little" ? `<span></span><button data-key="0">0</button><span></span>` : `<button data-key="−" aria-label="Negative">−</button><button data-key="0">0</button><button data-key="." aria-label="Decimal point">.</button>`}
      <button data-key="next" class="wide" aria-label="Next box">Next box ⇥</button><button data-key="back" aria-label="Erase">⌫</button></div>
    <div class="actions">
      ${test ? "" : `<button class="ctl badged" data-act="hint" ${st.hintsLeft || st.hinted ? "" : "disabled"}><span class="badge">${st.hintsLeft}</span>Hint${st.hintsLeft === 1 ? "" : "s"}</button>`}
      ${canShow() ? `<button class="ctl" data-act="show">Show me</button>` : ""}
      ${canSkip() ? `<button class="ctl" data-act="skip">${st.skip ? "Show all steps" : "Skip steps"}</button>` : ""}
      <button class="ctl go" data-act="check">Check</button>
    </div>` : `<div class="actions"><button class="ctl go" data-act="nextprob">${st.i < n-1 ? "Next problem" : test ? "Finish test" : "Finish lesson"}</button></div>`}

// ---- runs: practice for one lesson, or a test across a unit or a whole grade ----
function newRun(mode, items, extra){
  st = { mode, items, i:0, vals:{}, active:"x", misses:0, feedback:null, clean:0, mistakes:[], probs:[], xpEarned:0,
         hints:0, shown:0, extra:0, pts:0, maxPts:0, t0:Date.now(), hintsLeft: Math.ceil(items.length/2), ...extra };
  startProblem();
}
function startPractice(){
  const l = LESSONS[cur], sc = lastScore(l.id);
  const n = sc != null && sc <= 1 ? 10 : LESSON_LEN; // she struggled last time: start with more problems
  newRun("practice", Array.from({length:n}, (_,i) => ({id:l.id, p:l.make(i)})), {key:l.id, title:l.title});
}
function shuffle(a){ a = [...a]; for (let i = a.length-1; i > 0; i--){ const j = rand(0,i); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function startTest(key){
  const [kind, g, unit] = key.split(":");
  const list = kind === "unit" ? inGrade(+g).filter(i => (LESSONS[i].unit || "Skills") === unit) : inGrade(+g);
  const n = Math.min(kind === "unit" ? 10 : 12, Math.max(6, list.length * 2));
  const order = shuffle(list);
  const items = shuffle(Array.from({length:n}, (_,k) => { const l = LESSONS[order[k % order.length]]; return {id:l.id, p:l.make(k)}; }));
  cur = order[0];
  newRun("test", items, {key, title: kind === "unit" ? `${unit} test` : `${GRADE_NAME[+g]} check-up`, hintsLeft:0});
}
function startProblem(){ st.step = 0; st.work = []; st.prob = {wrong:0, hints:0, shown:0, t0:Date.now()}; st.skipThis = true; cur = idx(item().id); loadStep(); }

// a run in progress is saved after every change, so leaving mid-lesson loses nothing
function saveRun(){
  if (!st) return;
  const {steps, vals, feedback, ...keep} = st;
  save.run = keep;
  persist();
}
function runIndex(){
  const r = save.run; if (!r) return -1;
  return idx(r.items ? r.items[r.i].id : r.id || ["add","sub","mix"][r.cur]); // older saves stored a position
}
function resumeRun(){
  const r = save.run;
  if (!r || runIndex() < 0) { delete save.run; return; }
  if (!r.items){ // a save from before tests: one lesson, a fixed list of problems
    const id = LESSONS[runIndex()].id;
    st = { mode:"practice", key:id, title:LESSONS[runIndex()].title, items:r.problems.map(p => ({id, p})), i:r.i, clean:r.clean||0, mistakes:[], probs:[],
           xpEarned:r.xpEarned||0, hints:0, shown:0, extra:0, pts:0, maxPts:0, t0:Date.now(), hintsLeft:4 };
    startProblem();
  } else {
    st = Object.assign({}, r);
    cur = idx(item().id);
    const {misses, hinted} = r; loadStep(); // st.step and st.work come back from the save
    Object.assign(st, {misses: misses || 0, hinted: !!hinted});
  }
  view = "practice";
}
function loadStep(){
  st.steps = lessonOf(item()).steps(item().p).map((s,k) => ({...s, base:s.label.replace(/^Step \d+ · /,""), label: /^Step /.test(s.label) ? s.label : `Step ${k+1} · ${s.label}`}));
  if (st.skip && st.skipThis && canSkip() && st.step === 0 && st.steps.length > 1){
    st.steps = [finalStep(st.steps.slice(-(SKIP_LAST[item().id] || 1)))];
  }
  st.vals = {};
  st.misses = 0; st.hinted = false; st.lastTry = 0; st.stepT0 = Date.now();
  st.active = slotIds()[0];
  st.feedback = null;
}
function slotIds(){
  const s = st.steps[st.step]; if (!s) return [];
  return [...s.ask().matchAll(/data-slot="(\w+)"/g)].map(m=>m[1]);
}

// ---- mistake detection: name the slip, not just "wrong" ----
const CATS = {
  sign:   ["Sign mix-up", "The size of the number was right but the sign was flipped.", "Before checking, ask: should this be positive or negative?"],
  reuse:  ["Reused an earlier number", "Typed the answer from an earlier step instead of doing the new one.", "Read what each new step is asking before answering."],
  place:  ["Place value or decimal point", "The digits were right but a zero or the decimal point was in the wrong place.", "Estimate first, then line up place values."],
  off1:   ["Off by one", "Answers exactly 1 away: usually a counting or small adding slip.", "Count again slowly, or check by working backwards."],
  digits: ["Digits mixed up", "The right digits typed in the wrong order.", "Read the answer back before tapping Check."],
  close:  ["Arithmetic slip", "Right method, but the arithmetic was a little off.", "Redo the multiplying or adding carefully; an estimate catches these."],
  swap:   ["Boxes swapped", "The right numbers in the wrong boxes.", "Check which box is which before typing."],
  flip:   ["Fraction flipped", "Top and bottom of the fraction were switched.", "The part goes on top and the whole on the bottom."],
  method: ["Didn't know the step yet", "The answer wasn't close and didn't match a common slip.", "Go back over the lesson cards for this step together."],
};
const SAY = {
  sign: "So close! The size is right. Check the sign: should it be positive or negative?",
  reuse: "That's the number from an earlier step. This step asks for something new.",
  place: "The digits look right. Check where the zeros or the decimal point go.",
  off1: "Just 1 away! Count again carefully.",
  digits: "Right digits, wrong order. Read it back.",
  close: "Close! Redo the arithmetic carefully.",
  swap: "Right numbers, wrong boxes. Swap them.",
  flip: "Flipped! Check which number goes on top.",
};
const digitsOf = x => String(Math.abs(round6(x))).replace(".","").split("").sort().join("");
function diagnose(s, v){
  const A = s.answer, ids = Object.keys(A).filter(k => A[k] != null);
  if (ids.length === 2 && ids.includes("n") && ids.includes("d")){
    if (A.n !== 0 && eq(v.n * A.n, v.d * A.d) && !eq(v.n, A.n)) return "flip";
    if (A.n !== 0 && eq(v.n * A.d, -A.n * v.d)) return "sign";
    return "method";
  }
  if (ids.length > 1){
    const a = ids.map(k => A[k]), x = ids.map(k => v[k]), srt = arr => [...arr].sort((p,q)=>p-q);
    if (srt(a).every((t,i) => eq(t, srt(x)[i]))) return "swap";
    if (ids.every(k => eq(v[k], A[k]) || eq(v[k], -A[k]))) return "sign";
    return "method";
  }
  const a = A[ids[0]], x = v[ids[0]];
  if (x == null) return "method";
  if (a !== 0 && eq(x, -a)) return "sign";
  const earlier = st.steps.slice(0, st.step).flatMap(t => Object.values(t.answer));
  if (earlier.some(e => eq(e, x))) return "reuse";
  if (a !== 0 && [10,100,1000,.1,.01,.001].some(f => eq(x, a*f))) return "place";
  if (Number.isInteger(a) && eq(Math.abs(x-a), 1)) return "off1";
  if (Math.abs(a) >= 10 && digitsOf(x) === digitsOf(a)) return "digits";
  if (a !== 0 && Math.abs(x-a) / Math.abs(a) <= .1) return "close";
  return "method";
}
const typed = v => v.n !== undefined && v.d !== undefined ? (v.d === 1 ? fmt(v.n) : `${fmt(v.n)}/${fmt(v.d)}`)
  : Object.values(v).filter(x => x != null).map(fmt).join(", ");

function check(){
  const s = st.steps[st.step];
  const v = {};
  for (const id of slotIds()) v[id] = parseNum(st.vals[id]);
  if (Object.values(v).every(x => x == null)) { st.feedback = {type:"hint", html:"Tap a box and use the number pad to type your answer."}; return; }
  const r = s.check(v);
  if (r.ok) return pass(false);
  if (r.soft){ st.feedback = {type:"hint", html:r.msg}; return; }
  const now = Date.now(), rushed = st.misses >= 1 && now - st.lastTry < 4000; // quick repeat tries look like guessing
  st.lastTry = now; st.misses++; st.prob.wrong++;
  const cat = r.generic ? diagnose(s, v) : "concept";
  st.mistakes.push({n:st.i+1, step:st.step+1, label:s.base, id:item().id, typed:typed(v), want:typed(s.answer),
    kind: cat === "concept" ? r.kind : CATS[cat][0], cat, msg: cat === "concept" ? r.msg : CATS[cat][1], rushed});
  if (s.skipped){ // the shortcut missed: do this one the long way
    st.skipThis = false; st.pts += 0; st.maxPts++; loadStep();
    st.feedback = {type:"bad", html:`<strong>Not quite.</strong> Let's do this one step by step.`};
    return;
  }
  if (st.mode === "test"){
    st.vals = Object.fromEntries(Object.entries(s.answer).filter(([k,x])=>x!=null).map(([k,x])=>[k, fmt(x)]));
    pass(true);
    st.feedback = {type:"hint", html:`Not this time. The answer was <b>${typed(s.answer)}</b>. ${st.steps[st.step] ? "Keep going." : ""}`};
    return;
  }
  const msg = cat === "concept" ? r.msg : SAY[cat] || (st.hinted ? s.hint : `Read the step again${st.hintsLeft ? ", or tap Hint" : ""}.`);
  st.feedback = {type:"bad", html:`<strong>Not yet.</strong> ${msg}${rushed ? " <br>Slow down a little and read the step again." : ""}${canShow() ? " <br>Stuck? Tap <b>Show me</b>." : ""}`};
}
// hints are limited: about one for every two problems, and only after a first try
function hint(){
  const s = st.steps[st.step];
  if (st.hinted){ st.feedback = {type:"hint", html:`<strong>Hint:</strong> ${s.hint}`}; return; }
  if (!st.hintsLeft){ st.feedback = {type:"hint", html:"No hints left in this lesson. Give it your best try. <b>Show me</b> opens after two tries."}; return; }
  if (!st.misses && Date.now() - st.stepT0 < 15000){ st.feedback = {type:"hint", html:"Give it one try first. The hint opens after you try."}; return; }
  st.hinted = true; st.hintsLeft--; st.hints++; st.prob.hints++;
  st.feedback = {type:"hint", html:`<strong>Hint:</strong> ${s.hint}`};
}
function pass(shown){
  const s = st.steps[st.step];
  // points for the 0–4 score: full for first try, half after a hint or one miss, nothing when shown
  st.pts += shown ? 0 : st.mode === "test" ? 1 : st.misses === 0 ? (st.hinted ? .5 : 1) : st.misses === 1 ? .5 : .25;
  st.maxPts++;
  st.work.push({html:s.work(), shown});
  st.step++;
  if (st.step < st.steps.length){
    const praise = PRAISE[band()][rand(0,4)];
    const msg = shown ? `Here's how: ${s.explain}` : praise;
    loadStep();
    st.feedback = {type: shown ? "hint" : "good", html:`<strong>${msg}</strong>`};
    return;
  }
  const pr = st.prob, clean = !pr.wrong && !pr.hints && !pr.shown;
  const xp = st.mode === "test" ? (pr.wrong ? 5 : 15) : pr.shown ? 5 : pr.wrong ? 10 : pr.hints ? 12 : 15;
  st.xpEarned += xp;
  if (clean) st.clean++;
  st.probs.push({id:item().id, p:item().p, work:st.work, hints:pr.hints, wrong:pr.wrong, shown:pr.shown, ms:Date.now()-pr.t0});
  let more = "";
  if (st.mode === "practice" && (pr.wrong || pr.shown) && st.items.length < MAX_LEN){
    st.items.push({id:item().id, p:lessonOf(item()).make(st.items.length)}); st.extra++;
    more = "<br>I added one more problem like this so you can practice it.";
  }
  st.feedback = {type:"good", html: st.mode === "test" ? `<strong>Problem done. +${xp} XP</strong>`
    : shown ? `Here's how: ${s.explain} <br><strong>+${xp} XP.</strong> That one was tricky, and you finished it.${more}`
    : band() === "little" ? `<span class="pop big">🎉</span> <strong>You solved it! +${xp} XP</strong>${more}`
    : ["middle","high"].includes(band()) ? `<strong>Solved. +${xp} XP</strong>${clean ? " (no mistakes)" : ""}${more}`
    : `<span class="pop">⭐</span> <strong>Solved! +${xp} XP</strong>${clean ? " (no mistakes bonus)" : ""}${more}`};
}
function showMe(){
  const s = st.steps[st.step];
  st.vals = Object.fromEntries(Object.entries(s.answer).filter(([k,v])=>v!=null).map(([k,v])=>[k, fmt(v)]));
  st.shown++; st.prob.shown++;
  pass(true);
}
function nextProblem(){
  if (st.i < st.items.length-1){ st.i++; startProblem(); return; }
  const pct = st.maxPts ? st.pts / st.maxPts : 0, level = levelOf(pct), now = Date.now();
  const rep = {key:st.key, mode:st.mode, title:st.title, date:now, ms:now-st.t0, total:st.items.length, extra:st.extra, clean:st.clean,
    hints:st.hints, shown:st.shown, pct, level, xp:st.xpEarned, probs:st.probs, mistakes:st.mistakes};
  save.xp += st.xpEarned;
  const today = new Date().toDateString(), yest = new Date(now-864e5).toDateString();
  if (save.last !== today) save.streak = save.last === yest ? save.streak + 1 : 1;
  save.last = today;
  const book = st.mode === "test" ? save.tests : save.scores, old = book[st.key];
  book[st.key] = {last:level, best:Math.max(level, old ? old.best : 0), pct, date:now};
  if (st.mode === "practice"){ save.done++; save.lessons[st.key] = lessonDone(st.key) + 1; }
  const cats = {}; st.mistakes.forEach(m => cats[m.kind] = (cats[m.kind]||0) + 1);
  save.log.unshift({key:st.key, mode:st.mode, title:st.title, date:now, level, total:rep.total, hints:rep.hints, shown:rep.shown, cats,
    rushed: st.mistakes.filter(m => m.rushed).length});
  save.log = save.log.slice(0, 60);
  save.reports[st.key] = rep;
  delete save.run; persist(true);
  st.report = rep;
  view = "done";
}

// ---- summaries: what she did, and a closer look for the grown-up ----
const when = t => new Date(t).toLocaleDateString(undefined, {month:"short", day:"numeric"});
const mins = ms => Math.max(1, Math.round(ms / 60000));
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
function summaryLine(rep){
  const pct = Math.round(rep.pct * 100);
  return rep.mode === "test"
    ? `${plural(rep.total, "problem")} in ${plural(mins(rep.ms), "minute")}. ${rep.clean} with every step right. ${pct}% of steps right on the first try.`
    : `${plural(rep.total, "problem")} in ${plural(mins(rep.ms), "minute")}${rep.extra ? `, including ${rep.extra} extra added for practice` : ""}. ${rep.clean} with no mistakes and no hints. ${plural(rep.hints, "hint")} used, "Show me" ${plural(rep.shown, "time")}. ${pct}% of steps right on the first try.`;
}
function reportHTML(rep){
  const groups = {};
  for (const m of rep.mistakes){ const g = groups[m.kind] = groups[m.kind] || {n:0, cat:m.cat, msg:m.msg, label:m.label, list:[]}; g.n++; g.list.push(m); }
  const sorted = Object.entries(groups).sort((a,b) => b[1].n - a[1].n);
  const rushed = rep.mistakes.filter(m => m.rushed).length;
  const lessonsIn = [...new Set(rep.probs.map(p => p.id))];
  const skills = lessonsIn.map(id => { const l = LESSONS[idx(id)]; return l ? `<b>${l.title}</b>` : ""; }).filter(Boolean);
  return `<section class="panel">
    <div class="head"><h2>What you did</h2><span class="muted">${when(rep.date)}</span></div>
    <div class="prose" style="padding:0 5px"><p>${rep.mode === "test" ? `Tested ${skills.join(", ")}.` : `Practiced ${skills.join(", ")}.`}</p><p>${summaryLine(rep)}</p></div>
    <div class="probs">${rep.probs.map((pr,k) => { const l = LESSONS[idx(pr.id)]; if (!l) return "";
      const tag = pr.shown ? ["busy", `shown ${pr.shown}×`] : pr.wrong ? ["err", plural(pr.wrong, "mistake")] : pr.hints ? ["busy", plural(pr.hints, "hint")] : ["ok", "no mistakes"];
      return `<details class="card"><summary><span class="badge">${k+1}</span><span class="name">${rep.mode === "test" ? l.title : `Problem ${k+1}`}</span><span class="dot ${tag[0]}"></span><span class="muted">${tag[1]}</span></summary>
        ${l.show(pr.p)}<div class="work">${pr.work.map((w,j)=>`<div class="workline ${w.shown?"shown":""}"><span class="k">Step ${j+1}</span><span class="wl">${w.html}</span></div>`).join("")}</div></details>`; }).join("")}</div>
  </section>
  <section class="panel">
    <div class="head"><h2>For the grown-up</h2>${scoreChip(rep.level, true)}</div>
    <div class="prose" style="padding:0 5px"><p>Score ${rep.level} of 4: ${LEVELS[rep.level]}. ${["Not yet showing this skill.","Starting to get it, with a lot of help.","Getting there: some steps are solid, others need more practice.","Meets the goal: most steps right on the first try.","Above the goal: nearly every step right on the first try."][rep.level]}</p>
    ${rushed ? `<p>${plural(rushed, "answer")} came very quickly after a miss, which usually means guessing.</p>` : ""}</div>
    ${sorted.length ? `<h3 class="label" style="padding:0 5px">Mistake patterns, most common first</h3>
    <div class="facts" style="background:var(--card)">${sorted.map(([k,g]) => `<div class="pattern"><span><b>${k}</b><span class="k">${g.cat === "concept" ? `${g.label}: ${g.msg}` : `${CATS[g.cat][1]} Tip: ${CATS[g.cat][2]}`}</span></span><span class="v">×${g.n}</span></div>`).join("")}</div>
    <h3 class="label" style="padding:0 5px">Every mistake</h3>
    <div class="facts mlist" style="background:var(--card)">${rep.mistakes.map(m => `<div><span><span class="k">Problem ${m.n} · Step ${m.step} · ${m.label}${rep.mode === "test" && LESSONS[idx(m.id)] ? ` · ${LESSONS[idx(m.id)].title}` : ""}</span><span>Typed <b class="mono">${m.typed}</b>, answer <b class="mono">${m.want}</b>. ${m.kind}${m.rushed ? " (quick retry)" : ""}.</span></span></div>`).join("")}</div>`
    : `<p style="padding:0 5px">No mistakes this time.</p>`}
  </section>`;
}
function doneHTML(){
  const rep = st.report, test = rep.mode === "test", g = inGrade(LESSONS[cur].grade), k = g.indexOf(cur);
  return `<div class="bar"><span class="ctl grow" style="background:none">${rep.title}: complete</span>${statsHTML()}</div>
  <section class="panel">
    <div class="bento" style="background:var(--card)">
      <div><span class="k">Score</span><span class="v">${rep.level}<span class="of"> of 4</span></span><span class="k">${LEVELS[rep.level]}</span></div>
      <div><span class="k">XP earned</span><span class="v">+${rep.xp}</span></div>
      <div><span class="k">${test ? "All steps right" : "No mistakes"}</span><span class="v">${rep.clean}/${rep.total}</span></div>
    </div>
    <div class="actions">${!test && k < g.length-1 ? `<button class="ctl go" data-lesson="${g[k+1]}">Next lesson</button>` : ""}${test ? `<button class="ctl go" data-test="${rep.key}">Take it again</button>` : `<button class="ctl" data-go="practice">Practice again</button>`}<button class="ctl" data-go="home">All lessons</button></div>
  </section>
  ${reportHTML(rep)}`;
}
function reportViewHTML(){
  const rep = save.reports[reportKey];
  return `<div class="bar"><button class="ctl" data-go="${idx(reportKey) >= 0 ? "learn" : "parent"}">Back</button><span class="ctl grow" style="background:none">${rep.title}: ${when(rep.date)}</span></div>
  ${reportHTML(rep)}`;
}
function parentHTML(){
  const totals = {}, cats = {};
  for (const e of save.log) for (const [k,n] of Object.entries(e.cats || {})) totals[k] = (totals[k]||0) + n;
  for (const r of Object.values(save.reports)) for (const m of r.mistakes) cats[m.kind] = cats[m.kind] || m;
  const top = Object.entries(totals).sort((a,b) => b[1]-a[1]).slice(0, 8);
  const weak = LESSONS.map((l,i)=>i).filter(i => { const s = lastScore(LESSONS[i].id); return s != null && s <= 2; });
  const hints = save.log.reduce((a,e) => a + (e.hints||0), 0), rushed = save.log.reduce((a,e) => a + (e.rushed||0), 0);
  return `<div class="bar"><button class="ctl" data-go="home">Home</button><span class="ctl grow" style="background:none">For the grown-up</span></div>
  <section class="panel">
    <div class="head"><h2>Scores by grade</h2><span class="muted">0 to 4</span></div>
    <div class="facts" style="background:var(--card)">${GRADES.map((n,g) => { const a = gradeLevel(g), t = save.tests[testKey(g)]; if (a == null && !t) return "";
      return `<div class="pattern"><span><b>${GRADE_NAME[g]}</b><span class="k">Lesson average ${a == null ? "—" : `${a.toFixed(1)} of 4`} · check-up ${t ? `${t.last}: ${LEVELS[t.last]}` : "not taken"}</span></span>${scoreChip(t ? t.last : a == null ? null : Math.round(a))}</div>`; }).join("") || `<div><span>No lessons finished yet.</span></div>`}</div>
    <p class="muted" style="padding:0 5px">4 Advanced · 3 Proficient · 2 Approaching · 1 Beginning · 0 Not yet. Based on how many steps were right on the first try. Hints count half.</p>
  </section>
  <section class="panel">
    <div class="head"><h2>Mistake patterns</h2><span class="muted">last ${plural(save.log.length, "session")}</span></div>
    ${top.length ? `<div class="facts" style="background:var(--card)">${top.map(([k,n]) => { const m = cats[k]; return `<div class="pattern"><span><b>${k}</b>${m ? `<span class="k">${m.cat === "concept" ? `${m.label}: ${m.msg}` : `${CATS[m.cat][1]} Tip: ${CATS[m.cat][2]}`}</span>` : ""}</span><span class="v">×${n}</span></div>`; }).join("")}</div>` : `<p style="padding:0 5px">No mistakes recorded yet.</p>`}
    <p class="muted" style="padding:0 5px">${plural(hints, "hint")} used${rushed ? `, ${plural(rushed, "quick retry")} that looked like guessing` : ""}.</p>
  </section>
  ${weak.length ? `<section class="panel"><div class="head"><h2>Needs more practice</h2></div><div class="lessons">${weak.map(i => `<button class="lesson" data-lesson="${i}">${scoreChip(lastScore(LESSONS[i].id))}<span class="name">${LESSONS[i].title}</span><span class="muted">${GRADES[LESSONS[i].grade]}</span></button>`).join("")}</div></section>` : ""}
  <section class="panel">
    <div class="head"><h2>Recent sessions</h2></div>
    ${save.log.length ? `<div class="lessons">${save.log.slice(0, 20).map(e => `<button class="lesson" ${save.reports[e.key] ? `data-report="${e.key}"` : "disabled"}>${scoreChip(e.level)}<span class="name">${e.title}</span><span class="muted">${when(e.date)}${e.mode === "test" ? " · test" : ""}</span></button>`).join("")}</div>` : `<p style="padding:0 5px">Nothing yet. Finished lessons and tests show up here.</p>`}
  </section>`;
}

// ---- input ----
function key(k){
  if (view !== "practice" || !st.steps[st.step]) return;
  const ids = slotIds();
  if (k === "next"){ st.active = ids[(ids.indexOf(st.active)+1) % ids.length]; }
  else if (k === "back"){ st.vals[st.active] = String(st.vals[st.active] ?? "").slice(0,-1); }
  else {
    let cur = String(st.vals[st.active] ?? "");
    if (k === "−") cur = cur.startsWith("−") ? cur.slice(1) : "−" + cur;
    else if (k === ".") { if (!cur.includes(".")) cur = (cur === "" || cur === "−" ? cur + "0" : cur) + "."; }
    else if (cur.replace(/[−.]/g,"").length < 6) cur = (cur === "0" ? "" : cur === "−0" ? "−" : cur) + k;
    st.vals[st.active] = cur;
  }
  render();
}
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  if (t.dataset.grade){ save.grade = Number(t.dataset.grade); persist(); }
  else if (t.dataset.lesson){ cur = Math.max(0, Math.min(LESSONS.length-1, Number(t.dataset.lesson))); view = "learn"; learnIdx = 0; }
  else if (t.dataset.test){ startTest(t.dataset.test); view = "practice"; }
  else if (t.dataset.report){ reportKey = t.dataset.report; if (idx(reportKey) >= 0) cur = idx(reportKey); view = "report"; }
  else if (t.dataset.go){
    view = t.dataset.go;
    if (view === "learn") learnIdx = 0;
    if (view === "practice") startPractice();
  }
  else if (t.dataset.learn) learnIdx = Math.max(0, Math.min(LESSONS[cur].learn.length-1, learnIdx + Number(t.dataset.learn)));
  else if (t.dataset.slot){ st.active = t.dataset.slot; }
  else if (t.dataset.key){ return key(t.dataset.key); }
  else if (t.dataset.act === "check") check();
  else if (t.dataset.act === "hint") hint();
  else if (t.dataset.act === "show") showMe();
  else if (t.dataset.act === "nextprob") nextProblem();
  else if (t.dataset.act === "resume") resumeRun();
  else if (t.dataset.act === "skip"){ st.skip = !st.skip; if (st.step === 0 && !st.work.length){ st.skipThis = true; loadStep(); } }
  else return; // a tap on a summary row opens it natively
  render();
});
document.addEventListener("keydown", e => {
  if (view !== "practice") return;
  if (/^\d$/.test(e.key)) key(e.key);
  else if (e.key === "-") key("−");
  else if (e.key === ".") key(".");
  else if (e.key === "Backspace") key("back");
  else if (e.key === "Tab"){ e.preventDefault(); key("next"); }
  else if (e.key === "Enter"){ e.preventDefault(); if (st.steps[st.step]) check(); else nextProblem(); render(); }
});
render();
</script>

</body>
</html>
