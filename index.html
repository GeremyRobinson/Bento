/* Bento. One layout, one spacing grid, one motion language; each grade brings its own colours and pattern.
   Grid: every size is a multiple of 4px. Nested corners are concentric: inner radius = outer radius − the padding between them. */
:root{
  --text:#1b1d22; --muted:#717786; --faint:#c9ccd4; --rule:#e4e6eb; --page:#fbfbfd; --well:#f1f2f6; --card:#fff; --hover:#e8eaf0;
  --ok:#1fbf5f; --busy:#f5a524; --err:#ef4444; --on-tint:#fff;
  --sans:"Nunito","Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;
  --num:"Fredoka","Nunito","Avenir Next",ui-rounded,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.45,.64,1);
  --c0:#3b82f6; --c1:#f2683c; --c2:#8b5cf6; --acc:#f59e0b;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --text:#eef0f4; --muted:#979eae; --faint:#4a4f5c; --rule:#2b2f38; --page:#0e1014; --well:#181b22; --card:#21252e; --hover:#2b303b; color-scheme:dark}}
:root[data-theme="dark"]{--text:#eef0f4; --muted:#979eae; --faint:#4a4f5c; --rule:#2b2f38; --page:#0e1014; --well:#181b22; --card:#21252e; --hover:#2b303b; color-scheme:dark}

/* ---- tokens by age band (sizes only). 3rd–5th is the base. ---- */
.wrap{
  --fs:18px; --lh:26px; --small:15px; --w-bold:800; --w-mid:700;
  --s:8px; --u:16px; --sec:24px; --h:48px; --row:64px; --inset:8px;
  --math:52px; --ask:40px; --slot:64px; --key:64px; --work:24px;
  --r-panel:36px;
}
.wrap[data-band="little"]{--fs:21px;--lh:30px;--small:17px;--h:56px;--row:72px;--math:64px;--ask:48px;--slot:76px;--key:76px;--work:28px;--r-panel:40px}
.wrap[data-band="middle"]{--fs:17px;--lh:24px;--small:14px;--h:44px;--row:56px;--math:46px;--ask:36px;--slot:58px;--key:58px;--work:22px;--r-panel:32px}

  --math:40px;--ask:30px;--slot:52px;--key:52px;--work:20px;--r-panel:28px;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--num:"Helvetica Neue",Helvetica,Arial,sans-serif}
@media (max-width:480px){
  .wrap{--fs:17px;--lh:24px;--u:12px;--sec:16px;--h:44px;--row:56px;--math:40px;--ask:32px;--slot:56px;--key:56px;--work:21px;--r-panel:28px}

.wrap{--l0:#3b82f6;--l1:#f2683c;--l2:#8b5cf6;--la:#f59e0b;--c0:var(--l0);--c1:var(--l1);--c2:var(--l2);--acc:var(--la)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wrap{--c0:color-mix(in srgb,var(--l0) 75%,white);--c1:color-mix(in srgb,var(--l1) 75%,white);--c2:color-mix(in srgb,var(--l2) 75%,white);--acc:color-mix(in srgb,var(--la) 80%,white)}}
.t0{--tint:var(--c0)} .t1{--tint:var(--c1)} .t2{--tint:var(--c2)} .t3{--tint:var(--muted)}
.wrap,.wrap *{--tint-soft:color-mix(in srgb,var(--tint) 13%,var(--card))}
.wrap[data-grade="12"]{--on-tint:var(--page)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);color:var(--text);font:500 18px/26px var(--sans);min-height:100vh;min-height:100dvh}
.wrap{max-width:720px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
  display:grid;gap:var(--sec);font-size:var(--fs);line-height:var(--lh);font-family:var(--sans)}
@media (max-width:480px){.wrap{padding-inline:max(12px,env(safe-area-inset-left))}}
@media (min-width:700px){.wrap{max-width:1180px}}
h1,h2,h3,p{font-size:inherit;font-weight:var(--w-bold);margin:0}
p{font-weight:500}
b,strong{font-weight:var(--w-bold)}
.label{color:var(--tint);border-bottom:1px solid var(--rule);padding-bottom:var(--s);font-weight:var(--w-bold);font-size:var(--small);line-height:20px}
.wrap[data-band="high"] .label{text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
/* optical centering: trim text to its cap height so labels sit dead centre in pills and circles */
.ctl,.badge,.grades button,.score b,.tray button,.slot,.gbadge b,.chip{text-box:trim-both cap alphabetic}

/* ---- motion ---- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.4)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes enter{from{opacity:0;transform:translateY(-8px)}}
@keyframes glow{0%{background:color-mix(in srgb,var(--ok) 30%,transparent)}100%{background:transparent}}
.rise{animation:rise .5s var(--ease) both}
.pop{display:inline-block;animation:pop .45s var(--spring) both}
.pop.big{font-size:44px;line-height:1}
.shake{animation:shake .4s ease}
.enter{animation:enter .45s var(--ease) both}
.workline.enter{animation:enter .45s var(--ease) both, glow 1.2s ease .2s}
::view-transition-old(root){animation:.22s ease both vtOut}
::view-transition-new(root){animation:.38s var(--ease) both vtIn}
@keyframes vtOut{to{opacity:0;transform:scale(.99)}}
@keyframes vtIn{from{opacity:0;transform:translateY(10px)}}
:root[data-dir="fwd"]::view-transition-new(root){animation-name:vtFwd} :root[data-dir="back"]::view-transition-new(root){animation-name:vtBack}
@keyframes vtFwd{from{opacity:0;transform:translateX(28px)}} @keyframes vtBack{from{opacity:0;transform:translateX(-28px)}}

/* ---- controls ---- */
.ctl{height:var(--h);padding:0 calc(var(--u) + 2px);border-radius:999px;background:var(--well);display:inline-flex;align-items:center;justify-content:center;gap:var(--s);white-space:nowrap;font-weight:var(--w-mid);transition:background .15s,transform .2s var(--spring),box-shadow .15s}
.ctl:hover{background:var(--hover)}
.ctl:active{transform:scale(.95)}
.ctl[disabled]{color:var(--faint);cursor:default;transform:none}
.ctl.badged{padding-left:var(--inset)}
.card .ctl,.panel .ctl{background:var(--card)}
.card .ctl:hover,.panel .ctl:hover{background:var(--hover)}
.ctl.go,.panel .ctl.go,.card .ctl.go{background:var(--tint);color:var(--on-tint)}
.ctl.go:hover{filter:brightness(1.06)}
.ctl.go .badge{background:rgba(255,255,255,.25);color:var(--on-tint)}
.wrap[data-band="high"] .ctl.go{box-shadow:none}
.badge{min-width:var(--badge);height:var(--badge);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 var(--s);font-family:var(--num);font-weight:600;background:var(--well);color:var(--text);flex:none;font-variant-numeric:tabular-nums}
.card .badge,.ctl .badge{background:var(--tint-soft);color:var(--tint)}
.badge.on,.card .badge.on,.ctl .badge.on{background:var(--tint);color:var(--on-tint)}
.bar{display:flex;align-items:center;gap:var(--s);padding:var(--inset);background:var(--well);border-radius:999px;min-width:0}
.ctl.circ{width:var(--h);padding:0;flex:none;background:var(--card);color:var(--tint);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ctl.circ:hover{background:var(--tint-soft)}
.ctl.circ svg{width:22px;height:22px;display:block}
.ctl.circ[disabled]{background:color-mix(in srgb,var(--card) 45%,transparent);box-shadow:none;color:var(--faint)}
.bar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:var(--w-bold);padding:0 var(--s)}
.wrap>*,.panel>*,.lessons>*,.card>*,.bento>*{min-width:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--faint);transition:background .3s,transform .3s var(--spring)}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--busy);transform:scale(1.25)} .dot.err{background:var(--err)}
.actions{display:flex;gap:var(--s);justify-content:center;flex-wrap:wrap}

/* ---- panels and cards ---- */
.panel{background:var(--well);border-radius:var(--r-panel);padding:var(--u);display:grid;gap:var(--u)}
.card{background:var(--card);border-radius:var(--r-card);padding:var(--u);display:grid;gap:var(--u)}
.head{display:flex;justify-content:space-between;align-items:center;gap:var(--u);flex-wrap:wrap;padding:0 var(--s);min-height:24px}
.head h2{font-size:var(--fs)}

/* ---- the main header: the same in every grade ---- */
.top{--fs:16px;--h:44px;font:700 16px/22px "Nunito","Avenir Next",sans-serif;display:flex;align-items:center;gap:8px;padding:6px;background:var(--well);border-radius:999px;min-width:0}
.top .gpick{display:flex;align-items:center;gap:12px;flex:1;min-width:0;height:52px;padding:0 16px 0 0;border-radius:999px;text-align:left;transition:background .15s}
.top .gpick:hover{background:var(--hover)}
.top .brand{flex:none;height:52px;padding:0 16px 0 14px;border-radius:999px;font:700 calc(var(--fs) * 1.25)/1 var(--sans);letter-spacing:-.01em;color:var(--text);transition:background .15s;position:relative}
.top .brand:hover{background:var(--hover)}
@media (max-width:430px){.top .gpick .gtext{display:none}.top .brand{padding:0 12px}}
.gbadge{position:relative;width:52px;height:52px;flex:none;display:grid;place-items:center}
.gbadge svg{position:absolute;inset:0;transform:rotate(-90deg)}
.gbadge circle{fill:none;stroke-width:4}
.gbadge .trk{stroke:var(--rule)} .gbadge .val{stroke:var(--tint);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
.gbadge b{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--tint);color:var(--on-tint);font:600 18px/1 "Fredoka","Nunito",sans-serif}
.gtext{display:grid;min-width:0;line-height:20px}
.gtext b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtext small{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{height:40px;padding:0 14px 0 6px;border-radius:999px;background:var(--card);display:inline-flex;align-items:center;gap:6px;font-weight:800;flex:none;white-space:nowrap}
.chip i{font-style:normal;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--well);font-size:15px}
.chip .mono{font-family:"Fredoka","Nunito",sans-serif;font-weight:600}
@media (max-width:480px){.chip .w{display:none}.chip{padding-right:12px}}
/* grade sheet */
.sheet{position:fixed;inset:0;z-index:20;display:grid;align-items:end;justify-items:center;background:rgba(10,12,16,.35);animation:fadeIn .25s ease both;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet .panel{width:min(720px,100%);border-radius:36px 36px 0 0;padding:16px 16px max(24px,env(safe-area-inset-bottom));background:var(--page);animation:sheetUp .45s var(--ease) both;max-height:88vh;overflow:auto;font:700 16px/22px "Nunito",sans-serif}
@media (min-width:700px){.sheet{align-items:center}.sheet .panel{border-radius:36px;width:min(640px,94vw)}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
.gradegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.gcell{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--card);height:64px;text-align:left;transition:background .15s,transform .2s var(--spring)}
.gcell:active{transform:scale(.96)}
.gcell.on{box-shadow:inset 0 0 0 2px var(--tint)}
.gcell .gtext b{font-size:15px} .gcell .gtext small{font-size:12px}
.gcell .gtext{display:grid;min-width:0}
.gcell .gtext small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.gradegrid.big{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s)}
.gradegrid.big .gcell{height:72px}
.gradegrid.big .gcell .gtext b{font-size:17px}
.gradegrid.big .gcell .gtext small{font-size:13px}
.hero.welcome{min-height:160px;align-content:end}
.hero.welcome h1{font-size:calc(var(--fs) * 2)}


/* ---- welcome: a landing page that shows what Bento is, with the grade choice built in ---- */
.land{max-width:1040px;margin:0 auto;display:grid;gap:calc(var(--u) * 2);padding:0 4px calc(var(--u) * 2)}
.lnav{display:flex;align-items:baseline;justify-content:space-between;gap:var(--u);padding:6px 4px 0}
.lnav b{font:700 calc(var(--fs) * 1.25)/1 var(--sans);letter-spacing:-.01em}
.lnav span{color:var(--muted);font-size:var(--small);font-weight:var(--w-mid)}
.lhero{display:grid;justify-items:center;gap:calc(var(--u) + 4px);text-align:center;padding:calc(var(--u) * 3) var(--u) var(--u);animation:rise .7s var(--ease) both}
.lhero h1{font:700 clamp(38px,7vw,68px)/1.04 var(--sans);letter-spacing:-.035em;text-wrap:balance}
.lhero p{max-width:540px;font-size:calc(var(--fs) * 1.1);line-height:1.5;color:var(--muted);font-weight:var(--w-mid);text-wrap:pretty}
.lpick{margin-top:var(--s);display:grid;justify-items:center;gap:10px;background:var(--well);border-radius:var(--r-panel);padding:var(--u) calc(var(--u) - 4px) calc(var(--u) - 4px)}
.lpick>span{font-size:var(--small);font-weight:var(--w-bold);color:var(--muted);letter-spacing:.01em}
.lgrades{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 2px;max-width:900px}
.lg{padding:4px;border-radius:999px;transition:transform .2s var(--spring),background .15s;animation:pop .45s var(--spring) both;animation-delay:calc(.2s + var(--j) * 30ms)}
.lg:hover{background:var(--card);transform:translateY(-2px)}
.lg:active{transform:scale(.94)}
.lsec{display:grid;justify-items:center;gap:6px;text-align:center;padding:calc(var(--u) * 2) var(--u) 0}
.lsec h2{font:700 clamp(28px,4.5vw,44px)/1.1 var(--sans);letter-spacing:-.03em}
.lsec p{max-width:520px;color:var(--muted);font-weight:var(--w-mid);line-height:1.5;font-size:calc(var(--fs) * 1.02)}
.lshots{display:grid;gap:var(--s);grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.lshots{grid-template-columns:repeat(2,minmax(0,1fr))}.lshot.big{grid-column:1 / -1}}
@media (min-width:960px){.lshots{grid-template-columns:repeat(3,minmax(0,1fr))}.lshot.big{grid-column:span 2;grid-row:span 2}}
.lshot{margin:0;background:var(--card);border-radius:var(--r-panel);padding:var(--u);display:grid;grid-template-rows:1fr auto;gap:var(--s);cursor:pointer;box-shadow:0 0 0 1px var(--rule);animation:rise .6s var(--ease) both;animation-delay:calc(var(--i) * 60ms)}
.lshot .viz{align-self:center;align-content:center}
.lshot .viz-cap,.lshot .replay{display:none}
.lshot .viz-svg{max-height:220px;width:100%}
.lshot.big .viz-svg{max-height:440px}
.lshot figcaption{display:flex;align-items:center;gap:10px;font-weight:var(--w-bold);font-size:calc(var(--fs) * .95);min-width:0}
.lchip{flex:none;font-size:12px;line-height:22px;padding:0 9px;border-radius:999px;background:var(--tint-soft);color:var(--tint);font-weight:var(--w-bold)}
.lpair{display:grid;gap:var(--s);grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.lpair{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lf{background:var(--card);border-radius:var(--r-panel);padding:calc(var(--u) + 4px);display:grid;gap:6px;align-content:start;box-shadow:0 0 0 1px var(--rule)}
.lf h3{font-size:calc(var(--fs) * 1.05);font-weight:var(--w-bold)}
.lf p{color:var(--muted);font-weight:var(--w-mid);line-height:1.5;font-size:calc(var(--fs) * .95)}
.lk{font-size:12px;font-weight:var(--w-bold);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lsteps,.lmiss{display:grid;gap:6px;font-family:var(--num)}
.lsteps .q,.lmiss .q{font-size:calc(var(--fs) * 1.7);margin:2px 0 4px}
.lsteps>div:not(.q),.lmiss .bad{display:flex;justify-content:space-between;gap:var(--u);padding:9px 16px;border-radius:999px;background:var(--well);font-size:calc(var(--fs) * 1.05)}
.lsteps b{color:var(--tint);font-weight:600}
.lsteps .sum{background:var(--tint-soft)}
.lmiss .bad{background:color-mix(in srgb,#ef4444 12%,var(--card))} .lmiss .bad b{color:#dc2626;font-weight:600;text-decoration:line-through 2px}
.lmiss p{font-family:var(--sans);margin-top:6px;color:var(--text);line-height:1.5}
.lmiss p b{color:#dc2626}
.lfeats{display:grid;gap:var(--s);grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.lfeats{grid-template-columns:repeat(3,minmax(0,1fr))}.lf.wide{grid-column:1 / -1}}
.lfoot{text-align:center;color:var(--faint);font-size:var(--small);font-weight:var(--w-mid);padding-top:var(--u)}
/* ---- grade hero ---- */
.hero{position:relative;overflow:hidden;background:var(--tint-soft);border-radius:var(--r-panel);padding:calc(var(--u) + 4px);display:grid;gap:var(--u)}
.hero .pat{position:absolute;inset:0;opacity:.55;pointer-events:none;background-repeat:repeat;animation:drift 40s linear infinite}
@keyframes drift{to{background-position:240px 120px}}
.hero>*:not(.pat){position:relative}
.hero h1{font-size:calc(var(--fs) * 1.5);line-height:1.15;color:var(--tint);font-weight:var(--w-bold)}
.hero .sub{color:var(--muted);font-weight:var(--w-mid)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--card);border-radius:var(--r-card)}
.stats>div{padding:10px var(--u);display:grid;gap:2px;min-width:0}
.stats>div+div{border-left:1px solid var(--rule)}
.stats .k{color:var(--muted);font-size:var(--small);line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats .v{font-family:var(--num);font-size:calc(var(--fs) * 1.35);line-height:1.2;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.stats .v small{font-size:var(--small);color:var(--muted);font-family:var(--sans)}
.hero .actions{justify-content:flex-start}

/* ---- Bento home: one grid of tiles. Phone: one column. Tablet portrait: two. Landscape: the big next-up tile on the left, the rest stacked beside it. ---- */
.bhome{display:grid;gap:var(--u);grid-template-columns:minmax(0,1fr)}
.tile{background:var(--well);border-radius:var(--r-panel);padding:var(--u);display:grid;gap:var(--u);align-content:start;min-width:0;text-align:left}
.b-hero{align-content:space-between;min-height:220px}
.upnext{display:grid;gap:6px;background:var(--card);border-radius:var(--r-card);padding:calc(var(--u) + 2px);text-align:left;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px color-mix(in srgb,var(--tint) 45%,transparent);transition:transform .2s var(--spring)}
.upnext:active{transform:scale(.98)}
.upnext .k{color:var(--muted);font-size:var(--small);line-height:18px;font-weight:var(--w-mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upnext b{font-size:calc(var(--fs) * 1.45);line-height:1.2;font-weight:var(--w-bold);color:var(--text)}
.upnext .row{display:flex;align-items:center;justify-content:space-between;gap:var(--s);margin-top:4px}
.b-review{display:flex;align-items:center;gap:var(--u);transition:background .15s,transform .2s var(--spring)}
.b-review:hover{background:var(--hover)}
.b-review:active{transform:scale(.98)}
.b-review .badge{min-width:var(--rbadge);height:var(--rbadge);font-size:calc(var(--rbadge) * .4);background:var(--card);color:var(--tint)}
.b-review .badge.on{background:var(--tint);color:var(--on-tint,#fff)}
.b-review .name{flex:1;display:grid;gap:2px;min-width:0}
.b-review .name small{font-size:var(--small);line-height:18px;font-weight:var(--w-mid)}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--card);border-radius:var(--r-card)}
.statgrid .st{display:grid;justify-items:center;align-content:center;gap:6px;padding:var(--u) 6px;text-align:center;min-width:0}
.statgrid .st+.st{border-left:1px solid var(--rule)}
.statgrid .v{font-family:var(--num);font-size:calc(var(--fs) * 1.6);line-height:64px;height:64px;display:flex;align-items:center;color:var(--tint)}
.statgrid .k{color:var(--muted);font-size:var(--small);line-height:18px}
.ring.sm{width:64px;height:64px;margin:0}
.ring.sm circle{stroke-width:10}
.ring.sm b{font-size:22px}
.b-stats .actions{justify-content:flex-start}
.tile .ctl:not(.go){background:var(--card)}
.uprog{display:grid;gap:10px;background:color-mix(in srgb,var(--card) 70%,transparent);border-radius:var(--r-card);padding:var(--u);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.uprog>div{display:grid;grid-template-columns:minmax(0,9em) 1fr auto;align-items:center;gap:var(--u);font-size:var(--small);line-height:20px;font-weight:var(--w-mid)}
.uprog .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uprog .mono{color:var(--muted);min-width:3ch;text-align:right}
.bar2{height:10px;border-radius:999px;background:var(--rule);overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:inherit;background:var(--tint);min-width:10px;animation:grow 1s var(--ease) .2s both}
.bar2 i[style^="width:0"]{min-width:0}
@keyframes grow{from{width:0}}
@media (max-width:699px){.uprog{display:none}}
.b-weak .lessons{gap:6px}
@media (min-width:700px){
  .bhome{grid-template-columns:repeat(2,minmax(0,1fr))}
  .b-hero{grid-column:1 / -1}
  .b-review,.b-stats:last-child{grid-column:1 / -1}
}
@media (min-width:900px) and (orientation:landscape){
  .bhome{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
  .b-hero{grid-column:1;grid-row:1 / span 2;min-height:0}
  .bhome.tall .b-hero{grid-row:1 / span 3}
  .bhome>.tile,.bhome>.b-review,.bhome>.b-stats:last-child{grid-column:2}
  .b-stats.solo{grid-row:1 / span 2}
  .bhome:not(:has(.b-review)) .b-weak{grid-row:3}
  .upnext b{font-size:calc(var(--fs) * 1.8)}
}

/* ---- units and lessons ---- */
.units{display:grid;gap:var(--u);align-items:start}
@media (min-width:700px){.units{display:block;columns:3 300px;column-gap:var(--u)}.units>.panel{break-inside:avoid;margin-bottom:var(--u)}}

}

.viz-svg .sq{fill:color-mix(in srgb,var(--tint) 18%,var(--card));stroke:var(--tint);stroke-width:2} .viz-svg .sq.big{fill:color-mix(in srgb,var(--acc) 22%,var(--card));stroke:var(--acc)}
.viz-svg .cell{stroke-width:2} .viz-svg .cell.c0{fill:color-mix(in srgb,var(--c0) 18%,var(--card));stroke:var(--c0)} .viz-svg .cell.c1{fill:color-mix(in srgb,var(--c1) 18%,var(--card));stroke:var(--c1)} .viz-svg .cell.c2{fill:color-mix(in srgb,var(--c2) 18%,var(--card));stroke:var(--c2)}

/* the animation vocabulary for pictures; --d is the start time */
.a-draw{stroke-dasharray:1;animation:draw .9s var(--ease) var(--d,0s) both} .a-draw.slow{animation-duration:1.6s}
.dash.a-draw{stroke-dasharray:none;animation:fadeIn .6s ease var(--d,0s) both}
@keyframes draw{from{stroke-dashoffset:1}}
.a-fade{animation:fadeIn .5s ease var(--d,0s) both}
.a-rise{animation:rise .5s var(--ease) var(--d,0s) both}

.a-outsoon{animation:fadeOut .4s ease var(--d,0s) forwards} @keyframes fadeOut{to{opacity:0}}
.a-slide{animation:slide 1s var(--ease) var(--d,0s) both} @keyframes slide{from{transform:translateX(var(--dx))}}

.a-drop{animation:drop .6s var(--spring) var(--d,0s) both} @keyframes drop{from{opacity:0;transform:translateY(-30px)}}
.a-grow{transform-box:view-box;animation:growS 1.2s var(--ease) var(--d,0s) both} @keyframes growS{from{transform:scale(var(--from))}}
.a-flash{animation:fadeIn .4s ease var(--d) both, fadeOut .3s ease var(--d2) forwards}

@media (min-width:900px) and (orientation:landscape){.bdone{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}.bdone>.panel{position:sticky;top:16px}}
@media (min-width:700px){.bgrown{display:block;columns:2 340px;column-gap:var(--u)}.bgrown>.panel{break-inside:avoid;margin-bottom:var(--u)}}

.outline .name{flex:1;min-width:0}

@media (min-width:700px){.bbook{grid-template-columns:minmax(0,4fr) minmax(0,7fr);align-items:stretch}}

.badgewin .bdg{flex:none;width:96px;animation:pop .6s .4s var(--spring) both}
.badgewin .txt{display:grid;gap:4px;min-width:0}
.badgewin .txt b{font-size:calc(var(--fs) * 1.15)}

@media (prefers-reduced-motion:reduce){ *,::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){transition:none!important;animation:none!important} .a-outsoon,.a-flash:not(:last-of-type){opacity:0} .a-move{transform:translateX(var(--dx))} .viz-svg .bar.mid{fill:var(--acc)} }
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script>
const $ = s => document.querySelector(s);
const gcd = (a,b) => b ? gcd(b, a % b) : a;
const lcm = (a,b) => a*b/gcd(a,b);
const rand = (lo,hi) => lo + Math.floor(Math.random()*(hi-lo+1));
const fr = (n,d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;

// ---- saved progress (this iPad only) ----
let save = {xp:0, streak:0, last:"", done:0, lessons:{}};
try { save = Object.assign(save, JSON.parse(localStorage.getItem("stepmath") || "{}")); } catch(e){}
if (save.done && !save.lessons.add) save.lessons.add = save.done; // older saves
// lesson summaries live under their own key and are written only when a run finishes, so typing stays fast
try { save.reports = JSON.parse(localStorage.getItem("stepmath-reports") || "null") || save.reports || {}; } catch(e){}
function persist(all){
  const {reports, ...rest} = save;
  try { localStorage.setItem("stepmath", JSON.stringify(rest)); } catch(e){}
  if (!all) return;
  try { localStorage.setItem("stepmath-reports", JSON.stringify(reports || {})); }
  catch(e){ // storage full: keep the 25 newest summaries
    const keep = Object.entries(reports || {}).sort((a,b) => b[1].date - a[1].date).slice(0, 25);
    save.reports = Object.fromEntries(keep);
    try { localStorage.setItem("stepmath-reports", JSON.stringify(save.reports)); } catch(e2){}
  }
}

// ---- problem generator: a/b + c/d or a/b − c/d ----
function makeProblem(i, op){
  let b, d;
  for(;;){
    b = rand(2,12); d = rand(2,12);
    if (b === d || lcm(b,d) > 24) continue;
    const multiple = b % d === 0 || d % b === 0;
    if (i === 0 && !multiple) continue;          // first problem: easy kind
    if (i >= 2 && multiple && Math.random() < .6) continue; // later: mostly harder kind
    break;
  }
  const pickTop = den => { let n; do { n = rand(1, den-1); } while (gcd(n,den) !== 1); return n; };
  let a = pickTop(b), c = pickTop(d), L = lcm(b,d);
  let A = a*(L/b), C = c*(L/d);
  if (op === "−"){
    if (A === C) return makeProblem(i, op);
    if (A < C) { [a,b,c,d,A,C] = [c,d,a,b,C,A]; } // keep the answer positive
  }
  const S = op === "−" ? A - C : A + C;
  return {a,b,c,d,L,A,C,S,op};
}

function finalForm(p){
  const g = gcd(p.S, p.L), n = p.S/g, d = p.L/g;
  return { whole: Math.floor(n/d), num: n % d, den: d };
}
function showFinal(f){
  if (f.num === 0) return `${f.whole}`;
  return (f.whole ? `${f.whole} ` : "") + fr(f.num, f.den);
}

// ---- the steps; each knows the right answer and the common wrong ones ----
function stepsFor(p){
  const {a,b,c,d,L,A,C,S,op} = p, sub = op === "−", ka = L/b, kc = L/d, F = finalForm(p);
  const rewrite = (n, den, k, N, which) => ({
    label: `Step ${which+1} · Rewrite ${which===1?"the first":"the second"} fraction`,
    ask: () => `${fr(n,den)} <span>=</span> <span class="fr slots"><span>${slot("x")}</span><span>${L}</span></span>`,
    note: `Make ${L} the bottom number.`,
    check: v => {
      const x = v.x;
      if (x === N) return {ok:true};
      if (x === n) return {kind:"Changed the bottom but not the top",
        msg:`You changed the bottom from ${den} to ${L}, but kept the top as ${n}. Whatever you multiply the bottom by, multiply the top by the same number.`};
      if (x === n + (L-den)) return {kind:"Added instead of multiplied",
        msg:`It looks like you added ${L-den} to the top because the bottom went up by ${L-den}. Fractions stay equal when we <b>multiply</b> top and bottom by the same number. What times ${den} makes ${L}?`};
      return {kind:"Rewriting a fraction",
        msg:`Not quite. Ask: ${den} × <b>?</b> = ${L}. Then multiply the top, ${n}, by that same number.`};
    },
    hint: `${den} × ? = ${L}. Whatever you multiply the bottom by, do the same to the top.`,
    answer: {x:N},
    explain: `${den} × ${k} = ${L}, so ${n} × ${k} = ${N}.`,
    work: () => `${fr(n,den)} = ${fr(N,L)} <span class="muted">(× ${k})</span>`
  });

  return [
    { label:"Step 1 · Find a common denominator",
      ask: () => `<span class="q">Smallest number that both ${b} and ${d} go into:</span> ${slot("x")}`,
      note: "This is the least common denominator (LCD).",
      check: v => {
        const x = v.x;
        if (x === L) return {ok:true};
        if (x === b + d) return {kind:"Added the denominators",
          msg:`It looks like you added ${b} + ${d}. The bottom number tells the <b>size of the pieces</b>, so we can't add them. We need a number that both ${b} and ${d} divide into evenly.`};
        if (sub && x === Math.abs(b - d)) return {kind:"Subtracted the denominators",
          msg:`It looks like you subtracted ${Math.max(b,d)} − ${Math.min(b,d)}. The bottom number tells the <b>size of the pieces</b>, so we don't subtract it. We need a number that both ${b} and ${d} divide into evenly.`};
        if (x > 0 && x % b === 0 && x % d === 0) return {kind:"Common denominator, but not the least",
          msg:`${x} works, because both ${b} and ${d} go into it. But there is a <b>smaller</b> one, and smaller numbers make the rest easier. Try again.`};
        const bad = x % b !== 0 ? b : d;
        return {kind:"Finding the LCD",
          msg: x > 0 ? `${bad} doesn't go into ${x} evenly (${x} ÷ ${bad} has a remainder). Both bottom numbers must divide into it.` : "Type a number first."};
      },
      hint: `Count by ${Math.max(b,d)}s: ${[1,2,3,4].map(i=>i*Math.max(b,d)).join(", ")}… Stop at the first one that ${Math.min(b,d)} also goes into.`,
      answer: {x:L},
      explain: `Counting by ${Math.max(b,d)}s, the first number ${Math.min(b,d)} also goes into is ${L}.`,
      work: () => `LCD of ${b} and ${d} is <b>${L}</b>`
    },
    rewrite(a,b,ka,A,1),
    rewrite(c,d,kc,C,2),
    { label: sub ? "Step 4 · Subtract" : "Step 4 · Add",
      ask: () => `${fr(A,L)} ${op} ${fr(C,L)} = <span class="fr slots"><span>${slot("n")}</span><span>${slot("d")}</span></span>`,
      note: "Fill in the top and the bottom.",
      check: v => {
        if (v.n == null || v.d == null) return {soft:true, msg:"Fill in both boxes, the top and the bottom."};
        if (v.n === S && v.d === L) return {ok:true};
        if (!sub && v.d === 2*L) return {kind:"Added the denominators",
          msg:`You added the bottoms too (${L} + ${L}). The pieces are already the same size, ${L}ths, so the bottom stays <b>${L}</b>. Think: ${A} slices + ${C} slices of the same pizza = ${S} slices, still ${L}ths.`};
        if (sub && v.d === 0) return {kind:"Subtracted the denominators",
          msg:`You subtracted the bottoms too (${L} − ${L} = 0). The pieces are already the same size, ${L}ths, so the bottom stays <b>${L}</b>. Think: ${A} slices take away ${C} slices = ${S} slices, still ${L}ths.`};
        if (v.d !== L) return {kind:"Changed the denominator",
          msg:`When the bottoms match, the bottom stays the same: <b>${L}</b>. Only the tops get ${sub ? "subtracted" : "added"}.`};
        if (sub && v.n === A + C) return {kind:"Added instead of subtracting",
          msg:`You added ${A} + ${C}. Look at the sign: this one is a <b>minus</b>.`};
        if (!sub && v.n === Math.abs(A - C)) return {kind:"Subtracted instead of adding",
          msg:`You subtracted. Look at the sign: this one is a <b>plus</b>.`};
        return {kind: sub ? "Subtracting numerators" : "Adding numerators",
          msg:`The bottom is right. Check the top: ${A} ${op} ${C} = ?`};
      },
      hint: `${sub ? "Subtract" : "Add"} only the tops. The bottom stays ${L}.`,
      answer: {n:S, d:L},
      explain: `${A} ${op} ${C} = ${S}, and the bottom stays ${L}.`,
      work: () => `${fr(A,L)} ${op} ${fr(C,L)} = ${fr(S,L)}`
    },
    simplifyStep(S, L, "Step 5 · Simplify")
  ];
}

// simplify S/L to lowest terms or a mixed number; shared by fraction lessons
function simplifyStep(S, L, label){
  const F = finalForm({S, L}), hasWhole = F.whole > 0, fracPart = F.num > 0;
  return { label,
      ask: () => `${fr(S,L)} = <span class="mixed">${slot("w","small")}<span class="fr slots"><span>${slot("n")}</span><span>${slot("d")}</span></span></span>`,
      note: S > L ? "The top is bigger than the bottom, so pull out the wholes. Use the small box for the whole number."
          : S === L ? "Top and bottom are the same. What whole number is that?"
          : gcd(S,L) > 1 ? "Can both numbers be divided by the same number?"
          : "If it can't be simplified, just copy it. Leave the whole-number box empty.",
      check: v => {
        const w = v.w || 0, n = v.n || 0, dd = v.d;
        if (v.n != null && dd == null) return {soft:true, msg:"Fill in the bottom number too."};
        if (dd === 0) return {soft:true, msg:"The bottom can't be 0."};
        const den = dd || 1;
        const equal = (w*den + n) * L === S * den;
        if (!equal){
          return {kind:"Simplifying",
            msg: S > L ? `That's not equal to ${fr(S,L)}. How many whole ${L}s fit into ${S}? That's the whole number. What's left over goes on top.`
                       : `That's not equal to ${fr(S,L)}. Divide the top <b>and</b> the bottom by the same number.`};
        }
        if (dd && n >= dd) return {soft:true, kind:"Mixed number",
          msg:`That's the right amount! Now write it as a mixed number: how many whole ${dd}s fit into ${n}?`};
        if (dd && n > 0 && gcd(n,dd) > 1) return {kind:"Not fully simplified",
          msg:`Same amount, good! But ${fr(n,dd)} can still be simplified: both ${n} and ${dd} divide by ${gcd(n,dd)}.`};
        return {ok:true};
      },
      hint: S >= L ? `${S} ÷ ${L} = ${Math.floor(S/L)} remainder ${S % L}. The remainder goes on top.`
                   : gcd(S,L) > 1 ? `Both ${S} and ${L} can be divided by ${gcd(S,L)}.` : `No number (other than 1) divides both ${S} and ${L}. It's already simplest.`,
      answer: {w: hasWhole ? F.whole : null, n: fracPart ? F.num : null, d: fracPart ? F.den : null},
      explain: S >= L ? `${S} ÷ ${L} = ${Math.floor(S/L)} remainder ${S % L}, then simplify.` : gcd(S,L) > 1 ? `Divide top and bottom by ${gcd(S,L)}.` : "It was already as simple as it gets.",
      work: () => `${fr(S,L)} = <b>${showFinal(F)}</b>`
    };
}

// ---- numbers: the pad types "−" and "." ----
const round6 = x => Math.round(x*1e6)/1e6;
const fmt = x => { const r = round6(x); return (r < 0 ? "−" : "") + String(Math.abs(r)); };
const eq = (a,b) => a != null && b != null && Math.abs(a-b) < 1e-6;
function parseNum(str){
  if (str == null || str === "" || str === "−") return null;
  const n = Number(String(str).replace("−","-"));
  return Number.isFinite(n) ? n : null;
}

// ---- shared step builders ----
// one-box step: the right answer plus known wrong answers, each with its own explanation
function numStep({label, ask, note="", ans, wrong=[], hint, explain, work}){
  return { label, ask: () => ask(slot("x")), note,
    check: v => {
      if (eq(v.x, ans)) return {ok:true};
      for (const [val, kind, msg] of wrong) if (eq(v.x, val)) return {kind, msg};
      return {kind: label, msg:`Not quite. ${hint}`, generic:true};
    },
    hint, answer:{x:ans}, explain, work };
}
const q = t => `<span class="q">${t}</span>`;
const dots = n => `<span class="dots" aria-label="${n} dots">${Array(n).fill("●").join(" ")}</span>`;
const pick = arr => arr[rand(0, arr.length-1)];
const TRIPLES = [[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25],[12,16,20]];

// ---- grade K to 12 lessons (5th grade fractions are defined above) ----
const K_ADD = {
  make: () => { const a = rand(1,5), b = rand(1, Math.min(5, 10-a)); return {a,b}; },
  show: p => `<div class="math">${p.a} + ${p.b}</div><div class="dotrow">${dots(p.a)}<span>+</span>${dots(p.b)}</div>`,
  steps: ({a,b}) => [
    numStep({label:"Count the first group", ask:s=>`${q("How many dots are in the first group?")}${s}`, ans:a,
      wrong:[[b,"Counted the wrong group","That's the second group. Count the dots <b>before</b> the + sign."]],
      hint:"Touch each dot in the first group and count out loud.", explain:`There are ${a} dots in the first group.`, work:()=>`First group: <b>${a}</b>`}),
    numStep({label:"Count on", ask:s=>`${q(`Start at ${a}. Count on ${b} more.`)}${a} + ${b} = ${s}`, ans:a+b,
      wrong:[[a+b+1,"Counting on",`One too many. Start <i>after</i> ${a}: say ${a+1} for the first dot.`],[a+b-1,"Counting on","One short. Count every dot in the second group once."]],
      hint:`Say ${a}, then count up one number for each dot in the second group.`, explain:`${a}, then ${Array.from({length:b},(_,i)=>a+i+1).join(", ")}.`, work:()=>`${a} + ${b} = <b>${a+b}</b>`})
  ],
  learn:[{h:"Count on", body:`<div class="math">3 + 2</div><div class="dotrow">${dots(3)}<span>+</span>${dots(2)}</div>
    <div class="prose"><p>Count the first group: 3. Then keep counting for each dot in the second group: 4, 5. So 3 + 2 = 5.</p></div>`}]
};

// pictures for the youngest: a ten frame, and base-ten blocks (a rod is ten, a cube is one)
const tenFrame = n => `<span class="tf" aria-label="${n} in a ten frame">${Array.from({length:10},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</span>`;
const blocks = n => `<span class="bb" aria-label="${Math.floor(n/10)} tens and ${n%10} ones">${'<i class="rod"></i>'.repeat(Math.floor(n/10))}${'<i class="cube"></i>'.repeat(n%10)}</span>`;
const G1_TEN = {
  make: () => { const a = rand(6,9); return {a, b: rand(11-a, 9)}; },
  show: p => `<div class="math">${p.a} + ${p.b}</div><div class="dotrow">${tenFrame(p.a)}<span>+</span>${tenFrame(p.b)}</div>`,
  steps: ({a,b}) => { const need = 10-a, left = b-need; return [
    numStep({label:"Make a ten", ask:s=>`${a} + ${s} = 10`, ans:need,
      hint:`Count up from ${a} to 10. How many did you count?`, explain:`${a} + ${need} = 10.`, work:()=>`${a} + <b>${need}</b> = 10`}),
    numStep({label:`Break apart ${b}`, ask:s=>`${b} = ${need} + ${s}`, ans:left,
      wrong:[[b+need,"Breaking apart",`Both parts have to be smaller than ${b}. What is ${b} take away ${need}?`]],
      hint:`${b} take away ${need}.`, explain:`${b} − ${need} = ${left}.`, work:()=>`${b} = ${need} + <b>${left}</b>`}),
    numStep({label:"Add to the ten", ask:s=>`10 + ${left} = ${s}`, ans:a+b,
      wrong:[[left,"Forgot the ten","Don't forget the 10!"]],
      hint:`10 plus ${left} is ten and ${left} more.`, explain:`10 + ${left} = ${a+b}.`, work:()=>`${a} + ${b} = 10 + ${left} = <b>${a+b}</b>`})
  ]; },
  learn:[{h:"Make a ten first", body:`<div class="math">8 + 5</div><div class="prose"><p>8 needs 2 more to make 10. Break 5 into 2 and 3. Now it's 10 + 3 = 13. Tens are easy to add!</p></div>`}]
};

const G2_REGROUP = {
  make: () => { let a, b; do { a = rand(15,79); b = rand(15,79); } while (a%10 + b%10 < 10 || a+b > 99); return {a,b}; },
  show: p => `<div class="math">${p.a} + ${p.b}</div><div class="dotrow">${blocks(p.a)}<span>+</span>${blocks(p.b)}</div>`,
  steps: ({a,b}) => { const at=Math.floor(a/10), ao=a%10, bt=Math.floor(b/10), bo=b%10, O=ao+bo; return [
    numStep({label:"Add the ones", ask:s=>`${ao} + ${bo} = ${s}`, ans:O,
      wrong:[[at+bt,"Started with the tens","Start with the <b>ones</b>, the digits on the right."]],
      hint:"Add just the right-hand digits.", explain:`${ao} + ${bo} = ${O}.`, work:()=>`Ones: ${ao} + ${bo} = ${O}`}),
    numStep({label:"Regroup", ask:s=>`${q(`${O} is 1 ten and how many ones?`)}${s}`, ans:O%10,
      wrong:[[O,"Regrouping","Only one digit fits in the ones place. The ten carries over to the tens."]],
      hint:`${O} = 10 + ?`, explain:`${O} = 10 + ${O%10}. Write ${O%10}, carry the 1.`, work:()=>`Write <b>${O%10}</b>, carry 1 ten`}),
    numStep({label:"Add the tens", ask:s=>`${q("Add the tens, plus the 1 you carried.")}${at} + ${bt} + 1 = ${s}`, ans:at+bt+1,
      wrong:[[at+bt,"Forgot the carried ten","Don't forget the 1 you carried!"]],
      hint:"Add the left-hand digits, then add 1 more.", explain:`${at} + ${bt} + 1 = ${at+bt+1}.`, work:()=>`Tens: ${at} + ${bt} + 1 = ${at+bt+1}`}),
    numStep({label:"Answer", ask:s=>`${a} + ${b} = ${s}`, ans:a+b,
      wrong:[[(at+bt)*10+O%10,"Forgot the carried ten","Check the tens: did you add the 1 you carried?"]],
      hint:`${at+bt+1} tens and ${O%10} ones.`, explain:`${at+bt+1} tens and ${O%10} ones is ${a+b}.`, work:()=>`${a} + ${b} = <b>${a+b}</b>`})
  ]; },
  learn:[{h:"Carry the ten", body:`<div class="math">47 + 38</div><div class="prose"><p>Ones first: 7 + 8 = 15. That's 1 ten and 5 ones. Write 5 and carry the 1 to the tens.</p><p>Tens: 4 + 3 + 1 = 8. The answer is 85.</p></div>`}]
};

const G3_SPLIT = {
  make: () => ({a: rand(3,9), b: rand(6,9)}),
  show: p => `<div class="math">${p.a} × ${p.b}</div>`,
  steps: ({a,b}) => { const r = b-5; return [
    numStep({label:"Multiply by 5", ask:s=>`${a} × 5 = ${s}`, ans:a*5,
      wrong:[[a+5,"Added instead of multiplied",`× means ${a} groups of 5, not ${a} + 5.`]],
      hint:`Count by 5s, ${a} times.`, explain:`${a} × 5 = ${a*5}.`, work:()=>`${a} × 5 = ${a*5}`}),
    numStep({label:`Multiply by ${r}`, ask:s=>`${a} × ${r} = ${s}`, ans:a*r,
      wrong:[[a+r,"Added instead of multiplied",`× means ${a} groups of ${r}.`]],
      hint:`${a} groups of ${r}.`, explain:`${a} × ${r} = ${a*r}.`, work:()=>`${a} × ${r} = ${a*r}`}),
    numStep({label:"Add the parts", ask:s=>`${a*5} + ${a*r} = ${s}`, ans:a*b,

const G6_DIVIDE = {

const twoNums = (p, qn, kindSum, kindProd) => v => {
  if (v.m == null || v.n == null) return {soft:true, msg:"Fill in both boxes."};
  if ((v.m === p && v.n === qn) || (v.m === qn && v.n === p)) return {ok:true};
  if (v.m * v.n === p*qn) return {kind:kindSum, msg:`${v.m} × ${v.n} = ${p*qn}, good. But ${v.m} + ${v.n} = ${v.m+v.n}, not ${p+qn}. Try another pair.`};
  if (v.m + v.n === p+qn) return {kind:kindProd, msg:`${v.m} + ${v.n} = ${p+qn}, good. But ${v.m} × ${v.n} = ${v.m*v.n}, not ${p*qn}. Try another pair.`};
  return {kind:"Factoring", msg:`List pairs that multiply to ${p*qn}, then check which pair adds to ${p+qn}.`};
};

function unitsOf(g){
  const out = [];
  for (const i of inGrade(g)){ const u = LESSONS[i].unit || "Skills"; let x = out.find(o => o.name === u); if (!x) out.push(x = {name:u, list:[]}); x.list.push(i); }

}

// ---- drawing the screen. Moving between screens (or grades) cross-fades with a view transition. ----
let lastKey = "", sheetOpen = false, learnEx = null;
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function viewKey(){
  return [view, cur, view === "learn" ? learnIdx : view === "practice" ? st.i : view === "report" ? reportKey : "", ["home","parent","badges"].includes(view) ? save.grade : ""].join("|");
}
function render(dir){
  const key = viewKey(), nav = key !== lastKey;
  if (nav && lastKey && document.startViewTransition && !reduceMotion()){
    document.documentElement.dataset.dir = dir || "";
    document.startViewTransition(() => paint(key, nav));
  } else paint(key, nav);
}
function paint(key, nav){
  const app = $("#app"), home = ["home","parent","badges","welcome"].includes(view);
  const html = view === "welcome" ? welcomeHTML() : view === "home" ? homeHTML() : view === "learn" ? learnHTML() : view === "practice" ? practiceHTML()
    : view === "report" ? reportViewHTML() : view === "parent" ? parentHTML() : view === "badges" ? badgesHTML() : doneHTML();
  if (view === "practice") saveRun();
  const g = home ? save.grade : LESSONS[cur].grade;
  app.className = "wrap t" + (home ? 0 : tintOf(cur));
  app.dataset.band = bandOf(g); app.dataset.grade = g;
  app.innerHTML = html + (sheetOpen ? sheetHTML() : "");
  app.querySelectorAll(".learn .prose").forEach(pr => pr.querySelectorAll("p").forEach((p, i) => p.style.setProperty("--i", i)));
  app.querySelectorAll(".strip").forEach(sx => sx.querySelectorAll("span").forEach((s, i) => s.style.setProperty("--i", i)));
  if (nav){
    lastKey = key; window.scrollTo(0, 0);
    const tab = app.querySelector(".gtabs .on"); if (tab) tab.parentElement.scrollLeft = tab.offsetLeft - tab.parentElement.clientWidth / 2 + tab.clientWidth / 2;
    if (!document.startViewTransition && !reduceMotion()) app.querySelectorAll(":scope > *").forEach((el, i) => { el.classList.add("rise"); el.style.animationDelay = Math.min(i, 6)*50 + "ms"; });
  }
  app.querySelectorAll("[data-count]").forEach(countUp);
  if (view === "welcome") watchShots(app);
  if (st) st.fx = null;
  if (learnEx) learnEx.fresh = false;
}
// landing pictures play when they scroll into view, not before
function watchShots(app){
  if (!("IntersectionObserver" in window)) return;

// ---- compact builders for the grade 5–12 lessons ----
// one box; the work line is the same sentence with the answer filled in
function ns({l, q:prompt, a, ans, h, w=[], n=""}){
  return numStep({label:l, ask: s => (prompt ? q(prompt) : "") + a(s), note:n, ans, wrong:w, hint:h,
    explain:`${h} That makes ${fmt(ans)}.`, work: () => a(`<b>${fmt(ans)}</b>`)});
}
// several boxes at once; anyOrder when the boxes can be swapped (two roots, two factors)
function ms({l, q:prompt, a, ans, h, w=[], n="", anyOrder=false}){
  const ids = Object.keys(ans);
  const sorted = x => [...x].sort((p,r)=>p-r);
  const same = (x, y) => anyOrder ? sorted(x).every((t,i)=>eq(t, sorted(y)[i])) : x.every((t,i)=>eq(t, y[i]));
  return { label:l, note:n, hint:h,
    ask: () => (prompt ? q(prompt) : "") + a(Object.fromEntries(ids.map(id => [id, slot(id)]))),
    check: v => {
      if (ids.some(id => v[id] == null)) return {soft:true, msg:"Fill in every box."};
      const vals = ids.map(id => v[id]), want = ids.map(id => ans[id]);
      if (same(vals, want)) return {ok:true};
      for (const [bad, kind, msg] of w) if (same(vals, ids.map(id => bad[id]))) return {kind, msg};
      return {kind:l, msg:`Not quite. ${h}`, generic:true};
    },
    answer: ans, explain: h,
    work: () => a(Object.fromEntries(ids.map(id => [id, `<b>${fmt(ans[id])}</b>`]))) };
}
const fslots = () => `<span class="fr slots"><span>${slot("n")}</span><span>${slot("d")}</span></span>`;
// a fraction answer in lowest terms (improper is fine); a minus sign goes on top
function fs({l, q:prompt, a, N, D, h, w=[], n=""}){
  const g = gcd(Math.abs(N), Math.abs(D)), sg = Math.sign(N) * Math.sign(D);
  const RN = sg * Math.abs(N) / g, RD = Math.abs(D) / g;
  return { label:l, note: n || "Write it in lowest terms.", hint:h,
    ask: () => (prompt ? q(prompt) : "") + a(fslots()),
    check: v => {
      if (v.n == null || v.d == null) return {soft:true, msg:"Fill in the top and the bottom."};
      if (v.d === 0) return {soft:true, msg:"The bottom can't be 0."};
      for (const [bn, bd, kind, msg] of w) if (eq(v.n, bn) && eq(v.d, bd)) return {kind, msg};
      if (!eq(v.n * RD, RN * v.d)) return {kind:l, msg:`Not quite. ${h}`, generic:true};
      if (v.d < 0) return {soft:true, msg:"Right amount! Put the minus sign on the top number."};
      if (gcd(Math.abs(v.n), v.d) > 1) return {kind:"Not fully simplified", msg:`Same amount, but it can be simplified: both numbers divide by ${gcd(Math.abs(v.n), v.d)}.`};
      return {ok:true};
    },
    answer:{n:RN, d:RD}, explain:h,
    work: () => a(`<b>${RD === 1 ? fmt(RN) : fr(fmt(RN), RD)}</b>`) };
}
const M = (html, note) => `<div class="math">${html}</div>${note ? `<p class="note">${note}</p>` : ""}`;
const card = (h, math, ...ps) => [{h, body:`${math ? `<div class="math">${math}</div>` : ""}<div class="prose">${ps.map(p => `<p>${p}</p>`).join("")}</div>`}];
const fmtP = x => x < 0 ? `(${fmt(x)})` : fmt(x);              // negatives in parentheses
const sgn = (c, first) => c < 0 ? (first ? "−" : " − ") : (first ? "" : " + ");
// a polynomial from [coefficient, "x²"] pairs, skipping zero terms
const poly = terms => terms.filter(([c]) => c !== 0).map(([c, v], i) => `${sgn(c, i === 0)}${Math.abs(c) === 1 && v ? "" : Math.abs(c)}${v}`).join("") || "0";

// ---- 9th grade · Algebra 1 ----

const G9 = [

    ns({l:"Distribute", a:s=>`${a}x + ${s} = ${a*(x+b)}`, ans:a*b, h:`Multiply ${a} by ${b} too.`, w:[[b,"Only multiplied the first term",`Multiply ${a} by <b>both</b> x and ${b}.`]]}),
    ns({l:"Subtract", a:s=>`${a}x = ${s}`, ans:a*x, h:`${a*(x+b)} − ${a*b}.`}),
    ns({l:"Divide", a:s=>`x = ${s}`, ans:x, h:`${a*x} ÷ ${a}.`})

  learn: card("Distribute, then undo", "3(x + 4) = 27", "3x + 12 = 27. Subtract 12: 3x = 15. Divide by 3: x = 5.")

    ns({l:"Find b", a:s=>`b = ${fmt(y1)} − ${fmtP(m)} × ${fmtP(x1)} = ${s}`, ans:b, h:"b = y − mx, using the first point."}),

  learn: card("Combine like terms", "(2x² + 3x − 1) + (x² − 5x + 4)", "x²: 2 + 1 = 3. x: 3 − 5 = −2. Numbers: −1 + 4 = 3.", "So 3x² − 2x + 3. For subtraction, flip every sign in the second one first.")

L("g9-foil", 9, "Polynomials and quadratics", "Multiply binomials", {

    ns({l:"Outer + inner", a:s=>`${fmt(b)}x + ${fmtP(a)}x = ${s}x`, ans:a+b, h:`Outer: x × ${fmt(b)}. Inner: ${fmt(a)} × x. Add them.`}),
    ns({l:"Last", a:s=>`${fmtP(a)} × ${fmtP(b)} = ${s}`, ans:a*b, h:"Multiply the two numbers.", w:[[a+b,"Added instead of multiplied","The last terms multiply."]]}),
    ms({l:"Write the answer", a:S=>`x² + ${S.p}x + ${S.q}`, ans:{p:a+b, q:a*b}, h:`x², then ${fmt(a+b)}x, then ${fmt(a*b)}.`})
  ],
  learn: card("First, outer, inner, last", "(x + 3)(x + 4)", "First: x². Outer + inner: 4x + 3x = 7x. Last: 12.", "So x² + 7x + 12.")
}),
L("g9-gcf", 9, "Polynomials and quadratics", "Factor out the GCF", {
  make: () => { let m, n; do { m = rand(1,7); n = rand(1,7); } while (gcd(m,n) !== 1); return {g: rand(2,6), m, n}; },
  show: ({g,m,n}) => M(`${g*m}x² + ${g*n}x`),
  steps: ({g,m,n}) => [
    ns({l:"Number part", q:`What's the biggest number that divides ${g*m} and ${g*n}?`, a:s=>s, ans:g, h:"Find the greatest common factor of the numbers."}),
    ms({l:"Factor it out", n:"Both terms have an x, so take out an x too.", a:S=>`${g*m}x² + ${g*n}x = ${g}x(${S.m}x + ${S.n})`, ans:{m, n}, h:`${g*m}x² ÷ ${g}x = ${m === 1 ? "" : m}x and ${g*n}x ÷ ${g}x = ${n}.`})
  ],
  learn: card("Take out what they share", "6x² + 9x = 3x(2x + 3)", "Both numbers divide by 3, and both terms have an x.")
}),
L("g9-solvefactor", 9, "Polynomials and quadratics", "Solve by factoring", {
  make: () => { let p, r; do { p = rand(1,9); r = rand(1,9); } while (p === r); return {p, r}; },
  show: ({p,r}) => M(`x² − ${p+r}x + ${p*r} = 0`),
  steps: ({p,r}) => [
    ms({l:"Factor", a:S=>`(x − ${S.m})(x − ${S.n}) = 0`, ans:{m:p, n:r}, anyOrder:true, h:`Two numbers that multiply to ${p*r} and add to ${p+r}.`}),
    ms({l:"Solutions", a:S=>`x = ${S.m} or x = ${S.n}`, ans:{m:p, n:r}, anyOrder:true, h:`Set each factor to 0.`, w:[[{m:-p, n:-r},"Flipped the signs",`x − ${p} = 0 means x = ${p}.`]]})
  ],
  learn: card("Factor, then set each part to 0", "x² − 5x + 6 = 0", "(x − 2)(x − 3) = 0. So x − 2 = 0 or x − 3 = 0.", "x = 2 or x = 3.")
}),
L("g9-quadform", 9, "Polynomials and quadratics", "The quadratic formula", {
  make: () => { let r1, r2; do { r1 = rand(-8,8); r2 = rand(-8,8); } while (r1 === r2); return {r1, r2}; },
  show: ({r1,r2}) => M(`${poly([[1,"x²"],[-(r1+r2),"x"],[r1*r2,""]])} = 0`, "x = (−b ± √(b² − 4ac)) ÷ 2a"),
  steps: ({r1,r2}) => { const b = -(r1+r2), c = r1*r2, D = b*b - 4*c; return [
    ns({l:"Discriminant", a:s=>`b² − 4ac = ${fmtP(b)}² − 4(1)(${fmt(c)}) = ${s}`, ans:D, h:`${b*b} − ${fmtP(4*c)}.`, w:[[b*b+4*c,"Sign slip",`Careful: − 4ac with c = ${fmt(c)}.`]]}),
    ns({l:"Square root", a:s=>`√${D} = ${s}`, ans:Math.sqrt(D), h:`What number times itself is ${D}?`}),
    ms({l:"Both answers", a:S=>`x = ${S.m} or x = ${S.n}`, ans:{m:r1, n:r2}, anyOrder:true, h:`(${fmt(-b)} + ${Math.sqrt(D)}) ÷ 2 and (${fmt(-b)} − ${Math.sqrt(D)}) ÷ 2.`})
  ]; },
  learn: card("Discriminant first", "x² − 2x − 8 = 0", "b² − 4ac = 4 + 32 = 36, and √36 = 6.", "x = (2 + 6) ÷ 2 = 4 or x = (2 − 6) ÷ 2 = −2.")
}),
L("g9-radical", 9, "Exponents", "Simplify square roots", {
  make: () => ({k: rand(2,6), m: pick([2,3,5,6,7])}),

  steps: ({k,m}) => [
    ns({l:"Biggest perfect square", a:s=>`${k*k*m} = ${s} × ${m}`, ans:k*k, h:`Look for 4, 9, 16, 25, 36 that divide ${k*k*m}.`}),
    ns({l:"Its square root", a:s=>`√${k*k} = ${s}`, ans:k, h:`${k} × ${k} = ${k*k}.`}),
    ms({l:"Write it simply", a:S=>`√${k*k*m} = ${S.c}√${S.r}`, ans:{c:k, r:m}, h:`${k} comes out, ${m} stays inside.`})
  ],
  learn: card("Pull out the perfect square", "√72 = 6√2", "72 = 36 × 2. √36 = 6 comes out, and the 2 stays under the root.")
}),
L("g9-median", 9, "Data", "Find the median", {
  make: () => { const n = pick([5,7]); return {v: Array.from({length:n}, () => rand(1,30))}; },

    ns({l:"Median", q:`Put them in order: ${s2.join(", ")}. What's in spot ${mid}?`, a:s=>`median = ${s}`, ans:s2[mid-1], h:"Count to the middle spot of the sorted list.",
      w: v[mid-1] !== s2[mid-1] ? [[v[mid-1],"Didn't sort first","Put the numbers in order from least to greatest first."]] : []})
  ]; },

}),
];

    ns({l:"Factor the top", a:s=>`(x ${a<0?"+":"−"} ${Math.abs(a)})(x + ${s})`, ans:b, h:`Find the other factor: it multiplies with ${fmt(-a)} to make ${fmt(-a*b)}.`, n:"Plugging in gives 0 ÷ 0, so factor first."}),
    ns({l:"Cancel and plug in", a:s=>`${fmt(a)} + ${fmtP(b)} = ${s}`, ans:a+b, h:`After canceling, plug x = ${fmt(a)} into x + ${fmt(b)}.`, w:[[0,"Stopped at 0 ÷ 0","0 ÷ 0 means simplify, not that the limit is 0."]]})
  ],
  learn: card("0 ÷ 0 means factor", "lim x→2 of (x² − 4) ÷ (x − 2)", "(x − 2)(x + 2) ÷ (x − 2) = x + 2.", "Now plug in: 2 + 2 = 4.")
}),
L("g12-power", 12, "Derivatives", "Power rule", G12_POWER),
L("g12-polyd", 12, "Derivatives", "Derivative of a polynomial", {
  make: () => ({a: nz(-4,4), b: nz(-6,6), c: nz(-9,9), d: rand(-9,9)}),
  show: ({a,b,c,d}) => M(`f(x) = ${poly([[a,"x³"],[b,"x²"],[c,"x"],[d,""]])}`, "Find f′(x), then f′(1)."),
  steps: ({a,b,c}) => [
    ns({l:"x³ term", a:s=>`${s}x²`, ans:3*a, h:`3 × ${fmt(a)}.`}),
    ns({l:"x² term", a:s=>`${s}x`, ans:2*b, h:`2 × ${fmt(b)}.`}),
    ns({l:"x term", a:s=>`${s}`, ans:c, h:"The derivative of cx is c. The constant disappears."}),
    ns({l:"f′(1)", a:s=>`${fmt(3*a)} + ${fmtP(2*b)} + ${fmtP(c)} = ${s}`, ans:3*a+2*b+c, h:"With x = 1 every power of x is 1, so just add."})
  ],
  learn: card("One term at a time", "f(x) = 2x³ − x² + 5x + 7", "f′(x) = 6x² − 2x + 5. The 7 drops out.")

L("g12-chain", 12, "Derivatives", "Chain rule", {
  make: () => ({a: pick([2,3,4,5]), b: nz(-9,9), n: rand(2,5)}),

    ns({l:"Multiply in front", a:s=>`f′(x) = ${s}(${a}x ${b<0?"−":"+"} ${Math.abs(b)})${sup(n-1)}`, ans:n*a, h:`${n} × ${a}.`, w:[[n,"Forgot the inside","The chain rule multiplies by the inside's derivative too."]]})
  ],
  learn: card("Outside, then times inside", "(3x + 1)⁴", "4(3x + 1)³ × 3 = 12(3x + 1)³.")
}),
L("g12-tangent", 12, "Derivatives", "Slope of a tangent line", {
  make: () => ({a: nz(-4,4), b: nz(-9,9), k: nz(-4,4)}),
  show: ({a,b,k}) => M(`f(x) = ${poly([[a,"x²"],[b,"x"]])}`, `Find the slope at x = ${fmt(k)}.`),
  steps: ({a,b,k}) => [
    ms({l:"Derivative", a:S=>`f′(x) = ${S.p}x + ${S.r}`, ans:{p:2*a, r:b}, h:`2 × ${fmt(a)} for x², and ${fmt(b)} for the x term.`}),
    ns({l:"Plug in", a:s=>`${fmt(2*a)} · ${fmtP(k)} + ${fmtP(b)} = ${s}`, ans:2*a*k+b, h:"The slope of the tangent line is f′ at that point.", w:[[a*k*k+b*k,"Used f instead of f′","Slope comes from the derivative, not f itself."]]})
  ],

L("g12-anti", 12, "Integrals", "Antiderivatives", {
  make: () => { const n = rand(1,5); return {n, a: (n+1) * pick([1,2,3,4,-1,-2])}; },
  show: ({a,n}) => M(`∫ ${a === 1 ? "" : fmt(a)}x${sup(n)} dx`),
  steps: ({a,n}) => [
    ns({l:"Raise the exponent", a:s=>`${n} + 1 = ${s}`, ans:n+1, h:"Integrating goes the other way from derivatives: up by 1.", w:[[n-1,"Lowered instead","That's the derivative. Antiderivatives go up."]]}),
    ns({l:"Divide by it", a:s=>`${fmt(a)} ÷ ${n+1} = ${s}`, ans:a/(n+1), h:`Divide the coefficient by the new exponent, ${n+1}.`, n:`Answer: (that)x${sup(n+1)} + C`})
  ],

}),
L("g12-defint", 12, "Integrals", "Definite integrals", {
  make: () => { const n = rand(1,3); return {n, a: (n+1) * rand(1,3), k: rand(1,3)}; },
  show: ({a,n,k}) => M(`∫<sub>0</sub><sup>${k}</sup> ${a}x${sup(n === 1 ? "" : n)} dx`),

    ns({l:"Top minus bottom", a:s=>`${c}·${k}${sup(n+1)} − ${c}·0${sup(n+1)} = ${s}`, ans:c*k**(n+1), h:`Plug in ${k}, then subtract the value at 0 (which is 0).`})
  ]; },

L("g12-series", 12, "Vectors and series", "Arithmetic series", {
  make: () => ({a: rand(1,20), d: rand(1,9), n: rand(6,30)}),
  show: ({a,d,n}) => M(`${[0,1,2].map(k=>a+k*d).join(" + ")} + …`, `Add the first ${n} terms.`),
  steps: ({a,d,n}) => { const last = a+(n-1)*d; return [
    ns({l:"Last term", a:s=>`${a} + ${n-1} × ${d} = ${s}`, ans:last, h:`Term ${n} is ${n-1} jumps from the first.`, w:[[a+n*d,"Off by one",`It's ${n} − 1 jumps.`]]}),
    ns({l:"First plus last", a:s=>`${a} + ${last} = ${s}`, ans:a+last, h:"Pair the first and last terms."}),

  ]; },

L("g12-vecmag", 12, "Vectors and series", "Vector length", {
  make: () => { const [p, r, m] = pick(TRIPLES); const s1 = pick([1,-1]), s2 = pick([1,-1]); return Math.random() < .5 ? {x:s1*p, y:s2*r, m} : {x:s1*r, y:s2*p, m}; },
  show: ({x,y}) => M(`v = ⟨${fmt(x)}, ${fmt(y)}⟩`, "Find |v|."),

L("g12-dot", 12, "Vectors and series", "Dot product", {

// ---- animated pictures for the lesson cards ----
// Every picture is an SVG whose parts animate in with CSS (draw, pop, grow, fade) on a timeline set by --d.
// Reduced motion shows the finished picture. "Replay" re-inserts the picture so it plays again.
const D = t => `style="--d:${(+t).toFixed(2)}s"`;
const DD = (t, t2) => `style="--d:${(+t).toFixed(2)}s;--d2:${(+t2).toFixed(2)}s"`;
const svg = (w, h, body, label) => `<svg class="viz-svg" viewBox="0 0 ${w} ${h}" style="--w:${Math.round(w)};--h:${Math.round(h)}" role="img" aria-label="${label}">${body}</svg>`;
const T = (x, y, s, cls = "", t = 0, extra = "") => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" class="${cls}" ${D(t)} ${extra}>${s}</text>`;
const P = (d, cls, t) => `<path d="${d}" pathLength="1" class="${cls}" ${D(t)}/>`;
const viz = (inner, caption = "") => `<div class="viz">${inner}${caption ? `<p class="viz-cap">${caption}</p>` : ""}<button class="ctl replay" data-act="replay" aria-label="Play the picture again">↻ Replay</button></div>`;
const nf = v => fmt(v);

// number line with hops; hops below the line count the other way (used for "count by" pictures)
function numberLine({min, max, step = 1, every, hops = [], pts = [], seg = null, W = 520}){
  const x = v => 30 + (v - min) / (max - min) * (W - 60), y = 74, n = Math.round((max - min) / step);
  every = every || (n > 24 ? 5 : n > 12 ? 2 : 1);
  let b = `<line x1="16" y1="${y}" x2="${W-16}" y2="${y}" class="ax a-fade"/>`;
  for (let i = 0; i <= n; i++){ const v = round6(min + i*step);
    b += `<line x1="${x(v)}" y1="${y-6}" x2="${x(v)}" y2="${y+6}" class="tk a-fade" ${D(i*0.02)}/>`;
    if (i % every === 0) b += T(x(v), y + 22, nf(v), "sm a-fade", i*0.02); }
  if (seg) b += `<line x1="${x(seg[0])}" y1="${y}" x2="${x(seg[1])}" y2="${y}" class="hl a-growx" ${D(seg[2] || .6)}/>`;
  let t = .5;
  hops.forEach(h => {
    const x1 = x(h.from), x2 = x(h.to), hh = Math.min(56, Math.abs(x2 - x1) * .45 + 12) * (h.below ? -1 : 1), mx = (x1 + x2) / 2;
    if (h.start !== false) b += `<circle cx="${x1}" cy="${y}" r="7" class="dotp a-pop" ${D(t - .2)}/>`;
    b += P(`M${x1} ${y} Q${mx} ${y - hh*2} ${x2} ${y}`, `${h.below ? "ln2" : "ln"} a-draw`, t);
    if (h.label) b += T(mx, y - hh - (h.below ? -14 : 14), h.label, `lbl a-rise ${h.below ? "acc" : ""}`, t + .35);
    b += `<circle cx="${x2}" cy="${y}" r="7" class="${h.below ? "dota" : "dotp"} a-pop" ${D(t + .6)}/>`;
    t += h.dt || .75;
  });
  pts.forEach(p => { b += `<circle cx="${x(p.v)}" cy="${y}" r="7" class="${p.cls || "dotp"} a-pop" ${D(p.t ?? t)}/>`;
    if (p.label) b += T(x(p.v), y - 22, p.label, "lbl a-rise", (p.t ?? t) + .2); });
  return svg(W, 112, b, "number line");
}

// coordinate grid: points, segments, right-triangle legs, lines y = mx + b, circles, arrows
function plane({min = -1, max = 10, ymin, ymax, pts = [], segs = [], legs = null, lines = [], circle = null, arrows = [], fns = [], area = null, size = 340, step}){
  ymin = ymin ?? min; ymax = ymax ?? max;
  const pad = 26, xr = max - min, yr = ymax - ymin, ratio = yr / xr, same = ratio > .6 && ratio < 1.6;
  const s = (size - 2*pad) / Math.max(xr, yr), sx = same ? s : (size - 2*pad) / xr, sy = same ? s : (size*.8 - 2*pad) / yr;
  const W = pad*2 + xr * sx, H = pad*2 + yr * sy;
  const X = v => pad + (v - min) * sx, Y = v => H - pad - (v - ymin) * sy;
  const nice = r => [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(k => r / k <= 12) || 1000;
  const lblEvery = (r, k) => r <= 12 ? 1 : k * (r / k > 7 ? 2 : 1);
  step = step || nice(xr); const ystep = same ? step : nice(yr);
  let b = "";
  for (let v = Math.ceil(min); v <= max; v++) if (v % step === 0) b += `<line x1="${X(v)}" y1="${Y(ymin)}" x2="${X(v)}" y2="${Y(ymax)}" class="grid"/>`;
  for (let v = Math.ceil(ymin); v <= ymax; v++) if (v % ystep === 0) b += `<line x1="${X(min)}" y1="${Y(v)}" x2="${X(max)}" y2="${Y(v)}" class="grid"/>`;
  if (min <= 0 && max >= 0) b += P(`M${X(0)} ${Y(ymin)} V${Y(ymax)}`, "ax a-draw", 0);
  if (ymin <= 0 && ymax >= 0) b += P(`M${X(min)} ${Y(0)} H${X(max)}`, "ax a-draw", 0);
  const lab = (v, isX) => isX ? T(X(v), Y(Math.max(ymin, Math.min(ymax, 0))) + 14, nf(v), "xs a-fade", .3) : T(X(Math.max(min, Math.min(max, 0))) - 7, Y(v), nf(v), "xs end a-fade", .3);
  const xe = lblEvery(xr, step), ye = lblEvery(yr, ystep);
  for (let v = Math.ceil(min); v <= max; v++) if (v && v % xe === 0) b += lab(v, true);
  for (let v = Math.ceil(ymin); v <= ymax; v++) if (v && v % ye === 0) b += lab(v, false);
  if (area){ // shaded area under a curve
    const {f, a, b: bb, t = 1.6} = area; let d = `M${X(a)} ${Y(0)}`;
    for (let i = 0; i <= 60; i++){ const xv = a + (bb - a) * i / 60; d += ` L${X(xv)} ${Y(Math.max(ymin, Math.min(ymax, f(xv))))}`; }
    b += `<path d="${d} L${X(bb)} ${Y(0)} Z" class="fill a-growy" ${D(t)}/>`;
  }
  fns.forEach(({f, t = .6, cls = "ln", from = min, to = max, hole}) => {
    let d = "", pen = false;
    for (let i = 0; i <= 160; i++){
      const xv = from + (to - from) * i / 160, yv = f(xv);
      if (!Number.isFinite(yv) || yv < ymin - .01 || yv > ymax + .01){ pen = false; continue; }
      d += `${pen ? "L" : "M"}${X(xv).toFixed(1)} ${Y(yv).toFixed(1)} `; pen = true;
    }
    b += P(d, `${cls} a-draw slow`, t);
    if (hole) b += `<circle cx="${X(hole[0])}" cy="${Y(hole[1])}" r="7" class="hole a-pop" ${D(t + 1.4)}/>`;
  });
  lines.forEach(({m, b: c, t = .8, cls = "ln", vertical}) => {
    let p1, p2;
    if (vertical != null){ p1 = [vertical, ymin]; p2 = [vertical, ymax]; }
    else { // clip y = mx + c to the box
      const ends = [];
      for (const xv of [min, max]){ const yv = m*xv + c; if (yv >= ymin && yv <= ymax) ends.push([xv, yv]); }
      if (m) for (const yv of [ymin, ymax]){ const xv = (yv - c) / m; if (xv > min && xv < max) ends.push([xv, yv]); }
      ends.sort((a, b) => a[0] - b[0]); [p1, p2] = [ends[0], ends[ends.length-1]];
    }
    if (p1 && p2) b += P(`M${X(p1[0])} ${Y(p1[1])} L${X(p2[0])} ${Y(p2[1])}`, `${cls} a-draw`, t);
  });
  if (circle){ const {h, k, r, t = .8} = circle;
    b += `<circle cx="${X(h)}" cy="${Y(k)}" r="${r*sx}" pathLength="1" class="ln a-draw slow" ${D(t)} transform="rotate(-90 ${X(h)} ${Y(k)})"/>`;
    b += P(`M${X(h)} ${Y(k)} H${X(h + r)}`, "ln2 a-draw", t + 1.3) + T(X(h + r/2), Y(k) - 12, `r = ${r}`, "lbl acc a-rise", t + 1.6); }
  segs.forEach(({a, b: q, t = .8, cls = "ln"}) => { b += P(`M${X(a[0])} ${Y(a[1])} L${X(q[0])} ${Y(q[1])}`, `${cls} a-draw`, t); });
  if (legs){ const {a, b: q, t = 1.2, dx, dy} = legs;
    b += P(`M${X(a[0])} ${Y(a[1])} H${X(q[0])}`, "ln2 dash a-draw", t) + T((X(a[0]) + X(q[0])) / 2, Y(a[1]) + (q[1] > a[1] ? 16 : -16), dx, "lbl acc a-rise", t + .4);
    b += P(`M${X(q[0])} ${Y(a[1])} V${Y(q[1])}`, "ln2 dash a-draw", t + .7) + T(X(q[0]) + 22, (Y(a[1]) + Y(q[1])) / 2, dy, "lbl acc a-rise", t + 1.1); }
  arrows.forEach(({a, b: q, t = .8, label, cls = "ln2"}) => {
    b += P(`M${X(a[0])} ${Y(a[1])} L${X(q[0])} ${Y(q[1])}`, `${cls} a-draw arrow`, t);
    if (label) b += T((X(a[0]) + X(q[0])) / 2 + (a[1] === q[1] ? 0 : 26), (Y(a[1]) + Y(q[1])) / 2 + (a[1] === q[1] ? -14 : 0), label, "lbl acc a-rise", t + .4); });
  pts.forEach(({x: px, y: py, label, t = .4, cls = "dotp", dy = -16, dx = 0}) => {
    b += `<circle cx="${X(px)}" cy="${Y(py)}" r="6.5" class="${cls} a-pop" ${D(t)}/>`;
    if (label) b += T(X(px) + dx, Y(py) + dy, label, `lbl a-rise ${cls === "dota" ? "acc" : ""}`, t + .15);
  });
  return svg(W, H, b, "graph");
}
// right triangle with legs a (up) and b (across); optional squares on each side, side labels, angle mark
function rightTri({a, b, labels = {}, squares = false, angle = null, hl = [], u}){
  u = u || (squares ? 150 / Math.max(a, b) : 200 / Math.max(a, b));
  const c = Math.hypot(a, b);
  const A = [0, 0], B = [b*u, 0], C = [0, -a*u]; // right angle at A
  let pts = [A, B, C];
  const sq = (p, q, side) => { // square built outward on segment p→q
    const dx = q[0] - p[0], dy = q[1] - p[1], nx = -dy, ny = dx; // outward normal (A→B→C runs counterclockwise on screen)
    return [p, q, [q[0] + nx, q[1] + ny], [p[0] + nx, p[1] + ny]];
  };
  const S = squares ? [sq(C, A), sq(A, B), sq(B, C)] : [];
  S.forEach(s => pts = pts.concat(s));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), pad = 30, tw = t => t ? String(t).length * 9.5 + 16 : 0;
  const minx = Math.min(...xs) - pad - (squares ? 0 : tw(labels.a)), miny = Math.min(...ys) - pad, W = Math.max(...xs) - minx + pad + (squares ? 0 : tw(labels.c) / 2), H = Math.max(...ys) - miny + pad;
  const f = p => `${(p[0] - minx).toFixed(1)} ${(p[1] - miny).toFixed(1)}`, mid = (p, q) => [(p[0] + q[0]) / 2 - minx, (p[1] + q[1]) / 2 - miny];
  let body = "";
  if (squares){ const areas = [a*a, b*b, c*c];
    S.forEach((s, i) => { const cx = s.reduce((t, p) => t + p[0], 0) / 4 - minx, cy = s.reduce((t, p) => t + p[1], 0) / 4 - miny;
      body += `<path d="M${s.map(f).join(" L")} Z" class="sq${i === 2 ? " big" : ""} a-pop" ${D(1.2 + i*.7)}/>` + T(cx, cy, nf(round6(areas[i])), "lbl big a-rise", 1.5 + i*.7); }); }
  body += P(`M${f(A)} L${f(B)} L${f(C)} Z`, "ln fillsoft a-draw", .1);
  const k = 16; body += `<path d="M${f([0, -k])} L${f([k, -k])} L${f([k, 0])}" class="ax thin a-fade" ${D(.6)}/>`;
  const side = (p, q, txt, i, off, al = "") => { const [mx, my] = mid(p, q); return T(mx + off[0], my + off[1], txt, `lbl ${al} a-rise${hl.includes(i) ? " acc" : ""}`, .8 + i*.25); };
  // with squares drawn outside, the side lengths sit just inside the triangle
  if (labels.a) body += squares ? side(A, C, labels.a, 0, [12, 0], "start") : side(A, C, labels.a, 0, [-12, 0], "end");
  if (labels.b) body += side(A, B, labels.b, 1, squares ? [0, -16] : [0, 20]);
  if (labels.c) body += squares ? side(B, C, labels.c, 2, [-12, 14], "end") : side(B, C, labels.c, 2, [10, -12], "start");
  if (angle){ const r = 34, ang = Math.atan2(a, b);
    body += P(`M${f([b*u - r, 0])} A${r} ${r} 0 0 1 ${f([b*u - r*Math.cos(ang), -r*Math.sin(ang)])}`, "ln2 a-draw", 1.6) + T(b*u - r - 18 - minx, -12 - miny, angle, "lbl acc a-rise", 1.9); }
  hl.forEach((i, j) => { const seg = [[A, C], [A, B], [B, C]][i]; body += P(`M${f(seg[0])} L${f(seg[1])}`, "hlline a-draw", 2.2 + j*.8); });
  return svg(W, H, body, "right triangle");
}

// circles: circumference unrolled, area, sector, arc, unit circle angle
function circleViz({mode, r = 5, angle = 90, fn = "sin"}){
  if (mode === "circum"){

    b += `<circle cx="${cx}" cy="${cy}" r="${R}" pathLength="1" class="ln a-draw slow" ${D(.2)} transform="rotate(-90 ${cx} ${cy})"/>`;
    b += P(`M${cx - R} ${cy} H${cx + R}`, "ln2 a-draw", 1.4) + T(cx, cy - 14, `d = ${2*r}`, "lbl acc a-rise", 1.7);
    b += P(`M20 196 H${20 + L}`, "ln a-draw slow", 2.2);

    b += P(`M${20 + 6*R} 214 H${20 + L}`, "ln2 a-draw", 4.4) + T(20 + 6*R + (L - 6*R) / 2, 232, "0.14", "xs acc a-rise", 4.6);
    b += T(20 + L / 2, 172, `about 3.14 diameters = ${round6(3.14*2*r)}`, "lbl a-rise", 5);

  }
  if (mode === "area"){
    const R = 90, cx = 120, cy = 110; let b = "";
    b += `<circle cx="${cx}" cy="${cy}" r="${R}" class="fill a-pop" ${D(.2)}/><circle cx="${cx}" cy="${cy}" r="${R}" pathLength="1" class="ln a-draw" ${D(.2)} transform="rotate(-90 ${cx} ${cy})"/>`;
    b += P(`M${cx} ${cy} H${cx + R}`, "ln2 a-draw", 1) + T(cx + R/2, cy + 14, `r = ${r}`, "lbl acc a-rise", 1.2);
    b += `<rect x="${cx}" y="${cy - R}" width="${R}" height="${R}" class="sq a-pop" ${D(1.8)}/>` + T(cx + R/2, cy - R/2, `${r}×${r}`, "lbl a-rise", 2.1);
    b += T(330, 90, "The circle holds", "sm a-rise", 2.8) + T(330, 118, `3.14 of these squares`, "lbl a-rise", 3) + T(330, 150, `3.14 × ${r*r} = ${round6(3.14*r*r)}`, "lbl acc a-rise", 3.6);
    return svg(450, 220, b, "circle area");
  }

    const R = 90, cx = 120, cy = 110, fr0 = angle / 360; let b = "";
    b += `<circle cx="${cx}" cy="${cy}" r="${R}" class="ln faint"/>`;
    if (mode === "sector") b += `<circle cx="${cx}" cy="${cy}" r="${R/2}" pathLength="1" class="pie a-sweep" style="--d:.5s;--f:${fr0}" transform="rotate(-90 ${cx} ${cy})"/>`;

    b += P(`M${cx} ${cy} V${cy - R}`, "ln2 a-draw", .2);
    b += T(330, 80, `${angle}° out of 360°`, "lbl a-rise", 1.6) + T(330, 112, `= ${fracText(angle, 360)} of the circle`, "lbl acc a-rise", 2.1);
    b += T(330, 150, mode === "sector" ? "Take that part of the area" : "Take that part of the edge", "sm a-rise", 2.7);
    return svg(450, 220, b, mode);
  }

    const q = Math.floor(angle / 90) + 1, ref = [angle, 180 - angle, angle - 180, 360 - angle][q - 1];
    let b = `<line x1="${cx - R - 16}" y1="${cy}" x2="${cx + R + 16}" y2="${cy}" class="ax"/><line x1="${cx}" y1="${cy - R - 16}" x2="${cx}" y2="${cy + R + 16}" class="ax"/>`;
    b += `<circle cx="${cx}" cy="${cy}" r="${R}" class="ln faint"/>`;
    b += `<circle cx="${cx}" cy="${cy}" r="22" pathLength="1" class="arcline thin a-sweep" style="--d:.3s;--f:${angle/360}" transform="rotate(0 ${cx} ${cy}) scale(1 -1)" transform-origin="${cx} ${cy}"/>`;
    b += P(`M${cx} ${cy} L${px.toFixed(1)} ${py.toFixed(1)}`, "ln a-draw", 1.3) + `<circle cx="${px}" cy="${py}" r="7" class="dotp a-pop" ${D(1.8)}/>`;

    b += T(cx + R + 110, 134, fn === "sin" ? (q <= 2 ? "above the x-axis: sin +" : "below the x-axis: sin −") : (q === 1 || q === 4 ? "right of the y-axis: cos +" : "left of the y-axis: cos −"), "sm a-rise", 3.8);

    b += `<circle cx="${cx}" cy="${cy}" r="${R}" pathLength="1" class="arcline a-sweep" style="--d:.4s;--f:${f0}" transform="scale(1 -1)" transform-origin="${cx} ${cy}"/>`;
    b += P(`M${cx - R} ${cy} A${R} ${R} 0 0 1 ${cx + R} ${cy}`, "ln2 dash a-draw", 2) + T(cx, cy - R - 16, "half turn = 180° = π", "sm acc a-rise", 2.4);

}
function fracText(n, d){ const g = gcd(n, d); return `${n/g}/${d/g}`; }

// a rectangle split into parts (area model): cols and rows are [label, size]
function areaModel({cols, rows, cells, total, W = 440}){
  const cw = cols.map(c => c[1]), rh = rows.map(r => r[1]), sw = cw.reduce((a, b) => a + b, 0), sh = rh.reduce((a, b) => a + b, 0);
  const left = 54, top = 34, w = W - left - 14, h = Math.min(220, w * sh / sw), xs = [0], ys = [0];
  cw.forEach(c => xs.push(xs[xs.length-1] + c / sw * w)); rh.forEach(r => ys.push(ys[ys.length-1] + r / sh * h));
  let b = "", t = .2;
  cols.forEach((c, i) => b += T(left + (xs[i] + xs[i+1]) / 2, top - 16, c[0], "lbl a-rise", .1 + i*.15));
  rows.forEach((r, j) => b += T(left - 26, top + (ys[j] + ys[j+1]) / 2, r[0], "lbl a-rise", .1 + j*.15));
  rows.forEach((r, j) => cols.forEach((c, i) => {
    b += `<rect x="${left + xs[i] + 2}" y="${top + ys[j] + 2}" width="${xs[i+1] - xs[i] - 4}" height="${ys[j+1] - ys[j] - 4}" rx="8" class="cell c${(i + j) % 3} a-pop" ${D(t)}/>`;
    b += T(left + (xs[i] + xs[i+1]) / 2, top + (ys[j] + ys[j+1]) / 2, cells[j][i], "lbl a-rise", t + .25); t += .55; }));
  if (total) b += T(left + w/2, top + h + 30, total, "lbl acc a-rise", t + .2);
  return svg(W, top + h + (total ? 48 : 12), b, "area model");
}

// tape diagrams: rows of equal parts; shade the first k parts; labels on the left and a total on the right
function tape({rows, W = 480}){
  const left = 92, right = 74, bw = W - left - right, rowH = 46; let b = "", t = .2;
  rows.forEach((r, j) => {
    const y = 14 + j * (rowH + 18), pw = bw * (r.width ?? 1) / r.parts;
    b += T(left - 12, y + rowH/2, r.label, "sm end a-rise", t);
    for (let i = 0; i < r.parts; i++){
      const shaded = i < (r.shade ?? 0), cut = r.cut && i >= r.parts - r.cut;
      b += `<rect x="${left + i*pw + 1.5}" y="${y}" width="${pw - 3}" height="${rowH}" rx="7" class="seg${shaded ? " on" : ""}${cut ? " cut" : ""} a-pop" ${D(t + i*.08)}/>`;
      if (r.each) b += T(left + i*pw + pw/2, y + rowH/2, r.each, `xs a-rise${shaded ? " onlbl" : ""}`, t + i*.08 + .2);
      if (cut) b += `<line x1="${left + i*pw + 4}" y1="${y + rowH - 4}" x2="${left + (i+1)*pw - 4}" y2="${y + 4}" class="ln2 a-draw" pathLength="1" ${D(t + r.parts*.08 + .6)}/>`;
    }
    if (r.total) b += T(left + bw*(r.width ?? 1) + 12, y + rowH/2, r.total, "lbl start a-rise", t + r.parts*.08 + .3);
    t += r.parts*.08 + (r.dt ?? .8);
  });
  return svg(W, 14 + rows.length*(rowH + 18), b, "tape diagram");
}
// boxes made of unit cubes, a box's faces, a pyramid in a box, cylinders and cones
function box3D({l, w, h, mode = "cubes", u}){
  u = u || Math.min(34, 200 / (l + w), 150 / h);
  const c30 = Math.cos(Math.PI/6), s30 = .5;
  const iso = (x, y, z) => [(x - y) * c30 * u, (x + y) * s30 * u - z * u];
  const pts = []; for (const x of [0, l]) for (const y of [0, w]) for (const z of [0, h]) pts.push(iso(x, y, z));
  const minx = Math.min(...pts.map(p => p[0])) - 20, miny = Math.min(...pts.map(p => p[1])) - 20;
  const W = Math.max(...pts.map(p => p[0])) - minx + 20, H = Math.max(...pts.map(p => p[1])) - miny + 20;
  const F = (...ps) => ps.map(p => { const q = iso(...p); return `${(q[0] - minx).toFixed(1)},${(q[1] - miny).toFixed(1)}`; }).join(" ");
  let b = "";
  if (mode === "cubes"){
    let t = .2;
    for (let z = 0; z < h; z++){
      const cubes = []; for (let x = 0; x < l; x++) for (let y = 0; y < w; y++) cubes.push([x, y]);
      cubes.sort((p, q) => (p[0] + p[1]) - (q[0] + q[1]));
      b += `<g class="layer a-drop" ${D(t)}>`;
      for (const [x, y] of cubes){
        b += `<polygon points="${F([x,y,z+1],[x+1,y,z+1],[x+1,y+1,z+1],[x,y+1,z+1])}" class="cf top"/>`;
        b += `<polygon points="${F([x,y+1,z],[x+1,y+1,z],[x+1,y+1,z+1],[x,y+1,z+1])}" class="cf left"/>`;
        b += `<polygon points="${F([x+1,y,z],[x+1,y+1,z],[x+1,y+1,z+1],[x+1,y,z+1])}" class="cf right"/>`;
      }
      b += `</g>`; t += .8;
    }
    return svg(W, H, b, "box of cubes");
  }
  const top = F([0,0,h],[l,0,h],[l,w,h],[0,w,h]), front = F([0,w,0],[l,w,0],[l,w,h],[0,w,h]), side = F([l,0,0],[l,w,0],[l,w,h],[l,0,h]);
  if (mode === "faces"){
    b += `<polygon points="${top}" class="cf top a-pop" ${D(.3)}/><polygon points="${front}" class="cf left a-pop" ${D(1.1)}/><polygon points="${side}" class="cf right a-pop" ${D(1.9)}/>`;
    return svg(W, H, b, "box faces");
  }
  // pyramid inside a box
  const apex = [l/2, w/2, h];
  b += `<polygon points="${top}" class="wire a-fade" ${D(.1)}/><polygon points="${front}" class="wire a-fade" ${D(.1)}/><polygon points="${side}" class="wire a-fade" ${D(.1)}/>`;
  b += `<polygon points="${F([0,w,0],[l,w,0],apex)}" class="cf left a-pop" ${D(1)}/><polygon points="${F([l,0,0],[l,w,0],apex)}" class="cf right a-pop" ${D(1.4)}/>`;
  return svg(W, H, b, "pyramid in a box");
}
function cylinderViz({cone = false}){

  b += `<ellipse cx="${cx}" cy="${bot}" rx="${rx}" ry="${ry}" class="fill a-pop" ${D(.2)}/><ellipse cx="${cx}" cy="${bot}" rx="${rx}" ry="${ry}" class="ln a-fade" ${D(.2)}/>`;
  b += T(cx, bot, "base", "sm a-rise", .5);
  const sides = `M${cx - rx} ${bot} V${top} M${cx + rx} ${bot} V${top}`;
  if (cone){
    b += `<path d="${sides}" class="ln faint dash a-fade" ${D(.6)}/><ellipse cx="${cx}" cy="${top}" rx="${rx}" ry="${ry}" class="ln faint dash a-fade" ${D(.6)}/>`;
    b += P(`M${cx - rx} ${bot} L${cx} ${top} L${cx + rx} ${bot}`, "ln a-draw", 1.2);
    b += T(cx + 170, 90, "A cone is", "sm a-rise", 2) + T(cx + 170, 120, "⅓ of the cylinder", "lbl acc a-rise", 2.4);
  } else {
    b += `<path d="${sides}" class="ln a-growy" ${D(.8)}/><ellipse cx="${cx}" cy="${top}" rx="${rx}" ry="${ry}" class="fill a-rise" ${D(1.4)}/><ellipse cx="${cx}" cy="${top}" rx="${rx}" ry="${ry}" class="ln a-rise" ${D(1.4)}/>`;
