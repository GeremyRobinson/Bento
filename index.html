// bars that level out to the mean, or slide into order to find the median
function bars({vals, mode = "mean"}){
  const n = vals.length, bw = 52, gap = 18, W = n*(bw + gap) + 40, maxv = Math.max(...vals), H = 230, base = 190, sc = 150 / maxv;
  const mean = vals.reduce((a, b) => a + b, 0) / n; let b = "";
  b += `<line x1="10" y1="${base}" x2="${W - 10}" y2="${base}" class="ax"/>`;
  if (mode === "mean"){
    vals.forEach((v, i) => { const x = 30 + i*(bw + gap);
      b += `<rect x="${x}" y="${base - mean*sc}" width="${bw}" height="${mean*sc}" rx="8" class="bar a-level" style="--d:1.6s;--from:${(v/mean).toFixed(3)}"/>`;
      b += T(x + bw/2, base - v*sc - 14, nf(v), "lbl a-outsoon", 0, `style="--d:1.4s"`);
    });
    b += P(`M10 ${base - mean*sc} H${W - 10}`, "ln2 dash a-draw", 2.6) + T(W/2, base - mean*sc - 16, `share it out: ${nf(mean)} each`, "lbl acc a-rise", 2.9);
    return svg(W, H, b, "mean");
  }
  const order = vals.map((v, i) => [v, i]).sort((p, q) => p[0] - q[0]);
  vals.forEach((v, i) => { const to = order.findIndex(o => o[1] === i), x = 30 + to*(bw + gap), dx = (i - to)*(bw + gap);
    const mid = to === (n - 1) / 2;
    b += `<g class="a-slide" style="--d:1s;--dx:${dx}px"><rect x="${x}" y="${base - v*sc}" width="${bw}" height="${v*sc}" rx="8" class="bar${mid ? " mid" : ""}" ${mid ? `style="--d:2.4s"` : ""}/>${T(x + bw/2, base - v*sc - 14, nf(v), "lbl")}</g>`; });
  b += T(W/2, base + 24, "sorted: the middle one is the median", "sm acc a-rise", 2.6);
  return svg(W, H + 10, b, "median");
}

// a balance scale: equal things come off both sides and it stays level
function balance({frames}){
  const W = 480, H = 210, beamY = 100; let b = "";
  b += `<path d="M${W/2} ${beamY} L${W/2 - 26} ${H - 14} H${W/2 + 26} Z" class="fulcrum"/><line x1="40" y1="${beamY}" x2="${W - 40}" y2="${beamY}" class="beam"/>`;
  b += `<line x1="70" y1="${beamY}" x2="70" y2="${beamY + 6}" class="ax"/><line x1="${W - 70}" y1="${beamY}" x2="${W - 70}" y2="${beamY + 6}" class="ax"/>`;
  const side = (items, cx) => { // items: ["x","x",5] — x tiles and number blocks, laid out in a row on the pan
    const ws = items.map(it => it === "x" ? 40 : Math.max(40, 18 + String(it).length*14)), tot = ws.reduce((a, b) => a + b + 6, -6);
    let x = cx - tot/2, out = "";
    items.forEach((it, i) => { out += `<rect x="${x}" y="${beamY - 46}" width="${ws[i]}" height="40" rx="9" class="${it === "x" ? "tile x" : "tile n"}"/>` + T(x + ws[i]/2, beamY - 26, it === "x" ? "x" : nf(it), `lbl ${it === "x" ? "onlbl" : ""}`); x += ws[i] + 6; });
    return out;
  };
  frames.forEach((f, i) => {
    const t0 = .2 + i*1.8, last = i === frames.length - 1;
    b += `<g class="${last ? "a-fade" : "a-flash"}" ${DD(t0, t0 + 1.6)}>${side(f.left, 120)}${side(f.right, W - 120)}${T(W/2, 22, f.note, "lbl acc")}</g>`;
  });
  return svg(W, H, b, "balance");
}

// a decimal point hopping left or right
function decimalShift({digits, from, to, label}){
  // digits: string of digits without the point; from/to: how many digits sit left of the point
  const cw = 46, n = digits.length, W = n*cw + 80, y = 70; let b = "";
  [...digits].forEach((dg, i) => b += `<rect x="${40 + i*cw + 3}" y="${y - 30}" width="${cw - 6}" height="56" rx="10" class="seg"/>` + T(40 + i*cw + cw/2, y - 2, dg, "big a-fade", .1 + i*.05));
  const X = k => 40 + k*cw, steps = Math.abs(to - from), dir = Math.sign(to - from);
  b += `<circle cx="${X(from)}" cy="${y + 22}" r="6" class="dotp a-move" style="--d:1.4s;--dx:${(to - from)*cw}px;--dur:${.45*steps + .3}s"/>`;
  for (let k = 0; k < steps; k++){ const a = X(from + k*dir), c = X(from + (k + 1)*dir);
    b += P(`M${a} ${y + 40} Q${(a + c)/2} ${y + 62} ${c} ${y + 40}`, "ln2 a-draw arrow", 1.4 + k*.45); }
  b += T(W/2, y + 84, label, "lbl acc a-rise", 1.6 + steps*.45);
  return svg(W, y + 98, b, "decimal point moving");
}

// things to choose from: dots in groups; with pairs, lines join every pair
function marbles({groups = [], pairs = 0}){
  let b = "";
  if (pairs){
    const n = pairs, R = 80, cx = 140, cy = 110, pt = i => [cx + R*Math.cos(-Math.PI/2 + i*2*Math.PI/n), cy + R*Math.sin(-Math.PI/2 + i*2*Math.PI/n)];
    let t = .6, k = 0;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++){ const [a, c] = [pt(i), pt(j)]; b += P(`M${a[0]} ${a[1]} L${c[0]} ${c[1]}`, "ln thin a-draw", t); t += .22; k++; }
    for (let i = 0; i < n; i++){ const [x, y] = pt(i); b += `<circle cx="${x}" cy="${y}" r="15" class="marble c${i % 3} a-pop" ${D(.1 + i*.08)}/>` + T(x, y, String.fromCharCode(65 + i), "sm onlbl a-fade", .2 + i*.08); }
    b += T(360, 100, `${k} lines`, "lbl acc a-rise", t + .2) + T(360, 128, "one for each pair", "sm a-rise", t + .4);
    return svg(450, 220, b, "pairs");
  }
  let x = 30, t = .2; const y = 60;
  groups.forEach(g => { for (let i = 0; i < g.n; i++){ b += `<circle cx="${x}" cy="${y}" r="17" class="marble ${g.cls} a-pop${g.hl ? " ring" : ""}" ${D(t)}/>`; x += 42; t += .1; } x += 14; });
  b += T(x/2, 118, groups.map(g => `${g.n} ${g.label}`).join(" + ") + ` = ${groups.reduce((a, g) => a + g.n, 0)}`, "lbl a-rise", t + .3);
  return svg(Math.max(x, 260), 140, b, "marbles");
}

// fraction of a fraction: shade rows for one fraction, columns for the other; the overlap is the product
function fracGrid({rows, cols, r, c}){
  const cell = 46, W = cols*cell + 40, H = rows*cell + 40; let b = "";
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++){
    const inR = i < r, inC = j < c;
    b += `<rect x="${20 + j*cell + 2}" y="${20 + i*cell + 2}" width="${cell - 4}" height="${cell - 4}" rx="6" class="seg"/>`;
    if (inR) b += `<rect x="${20 + j*cell + 2}" y="${20 + i*cell + 2}" width="${cell - 4}" height="${cell - 4}" rx="6" class="shadeA a-fade" ${D(.4 + i*.15)}/>`;
    if (inC) b += `<rect x="${20 + j*cell + 2}" y="${20 + i*cell + 2}" width="${cell - 4}" height="${cell - 4}" rx="6" class="shadeB a-fade" ${D(1.6 + j*.15)}/>`;
    if (inR && inC) b += `<rect x="${20 + j*cell + 6}" y="${20 + i*cell + 6}" width="${cell - 12}" height="${cell - 12}" rx="4" class="both a-pop" ${D(2.8 + (i*cols + j)*.06)}/>`;
  }
  return svg(W, H, b, "fraction grid");
}
// angles: on a straight line or a corner, a triangle's angles, an exterior angle, a polygon cut into triangles
function angleViz({kind, a, b}){

    return P(`M${(cx + rr*Math.cos(r1)).toFixed(1)} ${(cy - rr*Math.sin(r1)).toFixed(1)} A${rr} ${rr} 0 ${d2 - d1 > 180 ? 1 : 0} 0 ${(cx + rr*Math.cos(r2)).toFixed(1)} ${(cy - rr*Math.sin(r2)).toFixed(1)}`, cls + " a-draw", t); };

function triangleAngles({A, B, exterior = false}){
  const C = 180 - A - B, x0 = 40, y0 = 190;
  const ra = A*Math.PI/180, rb = B*Math.PI/180, hk = Math.sin(ra) * Math.sin(rb) / Math.sin(ra + rb);
  const base = Math.min(300, 140 / hk), h = base * hk, px = x0 + h / Math.tan(ra);
  const P1 = [x0, y0], P2 = [x0 + base, y0], P3 = [px, y0 - h];
  let s = P(`M${P1} L${P2} L${P3} Z`, "ln fillsoft a-draw", .1);
  const arcAt = (p, d1, d2, rr, cls, t) => { const r1 = d1*Math.PI/180, r2 = d2*Math.PI/180;
    return P(`M${(p[0] + rr*Math.cos(r1)).toFixed(1)} ${(p[1] - rr*Math.sin(r1)).toFixed(1)} A${rr} ${rr} 0 0 0 ${(p[0] + rr*Math.cos(r2)).toFixed(1)} ${(p[1] - rr*Math.sin(r2)).toFixed(1)}`, cls + " a-draw", t); };
  s += arcAt(P1, 0, A, 30, "ln", 1) + T(P1[0] + 50*Math.cos(ra/2), P1[1] - 50*Math.sin(ra/2), `${A}°`, "lbl a-rise", 1.2);
  s += arcAt(P2, 180 - B, 180, 30, "ln", 1.5) + T(P2[0] - 52*Math.cos(rb/2), P2[1] - 52*Math.sin(rb/2), `${B}°`, "lbl a-rise", 1.7);
  if (!exterior){
    s += arcAt(P3, 180 + A, 360 - B, 26, "ln2", 2.2) + T(P3[0], P3[1] + 44, "?", "lbl acc a-rise", 2.4);
    s += T(260, 30, `${A} + ${B} + ? = 180`, "lbl acc a-rise", 2.8);
  } else {
    s += P(`M${P2} L${P2[0] + 110} ${y0}`, "ax dash a-draw", 2);
    s += arcAt(P2, 0, 180 - B, 22, "ln2", 2.6) + T(P2[0] + 46, P2[1] - 30, `${A + B}°`, "lbl acc a-rise", 2.9);
    s += T(230, 26, `outside = ${A} + ${B}`, "lbl acc a-rise", 3.3);
  }
  return svg(exterior ? 470 : 380, 210, s, "triangle angles");
}
function polygonSplit({n}){
  const cx = 130, cy = 120, R = 100, pt = i => [cx + R*Math.cos(-Math.PI/2 + i*2*Math.PI/n), cy + R*Math.sin(-Math.PI/2 + i*2*Math.PI/n)];
  const ps = Array.from({length: n}, (_, i) => pt(i));
  let s = "";
  for (let i = 1; i < n - 1; i++) s += `<polygon points="${[ps[0], ps[i], ps[i+1]].map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")}" class="tri c${i % 3} a-pop" ${D(.9 + i*.45)}/>`;
  s += P(`M${ps.map(p => p.map(v => v.toFixed(1)).join(" ")).join(" L")} Z`, "ln a-draw", .1);
  s += T(330, 90, `${n - 2} triangles`, "lbl a-rise", .9 + (n - 1)*.45) + T(330, 122, `${n - 2} × 180° = ${(n - 2)*180}°`, "lbl acc a-rise", 1.3 + (n - 1)*.45);
  return svg(450, 240, s, "polygon split into triangles");
}
function similarViz({a, b, k}){
  const u = 16, P1 = [30, 190]; let s = "";
  const tri = (sc, cls, t) => P(`M${P1} L${P1[0] + b*u*sc} ${P1[1]} L${P1[0]} ${P1[1] - a*u*sc} Z`, cls + " a-draw", t);
  s += tri(1, "ln fillsoft", .1) + T(P1[0] - 14, P1[1] - a*u/2, a, "lbl a-rise", .5) + T(P1[0] + b*u/2, P1[1] + 16, b, "lbl a-rise", .5);
  s += `<g class="a-grow" style="--d:1.2s;--from:${1/k}" transform-origin="${P1[0]} ${P1[1]}">${tri(k, "ln2 dash", 0)}</g>`;
  s += T(P1[0] - 16, P1[1] - a*u*k + 14, a*k, "lbl acc a-rise", 2.2) + T(P1[0] + b*u*k/2, P1[1] + 16, "?", "lbl acc a-rise", 2.4);
  s += T(320, 40, `× ${k} everywhere`, "lbl acc a-rise", 2.6);
  return svg(420, 210, s, "similar triangles");
}
// add pairs from the outside in: 1 + 100, 2 + 99, …
function pairsViz(){
  const items = ["1","2","3","…","98","99","100"], x = i => 40 + i*62; let s = "";
  items.forEach((t, i) => s += T(x(i), 120, t, "lbl a-rise", .1 + i*.05));
  [[0,6],[1,5],[2,4]].forEach(([a, b], k) => { const h = 80 - k*20;
    s += P(`M${x(a)} 100 Q${(x(a) + x(b))/2} ${100 - h} ${x(b)} 100`, `${k ? "ln2" : "ln"} a-draw`, .6 + k*.6);
    if (!k) s += T((x(a) + x(b))/2, 100 - h/2 - 14, "each pair makes 101", "sm acc a-rise", .9); });
  s += T(226, 160, "50 pairs × 101 = 5,050", "lbl acc a-rise", 2.6);
  return svg(450, 176, s, "pairs that add to 101");
}

  "g11-radical": () => viz(steps([`√(x + 3) = 5`, `${mk("(")}√(x + 3)${mk(")²")} = 5${mk("²")}`, `x + 3 = 25`, `x = 22`])),
  "g11-complex": () => viz(areaModel({cols:[["1",3],["4i",4]], rows:[["2",3],["3i",4]], cells:[["2","8i"],["3i","12i² = −12"]], total:"2 − 12 + 11i = −10 + 11i"})),
  "g11-comb": () => viz(marbles({pairs:5})),

  "g12-vecmag": () => viz(plane({min:-1, max:5, ymin:-5, ymax:1, arrows:[{a:[0,0], b:[3,-4], t:.6, cls:"ln"}], legs:{a:[0,0], b:[3,-4], dx:"3", dy:"4", t:1.4}}), "A 3-4-5 triangle: |v| = 5."),

// ---- lessons: all open, so she can skip ahead or go back. Keep ids stable: saved progress uses them. ----
const FRACTIONS = op => ({ make: i => makeProblem(i, op(i)), steps: stepsFor, show: p => `<div class="math">${fr(p.a,p.b)} ${p.op} ${fr(p.c,p.d)}</div>` });
const BY_GRADE = [G5, G6, G7, G8, G9, G10, G11, G12];
const LESSONS = [
  { id:"k-add", grade:0, title:"Adding within 10", ...K_ADD },
  { id:"g1-ten", grade:1, title:"Make a ten to add", ...G1_TEN },
  { id:"g2-regroup", grade:2, title:"Adding with regrouping", ...G2_REGROUP },
  { id:"g3-split", grade:3, title:"Multiply by breaking apart", ...G3_SPLIT },
  { id:"g4-partial", grade:4, unit:"Whole numbers", title:"Multiply big numbers", ...G4_PARTIAL },
  ...G4,
  { id:"add", grade:5, unit:"Fractions", title:"Adding fractions", learn:LEARN_ADD, ...FRACTIONS(() => "+") },
  { id:"sub", grade:5, unit:"Fractions", title:"Subtracting fractions", learn:LEARN_SUB, ...FRACTIONS(() => "−") },
  { id:"mix", grade:5, unit:"Fractions", title:"Adding and subtracting", learn:LEARN_MIX, ...FRACTIONS(i => i % 2 ? "−" : "+") },
  { id:"g6-divide", grade:6, unit:"Number system", title:"Dividing fractions", ...G6_DIVIDE },
  { id:"g7-eq", grade:7, unit:"Expressions and equations", title:"Two-step equations", ...G7_EQ },
  { id:"g8-pyth", grade:8, unit:"Geometry", title:"Pythagorean theorem", ...G8_PYTH },
  { id:"g9-factor", grade:9, unit:"Polynomials and quadratics", title:"Factoring quadratics", ...G9_FACTOR },
  ...BY_GRADE.flat()
].map((l,k) => ({l, k})).sort((x,y) => x.l.grade - y.l.grade || unitRank(x.l) - unitRank(y.l) || x.k - y.k).map(x => x.l);

// ---- word problems: a story for some lessons (every third problem). op is the operation the story needs. ----
const B = x => `<b>${x}</b>`;
const STORIES = {
  "g2-regroup": ({a,b}) => ({op:"+", text:`A class read ${B(a)} books in May and ${B(b)} books in June. How many books did they read in all?`}),
  "g3-split": ({a,b}) => ({op:"×", text:`There are ${B(a)} bags. Each bag has ${B(b)} apples. How many apples are there?`}),
  "g4-partial": ({n,m}) => ({op:"×", text:`A box holds ${B(n)} crayons. How many crayons are in ${B(m)} boxes?`}),
  "g4-divide": ({dv,q,r}) => ({op:"÷", text:`${B(dv*q + r)} stickers are shared equally by ${B(dv)} friends. How many does each friend get, and how many are left over?`}),
  "g4-likefrac": ({a,c,d}) => ({op:"+", text:`Sam ate ${fr(a,d)} of a pizza. Ana ate ${fr(c,d)} of the same pizza. How much pizza did they eat together?`}),
  "g4-fracwhole": ({n,d,W}) => ({op:"×", text:`Each muffin uses ${fr(n,d)} cup of milk. How much milk do ${B(W)} muffins use?`}),
  "g5-mult2": ({a,b}) => ({op:"×", text:`A theater has ${B(b)} rows. Each row has ${B(a)} seats. How many seats are there?`}),
  "g5-divide": ({dv,n}) => ({op:"÷", text:`${B(n)} marbles are packed equally into ${B(dv)} jars. How many marbles go in each jar?`}),
  "g5-adddec": ({a,b}) => ({op:"+", text:`Maya biked ${B(fmt(a))} km on Saturday and ${B(fmt(b))} km on Sunday. How far did she bike in all?`}),
  "g5-multdec": ({A,B:b}) => ({op:"×", text:`A garden bed is ${B(fmt(A/10))} m long and ${B(fmt(b/10))} m wide. What is its area in square meters?`}),
  "g5-divdec": ({d,qt}) => ({op:"÷", text:`You have ${B(fmt(d*qt/10))} liters of juice. Each cup holds ${B(fmt(d/10))} liters. How many cups can you fill?`}),
  "add": ({a,b,c,d}) => ({op:"+", text:`You walked ${fr(a,b)} of a mile to the park and then ${fr(c,d)} of a mile to the store. How far did you walk in all?`}),
  "sub": ({a,b,c,d}) => ({op:"−", text:`There was ${fr(a,b)} of a cake left. The family ate ${fr(c,d)} of a cake. How much cake is left now?`}),
  "mix": ({a,b,c,d,op}) => op === "+" ? {op, text:`A plant grew ${fr(a,b)} inch in May and ${fr(c,d)} inch in June. How much did it grow in all?`}
    : {op, text:`A jug had ${fr(a,b)} gallon of water. You poured out ${fr(c,d)} gallon. How much is left?`},
  "g5-multfrac": ({a,b,c,d}) => ({op:"×", text:`${fr(c,d)} of a garden is vegetables. ${fr(a,b)} of the vegetable part is carrots. What part of the whole garden is carrots?`}),
  "g5-fracof": ({n,d,W}) => ({op:"×", text:`There are ${B(W)} marbles in a bag. ${fr(n,d)} of them are blue. How many marbles are blue?`}),
  "g5-unitdiv": ({W,d}) => ({op:"÷", text:`You have ${B(W)} cups of flour. Each batch of cookies uses ${fr(1,d)} cup. How many batches can you make?`}),
  "g5-units": ({u:[one,many,small],n}) => ({op:"×", text:`A rope is ${B(n)} ${n === 1 ? one : many} long. How many ${small} long is it?`}),
  "g6-divide": ({a,b,c,d}) => ({op:"÷", text:`You have ${fr(a,b)} yard of ribbon. Each bow needs ${fr(c,d)} yard. How many bows can you make?`}),
};
// ---- "Build up first": the lesson underneath each one, suggested after a 0 or 1 ----
const PRE = {"g4-partial":"g3-split", "g4-likefrac":"g4-equiv", "g5-mult2":"g4-partial", "g5-divide":"g4-divide", "g5-order":"g5-mult2",
  "add":"g4-likefrac", "sub":"g4-likefrac", "mix":"add", "g5-multfrac":"g4-fracwhole", "g5-fracof":"g4-fracwhole", "g5-improper":"g4-equiv",
  "g5-adddec":"g4-dec", "g5-round":"g4-dec", "g5-multdec":"g5-mult2", "g5-divdec":"g5-divide", "g5-volume":"g4-area", "g5-unitdiv":"g5-fracof",
  "g6-divide":"g5-multfrac", "g6-pctof":"g5-fracof", "g6-rate":"g5-divide", "g6-tri":"g4-area", "g6-trap":"g6-tri", "g6-onestep":"g5-order",
  "g7-eq":"g6-onestep", "g7-angles":"g4-angles", "g7-circarea":"g6-expo", "g8-pyth":"g8-roots", "g8-leg":"g8-pyth", "g8-both":"g7-eq", "g9-multistep":"g8-both"};
for (const l of LESSONS){ if (STORIES[l.id]) l.story = STORIES[l.id]; if (PRE[l.id]) l.pre = PRE[l.id]; }
// units keep the order they have in each grade's list
function unitRank(l){ const g = l.grade === 4 ? G4 : BY_GRADE[l.grade-5]; return g ? Math.max(0, g.findIndex(m => m.unit === l.unit)) : 0; }
const inGrade = g => LESSONS.map((l,i)=>i).filter(i => LESSONS[i].grade === g);
const tintOf = i => inGrade(LESSONS[i].grade).indexOf(i) % 3;
if (!save.gxp){ // grade XP started later: count what the summaries already show
  save.gxp = {};
  for (const r of Object.values(save.reports)){ const g = r.mode === "test" ? Number(r.key.split(":")[1]) : (LESSONS.find(l => l.id === r.key) || {}).grade; if (g != null) save.gxp[g] = (save.gxp[g] || 0) + (r.xp || 0); }
}
// first time on this device: start on the grade picker instead of assuming a grade
if (!save.chosen && !save.xp && !save.done) view = "welcome";
if (save.grade == null) save.grade = 5;
let cur = 0;
const lessonDone = id => (save.lessons && save.lessons[id]) || 0;

// a small house: the way home from any lesson, practice or report
const HOME_ICON = `<svg viewBox="2.5 2.5 19 19" aria-hidden="true"><path d="M4 11.2 12 4.5l8 6.7M6.5 9.5V19h4v-5h3v5h4V9.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function lessonNav(){
  const g = inGrade(LESSONS[cur].grade), k = g.indexOf(cur);
  return `<div class="bar"><button class="ctl circ" data-lesson="${g[k-1]}" ${k>0?"":"disabled"} aria-label="Previous lesson"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="grow" style="text-align:center">${LESSONS[cur].title}</span>
    <button class="ctl circ" data-lesson="${g[k+1]}" ${k<g.length-1?"":"disabled"} aria-label="Next lesson"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>`;
}
// the lesson: idea cards with a moving picture, then one problem solved step by step, then practice
function newExample(){ const l = LESSONS[cur]; learnEx = {id:l.id, p:l.make(rand(0, 3)), n:0, fresh:false}; }
function learnHTML(){
  const l = LESSONS[cur], cards = l.learn, total = cards.length + 1, rep = save.reports[l.id];
  if (!learnEx || learnEx.id !== l.id) newExample();
  const nav = `<div class="bar"><button class="ctl circ" data-go="home" aria-label="Home">${HOME_ICON}</button><span class="dots-nav">${Array.from({length:total}, (_, i) => `<span class="dot ${i < learnIdx ? "ok" : i === learnIdx ? "busy" : ""}"></span>`).join("")}</span><button class="ctl" data-go="practice">Practice</button></div>`;
  let body;
  if (learnIdx < cards.length){
    const c = cards[learnIdx], pic = learnIdx === 0 && VIZ[l.id] ? VIZ[l.id]() : "";
    body = `<section class="panel learn"><div class="card"><h2 class="label">${c.h}</h2>${pic ? c.body.replace(/<div class="math">[\s\S]*?<\/div>/, m => m + pic) : c.body}</div>
      <div class="actions" style="justify-content:space-between"><button class="ctl" data-learn="-1" ${learnIdx === 0 ? "disabled" : ""}>Back</button><button class="ctl go" data-learn="1">${learnIdx < cards.length - 1 ? "Next" : "Watch one solved"}</button></div></section>`;
  } else {
    const ex = learnEx, steps = l.steps(ex.p), n = ex.n, done = n >= steps.length;
    body = `<section class="panel learn walk"><div class="card"><h2 class="label">Watch one, step by step</h2>${l.show(ex.p)}
      <div class="work">${steps.slice(0, n).map((s, k) => `<div class="workline${ex.fresh && k === n - 1 ? " enter" : ""}"><span class="k">Step ${k+1}</span><span class="wl">${s.work()}</span><span class="why">${s.label.replace(/^Step \d+ · /, "")}: ${s.explain}</span></div>`).join("")}</div>
      <p class="note">${done ? "That's the whole problem. Your turn!" : `Next: ${steps[n].label.replace(/^Step \d+ · /, "")}`}</p></div>
      <div class="actions" style="justify-content:space-between"><button class="ctl" data-learn="-1">Back</button>
        <span class="actions">${done ? `<button class="ctl" data-walk="new">Another one</button><button class="ctl go" data-go="practice">Start practice</button>` : `<button class="ctl" data-walk="all">Show all</button><button class="ctl go" data-walk="next">Show step ${n + 1}</button>`}</span></div></section>`;
  }
  // bento: the picture card is the big tile; the outline, last score and help level sit beside it
  const gl = inGrade(l.grade), sc = lastScore(l.id), back = sc != null && sc <= 1 ? backFor(l.id) : -1;
  const side = `<aside class="lside">
    <section class="tile lmap"><span class="k">${l.unit || GRADE_NAME[l.grade]} · lesson ${gl.indexOf(cur) + 1} of ${gl.length}</span>
      <div class="outline">${[...cards.map(c => c.h), "Watch one solved"].map((h, i) => `<button class="${i === learnIdx ? "on" : i < learnIdx ? "seen" : ""}" data-learn="${i - learnIdx}" ${i === learnIdx ? "disabled" : ""}><span class="badge">${i + 1}</span><span class="name">${h}</span></button>`).join("")}</div>
      <button class="ctl go" data-go="practice">Start practice ›</button></section>
    ${rep ? `<button class="lesson" data-report="${rep.key}">${scoreChip(rep.level)}<span class="name">Last time: ${LEVELS[rep.level]}</span><span class="muted">${when(rep.date)} ›</span></button>` : ""}
    ${sc != null ? `<section class="tile helptile"><span class="k">Help in practice</span><b>${HELP[tierOf(l.id)]}</b><span class="muted">${["It fades as your score grows.", "Score 3 to go to final answers.", "Miss one and the steps come back."][tierOf(l.id)]}</span></section>` : ""}
    ${back >= 0 ? `<button class="lesson t1 backup" data-lesson="${back}"><span class="badge">↩</span><span class="name">Build up first: ${LESSONS[back].title}</span><span class="muted">${GRADE_NAME[LESSONS[back].grade]}</span></button>` : ""}
  </aside>`;
  return `${nav}${lessonNav()}<div class="blearn">${body}${side}</div>`;
}

const item = () => st.items[st.i];
const lessonOf = it => LESSONS[idx(it.id)];
const canShow = () => st.mode !== "test" && (st.misses >= 2 || (st.hinted && st.misses >= 1));
function practiceHTML(){
  const it = item(), s = st.steps[st.step], fb = st.feedback, n = st.items.length, test = st.mode === "test", mixed = st.mode !== "practice", fx = st.fx || {};
  const tapOnly = s && (s.choices || st.pick);
  const dotFor = {good:"ok", bad:"err", hint:"busy"};
  return `<div class="bar"><button class="ctl circ" data-go="home" aria-label="Home">${HOME_ICON}</button><button class="ctl" data-go="${mixed ? "home" : "learn"}" aria-label="${mixed ? "Quit" : "Back to the lesson"}">${mixed ? "Quit" : "Lesson"}</button>
    <span class="steps" aria-label="Problem ${st.i+1} of ${n}">${st.items.map((_,i)=>`<span class="dot ${i<st.i?"ok":i===st.i?"busy":""}"></span>`).join("")}</span>
    <span class="ctl badged"><span class="badge on">${st.i+1}</span>of <span class="mono">${n}</span></span></div>
  ${test ? `<div class="bar"><span class="grow" style="text-align:center">${st.title}: no hints, one try per step</span></div>` : ""}
  <section class="panel split">
    <div class="col">
    <div class="card">${mixed ? `<div class="label">${lessonOf(it).title}</div>` : ""}${showItem(it)}
      <div class="work">${st.work.map((w,k)=>`<div class="workline ${w.shown?"shown":""}${fx.line && k === st.work.length-1 ? " enter" : ""}"><span class="k">Step ${k+1}</span><span class="wl">${w.html}</span></div>`).join("")}</div>
    </div>
    ${s ? `<div class="card${fx.shake ? " shake" : ""}${fx.line ? " enter" : ""}">${st.pick
      ? `<div class="label">Step ${st.step + 1} · What comes next?</div><div class="choices">${st.pick.opts.map((o, i) => `<button class="choice" data-pick="${i}">${o}</button>`).join("")}</div>`
      : `<div class="label">${s.label}</div>
      <div class="ask">${s.ask()}</div>${s.choices ? `<div class="choices">${s.choices.map((o, i) => `<button class="choice" data-choice="${i}">${o}</button>`).join("")}</div>` : ""}
      ${s.note ? `<div class="note">${s.note}</div>` : ""}`}</div>` : ""}
    </div>
    <div class="col">
    ${fb ? `<div class="feedback fb-${fb.type}${Object.keys(fx).length ? " enter" : ""}" role="status"><span class="dot ${dotFor[fb.type]}"></span><span>${fb.html}</span></div>` : ""}
    ${s && tapOnly ? `<div class="tapnote muted">${st.pick ? "You plan this one: tap the step that comes next." : "Tap your answer."}</div>` : ""}
    ${s && !tapOnly ? `<div class="tray">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-key="${n}">${n}</button>`).join("")}
      ${band() === "little" ? `<span></span><button data-key="0">0</button><span></span>` : `<button data-key="−" aria-label="Negative">−</button><button data-key="0">0</button><button data-key="." aria-label="Decimal point">.</button>`}
      <button data-key="next" class="wide" aria-label="Next box">Next box ⇥</button><button data-key="back" aria-label="Erase">⌫</button></div>` : ""}
    ${s ? `<div class="actions">
      ${test ? "" : `<button class="ctl badged" data-act="hint" ${(st.hintsLeft || st.hinted) && !st.pick ? "" : "disabled"}><span class="badge">${st.hintsLeft}</span>Hint${st.hintsLeft === 1 ? "" : "s"}</button>`}
      ${canShow() ? `<button class="ctl" data-act="show">Show me</button>` : ""}
      ${canSkip() ? `<button class="ctl" data-act="skip">${st.skip ? "Show steps" : "Final answer only"}</button>` : ""}
      ${tapOnly ? "" : `<button class="ctl go" data-act="check">Check</button>`}
    </div>` : `<div class="actions"><button class="ctl go" data-act="nextprob">${st.i < n-1 ? "Next problem" : test ? "Finish test" : st.mode === "review" ? "Finish review" : "Finish lesson"}</button></div>`}
    </div>
  </section>`;
}

// ---- runs: practice for one lesson, or a test across a unit or a whole grade ----
function newRun(mode, items, extra){
  st = { mode, items, i:0, vals:{}, active:"x", misses:0, feedback:null, clean:0, mistakes:[], probs:[], xpEarned:0,
         hints:0, shown:0, extra:0, pts:0, maxPts:0, t0:Date.now(), hintsLeft: Math.ceil(items.length/2), skip:true, ...extra };
  startProblem();
}
function startPractice(){
  const l = LESSONS[cur], sc = lastScore(l.id);
  const n = sc != null && sc <= 1 ? 10 : LESSON_LEN; // she struggled last time: start with more problems
  newRun("practice", Array.from({length:n}, (_,i) => makeItem(l, i)), {key:l.id, title:l.title, startTier:tierOf(l.id)});
}
// ---- word problems: some lessons tell a story every third problem; she picks the operation first, then solves it ----
const OPS = ["+", "−", "×", "÷"], OP_NAME = {"+":"Add", "−":"Subtract", "×":"Multiply", "÷":"Divide"};
const OP_WHY = {"+":"Putting amounts together means adding.", "−":"Taking away, or finding how much more, means subtracting.",
  "×":"Equal groups, or a part of a group, means multiplying.", "÷":"Sharing equally, or splitting into groups, means dividing."};
function makeItem(l, i){ const p = l.make(i); if (l.story && i % 3 === 2) p.story = 1; return {id:l.id, p}; }
function showItem(it){
  const l = lessonOf(it); if (!l) return "";
  return it.p.story && l.story ? `<div class="story"><p>${l.story(it.p).text}</p></div>` : l.show(it.p);
}
function opStep(l, p){
  const S = l.story(p), k = OPS.indexOf(S.op), math = (l.show(p).match(/<div class="math">([\s\S]*?)<\/div>/) || [, ""])[1];
  return { label:"Read the story", choices: OPS.map(o => `${o} ${OP_NAME[o]}`), ask: () => q("Which operation solves it?"),
    check: v => v.c === k ? {ok:true} : {kind:"Picked the wrong operation", msg:"Read the story again. Is it putting together, taking away, equal groups, or sharing?"},
    hint: OP_WHY[S.op], answer:{c:k}, explain: OP_WHY[S.op], work: () => `${math} <span class="muted">(${OP_NAME[S.op].toLowerCase()})</span>` };
}
function shuffle(a){ a = [...a]; for (let i = a.length-1; i > 0; i--){ const j = rand(0,i); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function startTest(key){
  const [kind, g, unit] = key.split(":");
  const list = kind === "unit" ? inGrade(+g).filter(i => (LESSONS[i].unit || "Skills") === unit) : inGrade(+g);
  const n = Math.min(kind === "unit" ? 10 : 12, Math.max(6, list.length * 2));
  const order = shuffle(list);
  const items = shuffle(Array.from({length:n}, (_,k) => makeItem(LESSONS[order[k % order.length]], k)));
  cur = order[0];
  newRun("test", items, {key, title: kind === "unit" ? `${unit} test` : `${GRADE_NAME[+g]} check-up`, hintsLeft:0});
}
function startProblem(){ st.step = 0; st.work = []; st.prob = {wrong:0, hints:0, shown:0, t0:Date.now()}; st.skipThis = true; cur = idx(item().id);
  st.tier = st.mode === "test" ? 0 : tierOf(item().id); loadStep(); }

// a run in progress is saved after every change, so leaving mid-lesson loses nothing
function saveRun(){
  if (!st) return;
  const {steps, vals, feedback, ...keep} = st;
  save.run = keep;
  persist();
}
function runIndex(){
  const r = save.run; if (!r) return -1;
  return idx(r.items ? r.items[r.i].id : r.id || ["add","sub","mix"][r.cur]); // older saves stored a position
}
function resumeRun(){
  const r = save.run;
  if (!r || runIndex() < 0) { delete save.run; return; }
  if (!r.items){ // a save from before tests: one lesson, a fixed list of problems
    const id = LESSONS[runIndex()].id;
    st = { mode:"practice", key:id, title:LESSONS[runIndex()].title, items:r.problems.map(p => ({id, p})), i:r.i, clean:r.clean||0, mistakes:[], probs:[],
           xpEarned:r.xpEarned||0, hints:0, shown:0, extra:0, pts:0, maxPts:0, t0:Date.now(), hintsLeft:4 };
    startProblem();
  } else {
    st = Object.assign({}, r);
    cur = idx(item().id);
    const {misses, hinted} = r; loadStep(); // st.step and st.work come back from the save
    Object.assign(st, {misses: misses || 0, hinted: !!hinted});
  }
  view = "practice";
}
function loadStep(){
  const lo = lessonOf(item());
  st.steps = [...(item().p.story && lo.story ? [opStep(lo, item().p)] : []), ...lo.steps(item().p)].map((s,k) => ({...s, base:s.label.replace(/^Step \d+ · /,""), label: /^Step /.test(s.label) ? s.label : `Step ${k+1} · ${s.label}`}));
  const lead = st.steps.length && st.steps[0].choices ? 1 : 0; // a word problem starts by choosing the operation
  if (st.skip && st.skipThis && canSkip() && st.step === lead && st.steps.length - lead > 1){
    st.steps = [...st.steps.slice(0, lead), finalStep(finalParts(item().id, st.steps.slice(lead)))];
  }
  st.pick = planFor();
  st.vals = {};
  st.misses = 0; st.hinted = false; st.lastTry = 0; st.stepT0 = Date.now();
  st.active = slotIds()[0];
  st.feedback = null;
}
function slotIds(){
  const s = st.steps[st.step]; if (!s || s.choices || st.pick) return [];
  return [...s.ask().matchAll(/data-slot="(\w+)"/g)].map(m=>m[1]);
}

// ---- mistake detection: name the slip, not just "wrong" ----
const CATS = {
  sign:   ["Sign mix-up", "The size of the number was right but the sign was flipped.", "Before checking, ask: should this be positive or negative?"],
  reuse:  ["Reused an earlier number", "Typed the answer from an earlier step instead of doing the new one.", "Read what each new step is asking before answering."],
  place:  ["Place value or decimal point", "The digits were right but a zero or the decimal point was in the wrong place.", "Estimate first, then line up place values."],
  off1:   ["Off by one", "Answers exactly 1 away: usually a counting or small adding slip.", "Count again slowly, or check by working backwards."],
  digits: ["Digits mixed up", "The right digits typed in the wrong order.", "Read the answer back before tapping Check."],
  close:  ["Arithmetic slip", "Right method, but the arithmetic was a little off.", "Redo the multiplying or adding carefully; an estimate catches these."],
  swap:   ["Boxes swapped", "The right numbers in the wrong boxes.", "Check which box is which before typing."],
  flip:   ["Fraction flipped", "Top and bottom of the fraction were switched.", "The part goes on top and the whole on the bottom."],
  plan:   ["Picked the wrong next step", "Knew how to do the steps but not which one comes next.", "Before solving, say the plan out loud: what has to happen first?"],
  method: ["Didn't know the step yet", "The answer wasn't close and didn't match a common slip.", "Go back over the lesson cards for this step together."],
};
const SAY = {
  sign: "So close! The size is right. Check the sign: should it be positive or negative?",
  reuse: "That's the number from an earlier step. This step asks for something new.",
  place: "The digits look right. Check where the zeros or the decimal point go.",
  off1: "Just 1 away! Count again carefully.",
  digits: "Right digits, wrong order. Read it back.",
  close: "Close! Redo the arithmetic carefully.",
  swap: "Right numbers, wrong boxes. Swap them.",
  flip: "Flipped! Check which number goes on top.",
};
const digitsOf = x => String(Math.abs(round6(x))).replace(".","").split("").sort().join("");
function diagnose(s, v){
  const A = s.answer, ids = Object.keys(A).filter(k => A[k] != null);
  if (ids.length === 2 && ids.includes("n") && ids.includes("d")){
    if (A.n !== 0 && eq(v.n * A.n, v.d * A.d) && !eq(v.n, A.n)) return "flip";
    if (A.n !== 0 && eq(v.n * A.d, -A.n * v.d)) return "sign";
    return "method";
  }
  if (ids.length > 1){
    const a = ids.map(k => A[k]), x = ids.map(k => v[k]), srt = arr => [...arr].sort((p,q)=>p-q);
    if (srt(a).every((t,i) => eq(t, srt(x)[i]))) return "swap";
    if (ids.every(k => eq(v[k], A[k]) || eq(v[k], -A[k]))) return "sign";
    return "method";
  }
  const a = A[ids[0]], x = v[ids[0]];
  if (x == null) return "method";
  if (a !== 0 && eq(x, -a)) return "sign";
  const earlier = st.steps.slice(0, st.step).flatMap(t => Object.values(t.answer));
  if (earlier.some(e => eq(e, x))) return "reuse";
  if (a !== 0 && [10,100,1000,.1,.01,.001].some(f => eq(x, a*f))) return "place";
  if (Number.isInteger(a) && eq(Math.abs(x-a), 1)) return "off1";
  if (Math.abs(a) >= 10 && digitsOf(x) === digitsOf(a)) return "digits";
  if (a !== 0 && Math.abs(x-a) / Math.abs(a) <= .1) return "close";
  return "method";
}
// an answer we don't recognise still gets a pointer: too big or too small, or which boxes are already right
function nudge(s, v){
  const A = s.answer, ids = Object.keys(A).filter(k => A[k] != null), little = band() === "little";
  const say = (got, want) => eq(got, want) ? "" : got > want ? (little ? "Too many! Count again." : "That's too big.") : (little ? "Too few! Count again." : "That's too small.");
  if (ids.includes("n") && ids.includes("d")){
    if (v.n == null || !v.d) return "";
    const want = (A.w || 0) + A.n / A.d, got = (v.w || 0) + v.n / v.d;
    return eq(want, got) ? "That's the right amount, but write it the way this step asks." : say(got, want);
  }
  if (ids.length > 1){
    const right = ids.filter(k => eq(v[k], A[k])).length;
    return right ? `${right === 1 ? "One box is" : `${right} boxes are`} right. Check the other${ids.length - right === 1 ? "" : "s"}.` : "";
  }
  const x = v[ids[0]];
  return x == null ? "" : say(x, A[ids[0]]);
}
const typed = v => v.c !== undefined && v.c !== null && st && st.steps[st.step] && st.steps[st.step].choices ? st.steps[st.step].choices[v.c]
  : v.n !== undefined && v.d !== undefined ? (v.d === 1 ? fmt(v.n) : `${fmt(v.n)}/${fmt(v.d)}`)
  : Object.values(v).filter(x => x != null).map(fmt).join(", ");

function check(){
  const s = st.steps[st.step];
  const v = {};
  if (st.pick){ st.feedback = {type:"hint", html:"First pick the step that comes next."}; st.fx = {fb:true}; return; }
  if (s.choices) v.c = st.vals.c == null ? null : Number(st.vals.c);
  for (const id of slotIds()) v[id] = parseNum(st.vals[id]);
  if (Object.values(v).every(x => x == null)) { st.feedback = {type:"hint", html:"Tap a box and use the number pad to type your answer."}; st.fx = {fb:true}; return; }
  const r = s.check(v);
  if (r.ok) return pass(false);
  if (r.soft){ st.feedback = {type:"hint", html:r.msg}; st.fx = {fb:true}; return; }
  const now = Date.now(), rushed = st.misses >= 1 && now - st.lastTry < 4000; // quick repeat tries look like guessing
  st.lastTry = now; st.misses++; st.prob.wrong++; st.fx = {shake:true};
  const cat = r.generic ? diagnose(s, v) : "concept";
  st.mistakes.push({n:st.i+1, step:st.step+1, label:s.base, id:item().id, typed:typed(v), want:typed(s.answer),
    kind: cat === "concept" ? r.kind : CATS[cat][0], cat, msg: cat === "concept" ? r.msg : CATS[cat][1], rushed});
  if (s.skipped){ // the shortcut missed: do this one the long way
    st.skipThis = false; st.pts += 0; st.maxPts++; loadStep();
    st.feedback = {type:"bad", html:`<strong>Not quite.</strong> Let's do this one step by step.`};
    return;
  }
  if (st.mode === "test"){
    st.vals = Object.fromEntries(Object.entries(s.answer).filter(([k,x])=>x!=null).map(([k,x])=>[k, fmt(x)]));

    st.feedback = {type:"hint", html:`Not this time. The answer was <b>${typed(s.answer)}</b>. ${st.steps[st.step] ? "Keep going." : ""}`};
    return;
  }
  const msg = cat === "concept" ? r.msg : SAY[cat] || `${nudge(s, v)} ${st.hinted ? s.hint : `Read the step again${st.hintsLeft ? ", or tap Hint" : ""}.`}`;
  st.feedback = {type:"bad", html:`<strong>Not yet.</strong> ${msg}${rushed ? " <br>Slow down a little and read the step again." : ""}${canShow() ? " <br>Stuck? Tap <b>Show me</b>." : ""}`};
}
// hints are limited: about one for every two problems, and only after a first try
function hint(){

  if (st.hinted){ st.feedback = {type:"hint", html:`<strong>Hint:</strong> ${s.hint}`}; return; }
  if (!st.hintsLeft){ st.feedback = {type:"hint", html:"No hints left in this lesson. Give it your best try. <b>Show me</b> opens after two tries."}; return; }
  if (!st.misses && Date.now() - st.stepT0 < 15000){ st.feedback = {type:"hint", html:"Give it one try first. The hint opens after you try."}; return; }
  st.hinted = true; st.hintsLeft--; st.hints++; st.prob.hints++;
  st.feedback = {type:"hint", html:`<strong>Hint:</strong> ${s.hint}`};
}
function pass(shown){
  const s = st.steps[st.step];

  st.pts += shown ? 0 : st.mode === "test" ? 1 : st.misses === 0 ? (st.hinted ? .5 : 1) : st.misses === 1 ? .5 : .25;
  st.maxPts++;

  st.step++; st.fx = {line:true};
  if (st.step < st.steps.length){
    const praise = PRAISE[band()][rand(0,4)];
    const msg = shown ? `Here's how: ${s.explain}` : praise;

    return;
  }

  const xp = st.mode === "test" ? (pr.wrong ? 5 : 15) : pr.shown ? 5 : pr.wrong ? 10 : pr.hints ? 12 : 15;
  st.xpEarned += xp;
  if (clean) st.clean++;
  st.probs.push({id:item().id, p:item().p, work:st.work, hints:pr.hints, wrong:pr.wrong, shown:pr.shown, ms:Date.now()-pr.t0});
  let more = "";
  if (st.mode !== "test" && (pr.wrong || pr.shown) && st.items.length < MAX_LEN){
    st.items.push(makeItem(lessonOf(item()), st.items.length)); st.extra++;

  }
  st.feedback = {type:"good", html: st.mode === "test" ? `<strong>Problem done. +${xp} XP</strong>`
    : shown ? `Here's how: ${s.explain} <br><strong>+${xp} XP.</strong> That one was tricky, and you finished it.${more}`
    : band() === "little" ? `<span class="pop big">🎉</span> <strong>You solved it! +${xp} XP</strong>${more}`
    : ["middle","high"].includes(band()) ? `<strong>Solved. +${xp} XP</strong>${clean ? " (no mistakes)" : ""}${more}`
    : `<span class="pop">⭐</span> <strong>Solved! +${xp} XP</strong>${clean ? " (no mistakes bonus)" : ""}${more}`};
}
function showMe(){
  const s = st.steps[st.step];
  st.vals = Object.fromEntries(Object.entries(s.answer).filter(([k,v])=>v!=null).map(([k,v])=>[k, fmt(v)]));
  st.shown++; st.prob.shown++;

}
function nextProblem(){
  if (st.i < st.items.length-1){ st.i++; startProblem(); return; }
  const pct = st.maxPts ? st.pts / st.maxPts : 0, level = levelOf(pct), now = Date.now();
  const rep = {key:st.key, mode:st.mode, title:st.title, date:now, ms:now-st.t0, total:st.items.length, extra:st.extra, clean:st.clean,
    hints:st.hints, shown:st.shown, pct, level, xp:st.xpEarned, probs:st.probs, mistakes:st.mistakes};
  save.xp += st.xpEarned;
  const rg = st.mode === "test" ? Number(st.key.split(":")[1]) : st.mode === "review" ? save.grade : LESSONS[idx(st.key)].grade;
  save.gxp[rg] = (save.gxp[rg] || 0) + st.xpEarned;
  const today = new Date().toDateString(), yest = new Date(now-864e5).toDateString(), prevStreak = save.streak;
  if (save.last !== today) save.streak = save.last === yest ? save.streak + 1 : 1;
  save.last = today;
  const book = st.mode === "test" ? save.tests : st.mode === "practice" ? save.scores : null, old = book && book[st.key];
  // a new badge, or a badge turning gold, when a test score reaches 3 or 4 for the first time
  if (st.mode === "test") rep.badge = {key:st.key, level, isNew: level >= 3 && (!old || old.best < 3), gold: level === 4 && (!old || old.best < 4)};
  if (book) book[st.key] = {last:level, best:Math.max(level, old ? old.best : 0), pct, date:now, mastered: !!(old && old.mastered) || (level === 4 && st.startTier === 2)};
  if (st.mode === "practice"){ save.done++; save.lessons[st.key] = lessonDone(st.key) + 1; }
  if (st.mode === "review") save.reviews[today] = level;
  for (const it of st.items) save.seen[it.id] = now;
  const cats = {}; st.mistakes.forEach(m => cats[m.kind] = (cats[m.kind]||0) + 1);
  save.log.unshift({key:st.key, mode:st.mode, title:st.title, date:now, level, total:rep.total, hints:rep.hints, shown:rep.shown, cats,
    rushed: st.mistakes.filter(m => m.rushed).length});
  save.log = save.log.slice(0, 60);
  save.reports[st.key] = rep;
  delete save.run; persist(true);
  st.report = rep;
  view = "done";
}
// ---- daily review: problems from lessons she has already done, weighted to low scores and long gaps ----
function reviewPool(){
  const now = Date.now();
  return LESSONS.filter(l => save.scores[l.id]).map(l => { const sc = save.scores[l.id], days = (now - (save.seen[l.id] || sc.date || now)) / 864e5;
    return {l, w: (5 - sc.last) * (1 + days / 3)}; });
}
function startReview(){
  const pool = reviewPool(), each = pool.length >= 4 ? 2 : 4, n = Math.min(8, pool.length * each), items = [];
  while (items.length < n){
    const live = pool.filter(x => (x.n || 0) < each), tot = live.reduce((a, x) => a + x.w, 0);
    let r = Math.random() * tot, k = 0;
    while (k < live.length - 1 && r > live[k].w){ r -= live[k].w; k++; }
    live[k].n = (live[k].n || 0) + 1; items.push(makeItem(live[k].l, rand(1, 8)));
  }
  newRun("review", shuffle(items), {key:"review", title:"Today's review", hintsLeft:4});
  view = "practice";
}

// ---- summaries: what she did, and a closer look for the grown-up ----
const when = t => new Date(t).toLocaleDateString(undefined, {month:"short", day:"numeric"});
const mins = ms => Math.max(1, Math.round(ms / 60000));
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
function summaryLine(rep){
  const pct = Math.round(rep.pct * 100);

    ? `${plural(rep.total, "problem")} in ${plural(mins(rep.ms), "minute")}. ${rep.clean} with every step right. ${pct}% of steps right on the first try.`
    : `${plural(rep.total, "problem")} in ${plural(mins(rep.ms), "minute")}${rep.extra ? `, including ${rep.extra} extra added for practice` : ""}. ${rep.clean} with no mistakes and no hints. ${plural(rep.hints, "hint")} used, "Show me" ${plural(rep.shown, "time")}. ${pct}% of steps right on the first try.`;
}
function reportHTML(rep){

  const sorted = Object.entries(groups).sort((a,b) => b[1].n - a[1].n);
  const rushed = rep.mistakes.filter(m => m.rushed).length;
  const lessonsIn = [...new Set(rep.probs.map(p => p.id))];
  const skills = lessonsIn.map(id => { const l = LESSONS[idx(id)]; return l ? `<b>${l.title}</b>` : ""; }).filter(Boolean);
  return `<section class="panel">
    <div class="head"><h2>What you did</h2><span class="muted">${when(rep.date)}</span></div>
    <div class="prose" style="padding:0 5px"><p>${rep.mode === "test" ? `Tested ${skills.join(", ")}.` : `Practiced ${skills.join(", ")}.`}</p><p>${summaryLine(rep)}</p></div>
    <div class="probs">${rep.probs.map((pr,k) => { const l = LESSONS[idx(pr.id)]; if (!l) return "";
      const tag = pr.shown ? ["busy", `shown ${pr.shown}×`] : pr.wrong ? ["err", plural(pr.wrong, "mistake")] : pr.hints ? ["busy", plural(pr.hints, "hint")] : ["ok", "no mistakes"];
      return `<details class="card"><summary><span class="badge">${k+1}</span><span class="name">${rep.mode !== "practice" ? l.title : `Problem ${k+1}`}</span><span class="dot ${tag[0]}"></span><span class="muted">${tag[1]}</span></summary>
        ${showItem({id:pr.id, p:pr.p})}<div class="work">${pr.work.map((w,j)=>`<div class="workline ${w.shown?"shown":""}"><span class="k">Step ${j+1}</span><span class="wl">${w.html}</span></div>`).join("")}</div></details>`; }).join("")}</div>
  </section>
  <section class="panel">
    <div class="head"><h2>For the grown-up</h2>${scoreChip(rep.level, true)}</div>
    <div class="prose" style="padding:0 5px"><p>Score ${rep.level} of 4: ${LEVELS[rep.level]}. ${["Not yet showing this skill.","Starting to get it, with a lot of help.","Getting there: some steps are solid, others need more practice.","Meets the goal: most steps right on the first try.","Above the goal: nearly every step right on the first try."][rep.level]}</p>
    ${rushed ? `<p>${plural(rushed, "answer")} came very quickly after a miss, which usually means guessing.</p>` : ""}</div>
    ${sorted.length ? `<h3 class="label" style="padding:0 5px">Mistake patterns, most common first</h3>

const badgeKeys = g => [...unitsOf(g).map(u => testKey(g, u.name)), testKey(g)];

const badgeCard = (key, have, gold) => `<div class="bdg${have ? "" : " none"}${gold ? " gold" : ""}"><div class="art">${badgeSVG(key, have, 0, gold)}</div></div>`;
let bookGrade = null;
function badgesHTML(){
  const g = bookGrade ?? save.grade, [got, all] = badgeCount(g), gk = testKey(g), gl = badgeLevel(gk);
  return `<div class="bar"><button class="ctl circ" data-go="home" aria-label="Home">${HOME_ICON}</button><span class="ctl grow" style="background:none">Badge book</span><span class="ctl badged"><span class="badge on">${got}</span>of <span class="mono">${all}</span></span></div>
  <nav class="gtabs" aria-label="Grade">${GRADES.map((n, i) => { const [c] = badgeCount(i); return `<button class="${i === g ? "on" : ""}" data-bookgrade="${i}">${n}${c ? `<small>${c}</small>` : ""}</button>`; }).join("")}</nav>
  <div class="bbook">
    <section class="tile crown">${badgeCard(gk, gl, gl === 4)}<h2>${GRADE_NAME[g].split(" · ")[0]}</h2>
      <p class="muted">${gl ? `Check-up passed with a ${gl}${gl === 4 ? ". Gold!" : ". Score a 4 to make it gold."}` : "Pass the grade check-up with a 3 or more to earn the big badge."}</p>
      <button class="ctl${gl ? "" : " go"}" data-test="${gk}">${gl ? "Retake check-up" : "Take the check-up"}</button></section>
    <section class="tile"><div class="unit"><h3>Unit badges</h3><span class="muted">${got - (gl ? 1 : 0)} of ${all - 1}</span></div>
      <div class="bslots">${unitsOf(g).map(u => { const k = testKey(g, u.name), lv = badgeLevel(k);
        return `<div class="bdg${lv ? "" : " none"}${lv === 4 ? " gold" : ""}"><div class="art">${badgeSVG(k, lv, 0, lv === 4)}</div><span class="nm">${u.name}</span>${lv ? `<span class="sub">${lv === 4 ? "Gold · score 4" : "Score 3 · a 4 makes it gold"}</span>` : `<button class="ctl" data-test="${k}">Unit test</button>`}</div>`; }).join("")}</div>
    </section>
  </div>
  <p class="helpline muted">Each unit test earns a badge at a score of 3 or more, and a gold one at 4. The grade check-up earns the big star.</p>`;
}

// ---- input ----
function updateSlots(typedId){
  document.querySelectorAll("#app .slot").forEach(b => {
    const id = b.dataset.slot; b.textContent = st.vals[id] ?? ""; b.classList.toggle("active", st.active === id);
    if (id === typedId){ b.classList.remove("typed"); void b.offsetWidth; b.classList.add("typed"); }
  });
  saveRun();
}
function key(k){
  if (view !== "practice" || !st.steps[st.step]) return;
  const ids = slotIds();
  if (k === "next"){ st.active = ids[(ids.indexOf(st.active)+1) % ids.length]; return updateSlots(); }
  if (k === "back"){ st.vals[st.active] = String(st.vals[st.active] ?? "").slice(0,-1); return updateSlots(); }
  let cur = String(st.vals[st.active] ?? "");
  if (k === "−") cur = cur.startsWith("−") ? cur.slice(1) : "−" + cur;
  else if (k === ".") { if (!cur.includes(".")) cur = (cur === "" || cur === "−" ? cur + "0" : cur) + "."; }
  else if (cur.replace(/[−.]/g,"").length < 6) cur = (cur === "0" ? "" : cur === "−0" ? "−" : cur) + k;
  st.vals[st.active] = cur;
  updateSlots(st.active);
}
function goLearn(step){
  const L = LESSONS[cur].learn.length; // the last card is the worked example
  const to = Math.max(0, Math.min(L, learnIdx + step));
  if (to === learnIdx) return;
  learnIdx = to; render(step > 0 ? "fwd" : "back");
}
document.addEventListener("click", e => {
  if (e.target.dataset && e.target.dataset.close){ sheetOpen = false; return render(); }
  const shot = e.target.closest(".lshot"); if (shot){ const pic = shot.querySelector(".viz-svg,.rs"); if (pic) pic.replaceWith(pic.cloneNode(true)); return; }
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  if (t.dataset.act === "replay"){ const v = t.closest(".viz"), pic = v.querySelector(".viz-svg,.rs"); if (pic) pic.replaceWith(pic.cloneNode(true)); return; }
  if (t.dataset.slot){ st.active = t.dataset.slot; return updateSlots(); }
  if (t.dataset.key) return key(t.dataset.key);
  if (t.dataset.pick){ pickStep(Number(t.dataset.pick)); return render(); }
  if (t.dataset.choice){ st.vals.c = t.dataset.choice; check(); return render(); }
  if (t.dataset.learn) return goLearn(Number(t.dataset.learn));
  let dir = "";
  if (t.dataset.grade){ save.grade = Number(t.dataset.grade); save.chosen = 1; sheetOpen = false; if (view === "welcome") view = "home"; persist(); }
  else if (t.dataset.act === "grades"){ sheetOpen = true; }
  else if (t.dataset.act === "closesheet"){ sheetOpen = false; }
  else if (t.dataset.lesson){ const to = Math.max(0, Math.min(LESSONS.length-1, Number(t.dataset.lesson))); dir = view === "learn" ? (to > cur ? "fwd" : "back") : ""; cur = to; view = "learn"; learnIdx = 0; newExample(); }
  else if (t.dataset.test){ startTest(t.dataset.test); view = "practice"; }
  else if (t.dataset.report){ reportKey = t.dataset.report; if (idx(reportKey) >= 0) cur = idx(reportKey); view = "report"; }
  else if (t.dataset.walk){
    const steps = LESSONS[cur].steps(learnEx.p).length;
    if (t.dataset.walk === "next") { learnEx.n = Math.min(steps, learnEx.n + 1); learnEx.fresh = true; }
    else if (t.dataset.walk === "all") { learnEx.n = steps; }
    else { newExample(); }
  }
  else if (t.dataset.go){
    if (t.dataset.go === "learn" && view === "practice") learnIdx = LESSONS[cur].learn.length; // back to the worked example
    else if (t.dataset.go === "learn") learnIdx = 0;
    view = t.dataset.go;
    if (view === "practice") startPractice();
  }
  else if (t.dataset.act === "check") check();
  else if (t.dataset.act === "hint") hint();
  else if (t.dataset.act === "show") showMe();
  else if (t.dataset.act === "nextprob") nextProblem();
  else if (t.dataset.act === "resume") resumeRun();
  else if (t.dataset.act === "review") startReview();
  else if (t.dataset.bookgrade != null){ bookGrade = Number(t.dataset.bookgrade); view = "badges"; }
  else if (t.dataset.act === "skip"){ st.skip = !st.skip; st.skipThis = true; const s0 = st.steps[0]; if (st.step === (s0 && s0.choices ? 1 : 0)) loadStep(); }
  else return; // a tap on a summary row opens it natively
  render(dir);
});
// swipe between lesson cards
let touch = null;
document.addEventListener("touchstart", e => { if (view === "learn" && e.touches.length === 1) touch = {x:e.touches[0].clientX, y:e.touches[0].clientY}; }, {passive:true});
document.addEventListener("touchend", e => {
  if (!touch || view !== "learn") return;
  const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y; touch = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) goLearn(dx < 0 ? 1 : -1);
}, {passive:true});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheetOpen){ sheetOpen = false; return render(); }
  if (view === "learn"){ if (e.key === "ArrowRight") goLearn(1); else if (e.key === "ArrowLeft") goLearn(-1); return; }
  if (view !== "practice") return;
  if (st.pick || (st.steps[st.step] && st.steps[st.step].choices)){ if (/^[1-4]$/.test(e.key)){ const b = document.querySelectorAll("#app .choice")[+e.key - 1]; if (b) b.click(); } return; }
  if (/^\d$/.test(e.key)) key(e.key);
  else if (e.key === "-") key("−");
  else if (e.key === ".") key(".");
  else if (e.key === "Backspace") key("back");
  else if (e.key === "Tab"){ e.preventDefault(); key("next"); }
  else if (e.key === "Enter"){ e.preventDefault(); if (st.steps[st.step]) check(); else nextProblem(); render(); }
});
render();
</script>
